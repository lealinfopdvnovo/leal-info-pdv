plugins { id 'com.android.application' }
android {
 namespace 'br.com.lealinfo.vidraceiro'
 compileSdk 35
 defaultConfig { applicationId 'br.com.lealinfo.vidraceiro'; minSdk 26; targetSdk 35; versionCode 22; versionName '0.4.1-qa37'; testInstrumentationRunner 'br.com.lealinfo.vidraceiro.Access37Instrumentation' }
 signingConfigs { debug { storeFile file(System.getProperty('user.home')+'/.android/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes {
  debug { applicationIdSuffix ".ambiente37" }
  release {
   applicationIdSuffix ".ambiente37"
   signingConfig signingConfigs.debug
   debuggable false
   minifyEnabled false
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.13.1'; testImplementation 'junit:junit:4.13.2' }
