name: Restaurar3D original somente001 e003 - 10.403
on:
  push:
    branches: ['release/vidracaria-restaurar3d-001-10403']
permissions: {contents: read, actions: read}
concurrency:
  group: vidracaria-restaurar3d-001-003-10403
  cancel-in-progress: true
jobs:
  validar:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        client: ['001','003']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.client == '001' && github.sha || 'd1525b64db03bc4608aabe020ecfc6e200ec2f05' }}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Auditar10.402 e congelar01-08; somente reintegracao3D
        shell: python
        env: {CLIENT: '${{ matrix.client }}'}
        run: |
          import os,subprocess
          client=os.environ['CLIENT']
          base='3a2ecce364305b4a1d1e6ad039223c73db417fb1' if client=='001' else '2630a738470c8a2c0badc25c184f9369fcba4df8'
          allowed={'GlassProjectForm.cs','LealInfoPDV.csproj','UpdateManager.cs','qa/glass-central-3d/Program.cs','qa/glass-central-3d/LealInfoPDV.GlassCentral3DTests.csproj','docs/restauracao-3d-10.403.md'}
          if client=='001':allowed.add('.github/workflows/restaurar_3d_001_003.yml')
          assert set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())==allowed
          old=subprocess.check_output(['git','show',base+':GlassProjectForm.cs']).decode()
          for before,after in [('        GlassWorkshopForm.AddField(measures, "", message);\n        GlassWorkshopForm.AddField(printing, "IMPRESSÃO TÉCNICA A4", print);\n        printOwner = owner;\n        status.Controls.Add(viewHint); viewHint.Dock = DockStyle.Fill;\n        void MoveSurface(bool three)\n        {\n            if (three) visualization.Controls.Add(surface); else design.Controls.Add(surface);\n            surface.Dock = DockStyle.Fill; surface.BringToFront();\n            if (three) Show3D(); else Show2D();\n        }\n        var viewFooter = new Panel { Dock = DockStyle.Bottom, Height = 44 };\n        visualization.Controls.Add(viewFooter);\n        reset3D.Dock = DockStyle.Left; viewFooter.Controls.Add(reset3D);\n        measurements3D.Dock = DockStyle.Right; viewFooter.Controls.Add(measurements3D);\n        tabs.SelectedIndexChanged += (_, _) =>\n        {\n            if (tabs.SelectedTab == visualization) MoveSurface(true);\n            else { Show2D(); if (tabs.SelectedTab == design) MoveSurface(false); }\n', '        GlassWorkshopForm.AddField(measures, "", message);\n        GlassWorkshopForm.AddField(printing, "IMPRESSÃO TÉCNICA A4", print);\n        printOwner = owner;\n        status.Controls.Add(viewHint); viewHint.Dock = DockStyle.Fill;\n        // Reintegra o seletor original, antes retido na janela de projeto não exibida.\n        var modes = mode2D.Parent!;\n        modes.Dock = DockStyle.Top; modes.Height = 42;\n        void MoveSurface(bool three)\n        {\n            var page = three ? visualization : design;\n            page.Controls.Add(modes); page.Controls.Add(surface);\n            surface.Dock = DockStyle.Fill; surface.BringToFront();\n            if (three) Show3D(); else Show2D();\n        }\n        var viewFooter = new Panel { Dock = DockStyle.Bottom, Height = 44 };\n        visualization.Controls.Add(viewFooter);\n        reset3D.Dock = DockStyle.Left; viewFooter.Controls.Add(reset3D);\n        measurements3D.Dock = DockStyle.Right; viewFooter.Controls.Add(measurements3D);\n        mode2D.Click += (_, _) => tabs.SelectedTab = design;\n        mode3D.Click += (_, _) => tabs.SelectedTab = visualization;\n        tabs.SelectedIndexChanged += (_, _) =>\n        {\n            if (tabs.SelectedTab == visualization) MoveSurface(true);\n            else { Show2D(); if (tabs.SelectedTab == design) MoveSurface(false); }\n')]:
              assert old.count(before)==1
              old=old.replace(before,after,1)
          assert old==subprocess.check_output(['git','show','HEAD:GlassProjectForm.cs']).decode()
          for f in ['LealInfoPDV.csproj','UpdateManager.cs']:assert subprocess.check_output(['git','show',base+':'+f]).replace(b'10.402',b'10.403')==subprocess.check_output(['git','show','HEAD:'+f])
          assert subprocess.check_output(['git','rev-parse','HEAD:GlassBox3DView.cs']).decode().strip()=='9f401c10f640dbf61191b53937c93161358334de'
          print('PASS renderizador/cotas2D3D e passos01-08 byte-congelados; particularidades individuais preservadas')
      - name: Conferir canal e pacote de origem REAL
        shell: pwsh
        env: {CLIENT: '${{ matrix.client }}'}
        run: |
          $ErrorActionPreference='Stop'
          $version='10.402'
          $sha=if($env:CLIENT -eq '001'){'225be5616fa3cfeb644e5105c4c578733be6968a853d4fec9bb0e85b8cdc4b26'}else{'b1e0c1ccadad39f130d0480a43e2d621af691eb9cea7dcad174a84feb6afa592'}
          $m=Invoke-RestMethod "https://raw.githubusercontent.com/lealinfopdvnovo/leal-info-pdv-updates/main/clients/$env:CLIENT/version.json"
          if($m.Version -ne $version -or $m.TargetClientCode -ne $env:CLIENT -or $m.Sha256 -ne $sha){throw 'Origem mudou'}
          Invoke-WebRequest $m.PackageUrl -OutFile baseline.zip
          if((Get-FileHash baseline.zip).Hash.ToLowerInvariant() -ne $sha){throw 'Hash origem divergiu'}
          Expand-Archive baseline.zip baseline
      - name: Reproduzir BASE10.402 - seletor ausente e motor ainda presente
        shell: pwsh
        env: {CLIENT: '${{ matrix.client }}'}
        run: |
          $ErrorActionPreference='Stop'
          $base=if($env:CLIENT -eq '001'){'3a2ecce364305b4a1d1e6ad039223c73db417fb1'}else{'2630a738470c8a2c0badc25c184f9369fcba4df8'}
          $reference=Join-Path $env:RUNNER_TEMP ('baseline3d-'+$env:CLIENT)
          git worktree add --detach $reference $base
          if($LASTEXITCODE -ne 0){throw 'Baseline nao obtida'}
          Copy-Item qa/glass-central-3d (Join-Path $reference 'qa') -Recurse
          Push-Location $reference
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
          dotnet run --project qa/glass-central-3d/LealInfoPDV.GlassCentral3DTests.csproj -c Release -- --baseline
          if($LASTEXITCODE -ne 0){throw 'Causa3D nao comprovada na base10.402'}
          Pop-Location
      - name: Build e novo financeiro/agenda pelo fluxo REAL Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
          dotnet build LealInfoPDV.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Build falhou'}
          if($env:GITHUB_ACTIONS -ne 'true'){throw 'Exige Windows descartavel'}
          $sandbox=Join-Path $env:LOCALAPPDATA 'LealInfoPDV'
          if(Test-Path $sandbox){Remove-Item $sandbox -Recurse -Force}
          dotnet build qa/glass-operations/LealInfoPDV.GlassOperationsTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'QA05/06 nao compilou'}
          $p=Start-Process dotnet -ArgumentList 'qa/glass-operations/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.GlassOperationsTests.dll' -PassThru -NoNewWindow -RedirectStandardOutput ops-stdout.log -RedirectStandardError ops-stderr.log
          $done=$p.WaitForExit(120000)
          if(!$done){$p.Kill($true);$p.WaitForExit()}
          Get-Content ops-stdout.log
          Get-Content ops-stderr.log
          if(!$done -or $p.ExitCode -ne 0){throw 'Financeiro/agenda/UI/persistencia falhou'}
          Remove-Item $sandbox -Recurse -Force
          dotnet build qa/glass-finance-history/LealInfoPDV.GlassFinanceHistoryTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'QA historico nao compilou'}
          $p=Start-Process dotnet -ArgumentList 'qa/glass-finance-history/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.GlassFinanceHistoryTests.dll' -PassThru -NoNewWindow -RedirectStandardOutput history-stdout.log -RedirectStandardError history-stderr.log
          $done=$p.WaitForExit(120000)
          if(!$done){$p.Kill($true);$p.WaitForExit()}
          Get-Content history-stdout.log
          Get-Content history-stderr.log
          if(!$done -or $p.ExitCode -ne 0){throw 'Tres linhas moeda e novo processo falhou'}
          Remove-Item $sandbox -Recurse -Force
          dotnet build qa/glass-documents/LealInfoPDV.GlassDocumentsTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'QA07/08 nao compilou'}
          $p=Start-Process dotnet -ArgumentList 'qa/glass-documents/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.GlassDocumentsTests.dll' -PassThru -NoNewWindow -RedirectStandardOutput docs-stdout.log -RedirectStandardError docs-stderr.log
          $done=$p.WaitForExit(180000)
          if(!$done){$p.Kill($true);$p.WaitForExit()}
          Get-Content docs-stdout.log
          Get-Content docs-stderr.log
          if(!$done -or $p.ExitCode -ne 0){throw 'Recibos contratos UI backup persistencia revisoes fonte real falhou'}
          Remove-Item $sandbox -Recurse -Force
          dotnet build qa/glass-central-3d/LealInfoPDV.GlassCentral3DTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'QA3D nao compilou'}
          $p=Start-Process dotnet -ArgumentList 'qa/glass-central-3d/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.GlassCentral3DTests.dll' -PassThru -NoNewWindow -RedirectStandardOutput restore3d-stdout.log -RedirectStandardError restore3d-stderr.log
          $done=$p.WaitForExit(180000)
          if(!$done){$p.Kill($true);$p.WaitForExit()}
          Get-Content restore3d-stdout.log
          Get-Content restore3d-stderr.log
          if(!$done -or $p.ExitCode -ne 0){throw 'Restauracao3D pela Central e novo processo falhou'}
      - name: Regressao completa Windows por cliente - passos01-04 e financeiro original
        shell: pwsh
        env: {CLIENT: '${{ matrix.client }}'}
        run: |
          $ErrorActionPreference='Stop'
          $tests=Get-ChildItem qa -Recurse -Filter '*.csproj'|Where-Object {$_.FullName -notmatch '[\\/](speedfood|port001|port003|glass-operations|glass-finance-history|glass-documents|glass-central-3d)[\\/]'}|Sort-Object FullName
          foreach($test in $tests){
            $sandbox=Join-Path $env:LOCALAPPDATA 'LealInfoPDV'
            if(Test-Path $sandbox){Remove-Item $sandbox -Recurse -Force}
            Write-Host ('TEST SUITE '+$test.FullName)
            $argsExtra=@()
            if($test.FullName -match '[\\/]kitchen[\\/]'){$argsExtra=@('--','--global')}
            if($test.FullName -match '[\\/](company-cep|sales-logo)[\\/]'){$argsExtra=@('--',$env:CLIENT)}
            dotnet run --project $test.FullName -c Release @argsExtra
            if($LASTEXITCODE -ne 0){throw ('Regressao falhou: '+$test.FullName)}
          }
      - name: Compilar pacote dirigido sem banco/licenca/configuracoes
        shell: pwsh
        env: {CLIENT: '${{ matrix.client }}'}
        run: |
          $ErrorActionPreference='Stop'
          $deps=Get-Content baseline/LealInfoPDV.deps.json -Raw|ConvertFrom-Json
          $sdk=$deps.libraries.PSObject.Properties.Name|Where-Object {$_ -like 'runtimepack.Microsoft.Windows.SDK.NET.Ref/*'}|Select-Object -First 1
          if(!$sdk){throw 'SDK origem ausente'}
          dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -p:WindowsSdkPackageVersion=$($sdk.Split('/')[1]) -o publish
          if($LASTEXITCODE -ne 0){throw 'Publish build falhou'}
          New-Item -ItemType Directory package|Out-Null
          'LealInfoPDV.exe','LealInfoPDV.dll','LealInfoPDV.deps.json'|ForEach-Object {Copy-Item "publish/$_" package/}
          $before=Get-Content baseline/LealInfoPDV.deps.json -Raw|ConvertFrom-Json -AsHashtable
          $after=Get-Content package/LealInfoPDV.deps.json -Raw|ConvertFrom-Json -AsHashtable
          if(Compare-Object @($before.libraries.Keys|Where-Object {$_ -notlike 'LealInfoPDV/*'}|Sort-Object) @($after.libraries.Keys|Where-Object {$_ -notlike 'LealInfoPDV/*'}|Sort-Object)){throw 'Dependencias mudaram'}
          Compress-Archive package/* "LEAL_INFO_PDV_$($env:CLIENT)_V10_403_UPDATE.zip"
      - name: Validar PDF/A4 antes e depois com clientes e sem receita automatica
        shell: pwsh
        run: |
          python -m pip install pypdf
          @'
          from pypdf import PdfReader
          from pathlib import Path
          files=list(Path('glass-commercial-evidencias').glob('*.pdf'))+list(Path('glass-money-evidencias').glob('*.pdf'))+list(Path('glass-client-link-evidencias').glob('*.pdf'))+list(Path('glass-operations-evidencias').glob('*.pdf'))+list(Path('glass-documents-evidencias').glob('*.pdf'))
          assert len(files)>=18
          for f in files:
              r=PdfReader(f,strict=True)
              assert len(r.pages)>0
              for p in r.pages:
                  assert abs(float(p.mediabox.width)-595.28)<1 and abs(float(p.mediabox.height)-841.89)<1 and len(p.images)>0
              print('PASS PDF A4',f,len(r.pages))
          '@ | python
          if($LASTEXITCODE -ne 0){throw 'PDF invalido'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidracaria-${{ matrix.client }}-10403
          path: |
            *-evidencias/
            ops-stdout.log
            ops-stderr.log
            history-stdout.log
            history-stderr.log
            docs-stdout.log
            docs-stderr.log
            restore3d-stdout.log
            restore3d-stderr.log
            LEAL_INFO_PDV_*_V10_403_UPDATE.zip
          retention-days: 14
  publicar:
    needs: validar
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with: {name: vidracaria-001-10403, path: validado001}
      - uses: actions/download-artifact@v4
        with: {name: vidracaria-003-10403, path: validado003}
      - name: Publicar feeds001/003 ATOMICAMENTE somente apos ambas matrizes aprovadas
        shell: pwsh
        env: {GH_TOKEN: '${{ secrets.UPDATE_REPO_TOKEN }}', SOURCE_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'
          $repo='lealinfopdvnovo/leal-info-pdv-updates'
          $head001=Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/release/vidracaria-restaurar3d-001-10403" -Headers @{Authorization="Bearer $env:SOURCE_TOKEN"}
          $head003=Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/release/vidracaria-restaurar3d-003-10403" -Headers @{Authorization="Bearer $env:SOURCE_TOKEN"}
          if($head001.object.sha -ne $env:GITHUB_SHA -or $head003.object.sha -ne 'd1525b64db03bc4608aabe020ecfc6e200ec2f05'){throw 'Candidato superado'}
          $ref=gh api "repos/$repo/git/ref/heads/main"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Ref updates indisponivel'}
          $parent=$ref.object.sha
          $commit=gh api "repos/$repo/git/commits/$parent"|ConvertFrom-Json
          $baseTree=$commit.tree.sha
          $protected=@{}
          foreach($path in @('version.json','clients/002/version.json')){$entry=gh api "repos/$repo/contents/$($path)?ref=$parent"|ConvertFrom-Json;if($LASTEXITCODE -ne 0){throw 'Protegido indisponivel'};$protected[$path]=$entry.sha}
          $fourBefore=gh api "repos/$repo/contents/clients/004/version.json?ref=$parent" 2>$null
          $fourExists=$LASTEXITCODE -eq 0
          if($fourExists){$fourSha=($fourBefore|ConvertFrom-Json).sha}
          $entries=@();$notes='Restauracao exclusiva acesso3D original na Central: botoes2D/3D reintegrados as abas existentes; mesmo motor, medidas, rotacao/zoom/reset e cotas. Sem novos recursos ou alteracoes01-08, banco, financeiro, agenda, recibos, contratos ou Plano de Corte. Particularidades individuais preservadas. Aguardando homologacao fisica da restauracao3D.'
          $notes|Set-Content notes.txt
          foreach($id in @('001','003')){
            $expected='10.402'
            $oldHash=if($id -eq '001'){'225be5616fa3cfeb644e5105c4c578733be6968a853d4fec9bb0e85b8cdc4b26'}else{'b1e0c1ccadad39f130d0480a43e2d621af691eb9cea7dcad174a84feb6afa592'}
            $entry=gh api "repos/$repo/contents/clients/$id/version.json?ref=$parent"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Canal nao pode ser lido'}
            $old=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($entry.content))|ConvertFrom-Json
            if($old.Version -ne $expected -or $old.Sha256 -ne $oldHash -or $old.TargetClientCode -ne $id){throw 'Origem alterada'}
            $package="LEAL_INFO_PDV_$($id)_V10_403_UPDATE.zip"
            $source=if($id -eq '001'){$env:GITHUB_SHA}else{'d1525b64db03bc4608aabe020ecfc6e200ec2f05'}
            Copy-Item "validado$id/$package" $package
            gh release create "client-$id-v10.403" $package --repo $repo --title "LEAL INFO PDV $id V10.403 - Restauracao3D original Vidracaria" --notes-file notes.txt --latest=false
            if($LASTEXITCODE -ne 0){throw 'Release falhou; feeds ainda intactos'}
            $m=@{Version='10.403';TargetClientCode=$id;PackageUrl="https://github.com/$repo/releases/download/client-$id-v10.403/$package";Sha256=(Get-FileHash $package).Hash.ToLowerInvariant();SourceCommit=$source;Notes=$notes;Mandatory=$false}
            Invoke-WebRequest $m.PackageUrl -OutFile "verificado-$id.zip"
            if((Get-FileHash "verificado-$id.zip").Hash.ToLowerInvariant() -ne $m.Sha256){throw 'Hash remoto divergiu; feeds ainda intactos'}
            $entries+=@{path="clients/$id/version.json";mode='100644';type='blob';content=($m|ConvertTo-Json)}
          }
          @{base_tree=$baseTree;tree=$entries}|ConvertTo-Json -Depth 6|Set-Content tree-request.json
          $tree=gh api --method POST "repos/$repo/git/trees" --input tree-request.json|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Tree falhou'}
          @{message='Vidracaria restauracao3D 10.403 somente001 e003';tree=$tree.sha;parents=@($parent)}|ConvertTo-Json -Depth 5|Set-Content commit-request.json
          $new=gh api --method POST "repos/$repo/git/commits" --input commit-request.json|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Commit falhou'}
          $current=gh api "repos/$repo/git/ref/heads/main"|ConvertFrom-Json
          if($current.object.sha -ne $parent){throw 'Concorrencia; feeds nao alterados'}
          @{sha=$new.sha;force=$false}|ConvertTo-Json|Set-Content ref-request.json
          gh api --method PATCH "repos/$repo/git/refs/heads/main" --input ref-request.json
          if($LASTEXITCODE -ne 0){throw 'Publicacao atomica falhou'}
          foreach($path in $protected.Keys){$entry=gh api "repos/$repo/contents/$path"|ConvertFrom-Json;if($LASTEXITCODE -ne 0 -or $entry.sha -ne $protected[$path]){throw 'Canal protegido alterado'}}
          $fourAfter=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $existsAfter=$LASTEXITCODE -eq 0
          if($existsAfter -ne $fourExists -or ($fourExists -and ($fourAfter|ConvertFrom-Json).sha -ne $fourSha)){throw '004 alterado'}
          foreach($id in @('001','003')){
            for($i=0;$i -lt 24;$i++){$m=Invoke-RestMethod "https://raw.githubusercontent.com/$repo/main/clients/$id/version.json?t=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())";if($m.Version -eq '10.403' -and $m.TargetClientCode -eq $id){break};Start-Sleep -Seconds 5}
            if($m.Version -ne '10.403' -or (Get-FileHash "verificado-$id.zip").Hash.ToLowerInvariant() -ne $m.Sha256){throw 'Feed nao propagou/hash'}
            Write-Host "PASS PUBLICADO $id 10.403; hash remoto confirmado"
          }
          Write-Host 'PASS 002 universal 004 intactos; somente001 e003 atomicamente'
          exit 0
      - name: Deteccao e DOWNLOAD reais separados001/003 com SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
          $original=Get-Content qa/glass/Program.cs -Raw
          foreach($id in @('001','003')){
            $previous='10.402'
            $qa=$original.Replace('id == "003" ? "10.383" : "10.379"','id == "003" ? "10.403" : "10.403"')
            $qa=$qa.Replace('new[] { "001", "002", "003", "004" }',('new[] { "'+$id+'" }'))
            $qa=$qa.Replace('new object[] { http, id, "10.378" }',('new object[] { http, id, "'+$previous+'" }'))
            $qa=$qa.Replace('if (live && id == "003")',('if (live && id == "'+$id+'")'))
            $qa=$qa.Replace('"Hash remoto 003"',('"Hash remoto '+$id+' - DOWNLOAD REAL"'))
            [IO.File]::WriteAllText((Join-Path $PWD 'qa/glass/Program.cs'),$qa)
            dotnet run --project qa/glass/LealInfoPDV.GlassTests.csproj -c Release -- --live
            if($LASTEXITCODE -ne 0){throw "Updater real$id falhou"}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidracaria001003-10403-publicacao
          path: |
            verificado-*.zip
            notes.txt
          retention-days: 14
