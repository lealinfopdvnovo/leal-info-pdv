name: Relatorio financeiro - corrigir 001 e 003
permissions:
  contents: read
  actions: read
concurrency:
  group: cozinha-duplo-clique-001-003
  cancel-in-progress: true
jobs:
  validar:
    runs-on: windows-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ matrix.channel }}
      SOURCE_REF: ${{ matrix.channel == '001' && github.sha || '6cf4ff3f72a45d1842b89cc48bc42acd165eb5c3'
        }}
      APPROVED_SOURCE: ${{ matrix.channel == '001' && github.sha || '6cf4ff3f72a45d1842b89cc48bc42acd165eb5c3'
        }}
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        path: source
        fetch-depth: 0
        ref: ${{ env.SOURCE_REF }}
    - name: Preservar base e recursos exclusivos do canal
      working-directory: source
      run: python qa/kitchen-final/scope.py
    - uses: actions/checkout@v4
      with:
        ref: b95da478624312a5070e9ee512e156b3a9dcb858
        path: controller
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.401
    - name: Preparar canal proprio com dependencias da 10.431
      working-directory: controller
      shell: pwsh
      run: '''{"sdk":{"version":"10.0.401","rollForward":"disable"}}''|Set-Content
        global.json -Encoding UTF8

        python scripts/distribute_channels.py plan

        if($LASTEXITCODE -ne 0){throw ''Plan failed''}

        $p=Get-Content release-plan.json -Raw|ConvertFrom-Json

        if($p.Entries.Count -ne 1 -or $p.Entries[0].Channel -ne $env:CHANNEL -or $p.Entries[0].Version
        -ne ''10.432'' -or $p.Entries[0].Baseline.Version -ne ''10.431''){throw ''Wrong
        scope''}

        python scripts/distribute_channels.py prepare $env:CHANNEL

        if($LASTEXITCODE -ne 0){throw ''Preparation failed''}

        Push-Location candidate

        ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1

        ./scripts/aplicar_lic_ai_botao_v10_186.ps1

        ./scripts/aplicar_lic_ai_estado_v10_210.ps1

        ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1

        ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1

        ./scripts/aplicar_central_equipamentos_v10_314.ps1

        Pop-Location

        '
    - name: Conferir 258 fotos e creditos antes de compilar
      working-directory: controller/candidate
      run: python scripts/verify_ready_photos.py
    - name: Testar Cozinha Novo Pedido e tema real do canal
      working-directory: controller
      shell: pwsh
      run: 'dotnet run --project candidate/qa/kitchen-layout/LayoutTests.csproj -c
        Release -p:UseSharedCompilation=false -p:BuildInParallel=false 2>&1|Tee-Object
        layout-windows.log

        if($LASTEXITCODE -ne 0){throw ''001 Windows UI failed''}

        $r=Get-Content layout-evidence/results.json -Raw|ConvertFrom-Json

        if($r.success -ne $true){throw ''No UI evidence''}

        $sdk=Get-Content sdk-version.txt

        dotnet publish candidate/LealInfoPDV.csproj -c Release -r win-x64 --self-contained
        true -p:WindowsSdkPackageVersion=$sdk -o candidate-publish

        if($LASTEXITCODE -ne 0){throw ''Compilation failed''}

        python scripts/distribute_channels.py package $env:CHANNEL

        if($LASTEXITCODE -ne 0){throw ''Incremental dependencies changed''}

        '
    - name: Validar rollback exato da 10.431 para 10.432
      working-directory: source
      shell: pwsh
      run: 'New-Item -ItemType Directory validated|Out-Null

        Copy-Item ../controller/release-output validated -Recurse

        Copy-Item ../controller/layout-evidence validated -Recurse

        ./qa/kitchen-final/rollback.ps1 2>&1|Tee-Object validated/rollback.log

        if($LASTEXITCODE -ne 0){throw ''001 rollback failed''}

        '
    - uses: actions/upload-artifact@v4
      with:
        name: cozinha-final-${{ matrix.channel }}
        path: source/validated/
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cozinha-final-${{ matrix.channel }}-falha
        path: 'source/validated/

          controller/layout-evidence/

          controller/*.log

          '
    strategy:
      fail-fast: false
      matrix:
        channel:
        - '001'
        - '003'
  publicar:
    needs:
    - validar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: cozinha-final-001
        path: proof/001/validated
    - uses: actions/download-artifact@v4
      with:
        name: cozinha-final-003
        path: proof/003/validated
    - name: Publicar somente 001 e 003 e verificar URLs do atualizador
      env:
        GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        SOURCE_001: ${{ github.sha }}
        SOURCE_003: 6cf4ff3f72a45d1842b89cc48bc42acd165eb5c3
      run: python qa/kitchen-final/publish.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: publicacao-fotos-001-003-10432
        path: published-001-003.json
'on':
  push:
    branches:
    - feature/cozinha-ajustes-10428-001-003
