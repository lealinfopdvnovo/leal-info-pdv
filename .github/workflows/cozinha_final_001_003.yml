name: Duplo clique nas mesas 001 e 003 - atualizar no PDV
permissions:
  contents: read
  actions: read
concurrency:
  group: cozinha-duplo-clique-001-003
  cancel-in-progress: false
jobs:
  validar:
    runs-on: windows-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ matrix.channel }}
      SOURCE_REF: ${{ matrix.channel == '001' && github.sha || '14666ed23953586f183483369b2f5f11e3871071' }}
      APPROVED_SOURCE: ${{ matrix.channel == '001' && github.sha || '14666ed23953586f183483369b2f5f11e3871071' }}
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        path: source
        fetch-depth: 0
        ref: ${{ env.SOURCE_REF }}
    - name: Preservar base e recursos exclusivos do canal
      working-directory: source
      run: python qa/kitchen-final/scope.py
    - uses: actions/checkout@v4
      with:
        ref: b95da478624312a5070e9ee512e156b3a9dcb858
        path: controller
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.401
    - name: Preparar canal proprio com dependencias da 10.426
      working-directory: controller
      shell: pwsh
      run: '''{"sdk":{"version":"10.0.401","rollForward":"disable"}}''|Set-Content global.json -Encoding UTF8

        python scripts/distribute_channels.py plan

        if($LASTEXITCODE -ne 0){throw ''Plan failed''}

        $p=Get-Content release-plan.json -Raw|ConvertFrom-Json

        if($p.Entries.Count -ne 1 -or $p.Entries[0].Channel -ne $env:CHANNEL -or $p.Entries[0].Version -ne ''10.427'' -or $p.Entries[0].Baseline.Version -ne ''10.426''){throw ''Wrong
        scope''}

        python scripts/distribute_channels.py prepare $env:CHANNEL

        if($LASTEXITCODE -ne 0){throw ''Preparation failed''}

        Push-Location candidate

        ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1

        ./scripts/aplicar_lic_ai_botao_v10_186.ps1

        ./scripts/aplicar_lic_ai_estado_v10_210.ps1

        ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1

        ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1

        ./scripts/aplicar_central_equipamentos_v10_314.ps1

        Pop-Location

        '
    - uses: actions/download-artifact@v4
      with:
        name: premium-003-validation-NOT-AUTHORIZED
        run-id: 39504754135
        github-token: ${{ github.token }}
        path: original-photos
    - name: Reutilizar fotografias e creditos ja aprovados
      shell: pwsh
      run: "$metadata=@(Get-ChildItem original-photos -Filter candidate.json -Recurse)\nif($metadata.Count -ne 1){throw 'Ambiguous original photo package'}\n$original=Get-Content $metadata[0].FullName\
        \ -Raw|ConvertFrom-Json\n$zip=Join-Path $metadata[0].Directory.FullName $original.Package\nif((Get-FileHash $zip).Hash.ToLowerInvariant() -ne '546c776f7b9f48a3462f30ba257c8120c1f7bc144d957698565efe98f246e646'){throw\
        \ 'Photo source changed'}\nExpand-Archive $zip original-photo-assembly\n$a=[Reflection.Assembly]::LoadFile((Resolve-Path original-photo-assembly/LealInfoPDV.dll).Path)\n$names=@($a.GetManifestResourceNames()|Where-Object{$_\
        \ -like 'ReadyKitchen.*'})\nif($names.Count -ne 19){throw 'Missing original photos'}\n$folder=Join-Path $PWD 'controller/candidate/ready-kitchen/generated'\nNew-Item -ItemType\
        \ Directory $folder -Force|Out-Null\nforeach($n in $names){\n  if($n -notmatch '^ReadyKitchen\\.(catalog\\.json|LEALMIX[0-9]{3}\\.jpg)$'){throw 'Unexpected resource'}\n  $s=$a.GetManifestResourceStream($n);$o=[IO.File]::Create((Join-Path\
        \ $folder $n.Substring('ReadyKitchen.'.Length)))\n  try{$s.CopyTo($o)}finally{$s.Dispose();$o.Dispose()}\n}\n"
    - name: Testar Cozinha Novo Pedido e tema real do canal
      working-directory: controller
      shell: pwsh
      run: 'dotnet run --project candidate/qa/kitchen-layout/LayoutTests.csproj -c Release -p:UseSharedCompilation=false -p:BuildInParallel=false 2>&1|Tee-Object layout-windows.log

        if($LASTEXITCODE -ne 0){throw ''001 Windows UI failed''}

        $r=Get-Content layout-evidence/results.json -Raw|ConvertFrom-Json

        if($r.success -ne $true){throw ''No UI evidence''}

        $sdk=Get-Content sdk-version.txt

        dotnet publish candidate/LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -p:WindowsSdkPackageVersion=$sdk -o candidate-publish

        if($LASTEXITCODE -ne 0){throw ''Compilation failed''}

        python scripts/distribute_channels.py package $env:CHANNEL

        if($LASTEXITCODE -ne 0){throw ''Incremental dependencies changed''}

        '
    - name: Validar rollback exato da 10.426 para 10.427
      working-directory: source
      shell: pwsh
      run: 'New-Item -ItemType Directory validated|Out-Null

        Copy-Item ../controller/release-output validated -Recurse

        Copy-Item ../controller/layout-evidence validated -Recurse

        ./qa/kitchen-final/rollback.ps1 2>&1|Tee-Object validated/rollback.log

        if($LASTEXITCODE -ne 0){throw ''001 rollback failed''}

        '
    - uses: actions/upload-artifact@v4
      with:
        name: cozinha-final-${{ matrix.channel }}
        path: source/validated/
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cozinha-final-${{ matrix.channel }}-falha
        path: 'source/validated/

          controller/layout-evidence/

          controller/*.log

          '
    strategy:
      fail-fast: false
      matrix:
        channel:
        - '001'
        - '003'
  publicar:
    needs:
    - validar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: cozinha-final-001
        path: proof/001/validated
    - uses: actions/download-artifact@v4
      with:
        name: cozinha-final-003
        path: proof/003/validated
    - name: Publicar somente 001 e 003 e verificar URLs do atualizador
      env:
        GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        SOURCE_001: ${{ github.sha }}
        SOURCE_003: 14666ed23953586f183483369b2f5f11e3871071
      run: python qa/kitchen-final/publish.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: publicacao-duplo-clique-001-003-10427
        path: published-001-003.json
'on':
  push:
    branches:
    - feature/cozinha-duplo-clique-001-003
