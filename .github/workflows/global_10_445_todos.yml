name: GLOBAL 10.445 - entregar a todas as instalações
on:
  push:
    branches: [release/global-10-445-todos]
permissions:
  contents: read
  actions: read
concurrency:
  group: global-10-445-todos
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: '001'
            base: 19cd2697fada9e444bef8f23a920aca468abd819
          - channel: '002'
            base: 735f3f6b0f933f25585c0c9e7e50551dae9a056d
          - channel: '004'
            base: 2787ea2541261bd68cf1e931ceaa6ed537ddc832
    env:
      CHANNEL: ${{ matrix.channel }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.base }}
          path: candidate
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Preparar mesma mudança GLOBAL sobre base preservada
        shell: pwsh
        run: |
          python controller/qa/global-todos/prepare.py
          if($LASTEXITCODE -ne 0){throw 'Preparation failed'}
          Push-Location candidate
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
          Pop-Location
      - name: Testar ações do aviso e compilar Windows preservando PET
        shell: pwsh
        run: |
          $sdk=Get-Content sdk-version.txt
          Push-Location candidate
          dotnet run --project qa/global-notification/Tests.csproj -c Release -p:UseSharedCompilation=false -p:WindowsSdkPackageVersion=$sdk
          if($LASTEXITCODE -ne 0){throw 'Notification tests failed'}
          $props=@("-p:WindowsSdkPackageVersion=$sdk")
          if($env:CHANNEL -eq '001'){
            dotnet build qa/pet-loja-v12/FinanceLayoutTests.csproj -c Release -p:UseSharedCompilation=false -p:WindowsSdkPackageVersion=$sdk
            if($LASTEXITCODE -ne 0){throw 'Original Loja PET build failed'}
            $payload=(Resolve-Path qa/pet-loja-v12/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.Pet.001.dll).Path
            $props+=("-p:LojaPetPayload=$payload")
          }
          dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o ../publish -p:UseSharedCompilation=false @props
          if($LASTEXITCODE -ne 0){throw 'Windows compilation failed'}
          if($env:CHANNEL -eq '001'){
            $testbin='qa/pet-loja-v12/bin/Release/net8.0-windows10.0.19041.0'
            Copy-Item ../publish/LealInfoPDV.dll "$testbin/LealInfoPDV.dll" -Force
            dotnet "$testbin/FinanceLayoutTests.dll" --bootstrap
            if($LASTEXITCODE -ne 0){throw 'Original embedded Loja PET validation failed'}
          }
          Pop-Location
          python controller/qa/global-todos/package.py
          if($LASTEXITCODE -ne 0){throw 'Package validation failed'}
      - name: Validar pacote e rollback isolado sem tocar instalação real
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence,qa/global-core -Force|Out-Null
          Copy-Item controller/TransactionalUpdate.ps1 .
          $script=(Get-Content controller/qa/global-core/rollback.ps1 -Raw).Replace('Version 10.444','Version 10.445')
          Set-Content qa/global-core/rollback.ps1 $script
          ./qa/global-core/rollback.ps1
          if($LASTEXITCODE -ne 0){throw 'Isolated package rollback failed'}
          Copy-Item evidence/rollback.json "output/$env:CHANNEL/rollback.json"
          Copy-Item candidate/evidence/*.png "output/$env:CHANNEL/"
      - uses: actions/upload-artifact@v4
        with:
          name: global-445-${{ matrix.channel }}
          path: output/
  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: global-445-*
          merge-multiple: true
          path: proof
      - name: Publicar todos após aprovação de todas as compilações
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: python qa/global-todos/publish.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-445-disponivel-todos
          path: |
            published-all.json
            previous-*.json
