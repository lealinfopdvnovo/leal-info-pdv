name: Validar tela de venda
on:
  push:
    branches: ['codex/tela-venda-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Aplicar ajustes usados na publicacao
        shell: powershell
        run: |
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
      - name: Compilar PDV
        run: dotnet build LealInfoPDV.csproj -c Release
      - name: Capturar tela real no Windows
        shell: powershell
        run: |
          Copy-Item qa/SalesCapture.cs.txt Program.cs -Force
          dotnet build LealInfoPDV.csproj -c Release -t:Rebuild -o visual-build
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar captura" }
          $process = Start-Process ./visual-build/LealInfoPDV.exe -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw "Captura nao encerrou" }
          if (-not (Test-Path visual-qa/sales-1366.png)) { throw "Captura ausente" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tela-venda-windows
          path: visual-qa/
