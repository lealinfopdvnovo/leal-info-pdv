name: Preparar nomes dos PETs V1.1 - sem publicar
'on':
  push:
    branches: [prepare/pets-nomes-v1-1]
permissions:
  contents: read
concurrency:
  group: prepare-pets-nomes-v1-1
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Garantir GLOBAL dados e licenciamento intocados
      run: python qa/pet-organization/scope.py
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.401
    - name: Preparar compilacao com os pre-requisitos existentes
      shell: pwsh
      run: |
        '{"sdk":{"version":"10.0.401","rollForward":"disable"}}'|Set-Content global.json -Encoding UTF8
        ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
        ./scripts/aplicar_lic_ai_botao_v10_186.ps1
        ./scripts/aplicar_lic_ai_estado_v10_210.ps1
        ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
        ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
        ./scripts/aplicar_central_equipamentos_v10_314.ps1
    - name: Compilar quatro identificacoes locais sem alterar ou publicar GLOBAL
      shell: pwsh
      run: |
        foreach($id in @('001','002','003','004')){
          dotnet build qa/pet-organization/extension/PetDisplay.csproj -c Release -p:PetId=$id -p:UseSharedCompilation=false -p:BuildInParallel=false -o "pet-build/$id"
          if($LASTEXITCODE -ne 0){throw ('PET compilation failed: '+$id)}
        }
    - name: Testar nomes versoes independentes e gerar previa real antes/depois
      shell: pwsh
      run: |
        $built=(Resolve-Path pet-build).Path
        dotnet run --project qa/pet-organization/PetOrganization.csproj -c Release -p:UseSharedCompilation=false -p:BuildInParallel=false -- --test $built
        if($LASTEXITCODE -ne 0){throw 'Names/version/preview checks failed'}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: PETs-nomes-V1-1-preparados-nao-publicados
        path: evidence/
