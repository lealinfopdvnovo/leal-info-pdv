name: Login 10.457 - somente 002 003 004 - validar
on:
  push:
    branches: [fix/login-version-457-002-003-004]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: '002'
            base: 735f3f6b0f933f25585c0c9e7e50551dae9a056d
          - channel: CASA
            base: 874bc1e77fc3fb9b643ed17ceb0e1e1c91ad2ac8
          - channel: '004'
            base: 2787ea2541261bd68cf1e931ceaa6ed537ddc832
    env:
      CHANNEL: ${{ matrix.channel }}
      SOURCE_BASE: ${{ matrix.base }}
      PYTHONUTF8: '1'
      LEAL_NOTIFIER_ISOLATED_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.base }}
          path: candidate
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Reconstituir somente base publicada de cada cliente
        shell: pwsh
        run: |
          python controller/qa/login457/prepare.py
          if($LASTEXITCODE -ne 0){throw 'Baseline failed'}
          if($env:CHANNEL -in @('002','004')){
            Push-Location candidate
            ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
            ./scripts/aplicar_lic_ai_botao_v10_186.ps1
            ./scripts/aplicar_lic_ai_estado_v10_210.ps1
            ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
            ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
            ./scripts/aplicar_central_equipamentos_v10_314.ps1
            Pop-Location
          }
          python controller/qa/login457/finish.py
          if($LASTEXITCODE -ne 0){throw 'Scope failed'}
      - name: Reusar notificador publicado sem modificar atualizador
        shell: pwsh
        run: |
          $a=[Reflection.Assembly]::Load([IO.File]::ReadAllBytes((Resolve-Path legacy/LealInfoPDV.dll).Path))
          $stream=$a.GetManifestResourceStream('LealInfoPDV.UpdateNotifier.Native')
          if(!$stream){throw 'Published notifier missing'}
          New-Item -ItemType Directory native -Force|Out-Null
          $dest=[IO.File]::Create((Join-Path $pwd 'native/LealInfoPDV.Notificador.exe'))
          try{$stream.CopyTo($dest)}finally{$stream.Dispose();$dest.Dispose()}
      - name: Compilar Windows e testar somente login pacote e rollback
        shell: pwsh
        run: |
          $native=(Resolve-Path native/LealInfoPDV.Notificador.exe).Path
          $sdk=Get-Content sdk-version.txt
          Push-Location candidate
          $props=@('-p:UseSharedCompilation=false',"-p:NotifierPayload=$native","-p:WindowsSdkPackageVersion=$sdk")
          dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish @props
          if($LASTEXITCODE -ne 0){throw 'Windows compilation failed'}
          dotnet build qa/login457/Tests.csproj -c Release @props
          if($LASTEXITCODE -ne 0){throw 'Tests compilation failed'}
          $bin='qa/login457/bin/Release/net8.0-windows10.0.19041.0'
          Copy-Item publish/LealInfoPDV.dll "$bin/LealInfoPDV.dll" -Force
          dotnet "$bin/Tests.dll"
          if($LASTEXITCODE -ne 0){throw 'Login visibility or preservation failed'}
          ./qa/global453/rollback.ps1
          if($LASTEXITCODE -ne 0){throw 'Rollback failed'}
          Pop-Location
          python controller/qa/login457/package.py
          if($LASTEXITCODE -ne 0){throw 'Package validation failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login457-${{ matrix.channel }}-NAO-PUBLICADO
          path: |
            output/
            candidate/evidence/
