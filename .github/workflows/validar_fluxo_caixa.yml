name: Validar entradas saidas e saldo do caixa
on:
  pull_request:
    paths:
      - 'MainForm.cs'
      - 'CashFlow.cs'
      - 'qa/cash-flow/**'
      - '.github/workflows/validar_fluxo_caixa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Aplicar ajustes existentes da compilacao
        shell: pwsh
        run: |
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
      - name: Compilar teste e PDV
        run: dotnet build qa/cash-flow/LealInfoPDV.CashTests.csproj -c Release
      - name: Testar entrada saida persistencia tela e saldo final
        run: dotnet run --project qa/cash-flow/LealInfoPDV.CashTests.csproj -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: fluxo-caixa-validado
          path: |
            fluxo-caixa-qa.png
            cash-test-results.txt
