name: Ativador externo 003 - validacao focal sem publicar
on:
  push:
    branches: ['feature/activate-protection-003-10415']
permissions: {contents: read}
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar somente ativacao, preservacao e recuperacao externa
        shell: pwsh
        run: |
          ./qa/activation-003/validate-activator.ps1
          if($LASTEXITCODE -ne 0){throw 'Activator validation failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ativador-003-evidencias
          path: evidence/
