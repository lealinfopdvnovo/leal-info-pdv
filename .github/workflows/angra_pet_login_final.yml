name: ANGRA QA PET 1.8 - titulo e rodape do login
on:
  push:
    branches: [qa/angra-etapa4-setup-20261114]
    paths: ['qa/angra-login-final/**', '.github/workflows/angra_pet_login_final.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: angra-qa-channel
  cancel-in-progress: true
jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with: {path: controller}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Reutilizar host e bandeirinha ja aprovados sem recompilar
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api repos/lealinfopdvnovo/leal-info-pdv/actions/artifacts/14140201060/zip > bundle.zip
          if($LASTEXITCODE -ne 0){throw 'Approved QA artifact unavailable'}
          if((Get-FileHash bundle.zip).Hash.ToLowerInvariant() -ne '30d2030f87645ea0d0f391cdba48bee51efcd086a9ca8ee8fb670b28ff91c1c6'){throw 'Approved bundle hash mismatch'}
          Expand-Archive bundle.zip bundle
          python controller/qa/angra-login-final/prepare.py
          if($LASTEXITCODE -ne 0){throw 'Pinned media/baseline verification failed'}
      - name: Compilar somente os textos do login e incorporar no PET 1.8 existente
        shell: pwsh
        run: |
          $setup=(Resolve-Path bundle/LEAL_INFO_ANGRA_QA_ATUALIZADOR.exe).Path
          $app=Join-Path $env:ProgramFiles 'LEAL INFO PDV - TESTE ANGRA ETAPA4 CORRIGIDO'
          $p=Start-Process $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -PassThru
          if(!$p.WaitForExit(120000) -or $p.ExitCode -ne 0){throw 'Approved binary baseline install failed'}
          $dir=Join-Path $env:RUNNER_TEMP 'handoff-build';New-Item -ItemType Directory $dir -Force|Out-Null
          $project=(Get-Content controller/qa/angra-login-final/LoginIdentity.csproj -Raw).Replace('HOST_DLL',(Join-Path $app 'LealInfoPDV.dll')).Replace('HOST_DIR',$app)
          Set-Content "$dir/LoginIdentity.csproj" $project -Encoding UTF8
          Copy-Item controller/qa/angra-login-final/LoginIdentity.cs $dir
          $deps=Get-Content "$app/LealInfoPDV.deps.json" -Raw|ConvertFrom-Json
          $sdk=($deps.libraries.PSObject.Properties.Name|Where-Object{$_ -like '*Microsoft.Windows.SDK.NET.Ref/*'}|Select-Object -First 1).Split('/')[-1]
          dotnet build "$dir/LoginIdentity.csproj" -c Release -o handoff-output "-p:WindowsSdkPackageVersion=$sdk"
          if($LASTEXITCODE -ne 0){throw 'Visual handoff compilation failed'}
          dotnet run --project controller/qa/angra-login-final/LoginPatcher.csproj -c Release -- baseline/Extensions/PET/Pet.dll handoff-output/AngraLoginIdentity.dll Pet-1.8.dll
          if($LASTEXITCODE -ne 0){throw 'Transition-only PET patch failed'}
          python controller/qa/angra-login-final/package.py
          if($LASTEXITCODE -ne 0){throw 'PET 1.6 package failed'}
      - name: Validar cobertura continua, login verdadeiro, midia preservada e recuperacao
        shell: pwsh
        run: |
          ./controller/qa/angra-login-final/test.ps1
          if($LASTEXITCODE -ne 0){throw 'Opening synchronization validation failed'}
      - name: Publicar exclusivamente PET 005 1.8 no mesmo canal QA
        shell: pwsh
        run: |
          $actual=(git -C controller ls-remote origin refs/heads/qa/angra-etapa4-setup-20261114).Split("`t")[0]
          if($actual -ne '${{ github.sha }}'){throw 'QA branch changed: publication refused'}
          Copy-Item transition-channel/* controller/qa/etapa4-setup/channel/
          git -C controller config user.name 'LEAL INFO QA Actions'
          git -C controller config user.email 'qa@users.noreply.github.com'
          git -C controller add -- qa/etapa4-setup/channel/ANGRA_005_PET_1_8.zip qa/etapa4-setup/channel/version.json
          git -C controller commit -m 'QA only: publish PET 005 1.8 three final identity texts'
          if($LASTEXITCODE -ne 0){throw 'QA channel commit failed'}
          git -C controller push origin HEAD:refs/heads/qa/angra-etapa4-setup-20261114
          if($LASTEXITCODE -ne 0){throw 'QA channel push failed'}
      - name: Conferir oferta e hash publicos
        shell: pwsh
        run: |
          python - <<'PYCODE'
          import urllib.request,json,hashlib,time,pathlib
          root='https://raw.githubusercontent.com/lealinfopdvnovo/leal-info-pdv/qa/angra-etapa4-setup-20261114/qa/etapa4-setup/channel/'
          d=json.load(urllib.request.urlopen(root+'version.json?t='+str(time.time_ns()),timeout=30))
          assert d['Version']=='1.8' and d['TargetClientCode']=='005'
          b=urllib.request.urlopen(d['PackageUrl']+'?t='+str(time.time_ns()),timeout=30).read()
          assert hashlib.sha256(b).hexdigest()==d['Sha256']
          pathlib.Path('login-evidence/public-offer.json').write_text(json.dumps(dict(Pass=True,Version='1.8',Identity='005',SHA256=d['Sha256'])))
          PYCODE
          if($LASTEXITCODE -ne 0){throw 'Public QA offer/hash verification failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ANGRA-QA-PET18-TRANSICAO-EVIDENCIAS
          path: login-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: ANGRA-QA-PET18-PACOTE
          path: transition-channel/
