name: Validar CEP e endereco de entrega no PDV
on:
  pull_request:
    paths:
      - 'DeliveryManagementForm.cs'
      - 'DeliveryAddress.cs'
      - 'qa/delivery-address/**'
      - '.github/workflows/validar_endereco_entrega.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Aplicar ajustes existentes da compilacao
        shell: pwsh
        run: |
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
      - name: Compilar teste e PDV
        run: dotnet build qa/delivery-address/LealInfoPDV.AddressTests.csproj -c Release
      - name: Consultar CEP real e persistir endereco completo
        run: dotnet run --project qa/delivery-address/LealInfoPDV.AddressTests.csproj -c Release --no-build
