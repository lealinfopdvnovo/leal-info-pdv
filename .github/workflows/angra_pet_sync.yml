name: ANGRA QA PET 1.5 - sincronizacao da abertura
on:
  push:
    branches: [qa/angra-etapa4-setup-20261114]
    paths: ['qa/angra-sync/**', '.github/workflows/angra_pet_sync.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: angra-qa-channel
  cancel-in-progress: true
jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with: {path: controller}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Reutilizar host e bandeirinha ja aprovados sem recompilar
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api repos/lealinfopdvnovo/leal-info-pdv/actions/artifacts/14140201060/zip > bundle.zip
          if($LASTEXITCODE -ne 0){throw 'Approved QA artifact unavailable'}
          if((Get-FileHash bundle.zip).Hash.ToLowerInvariant() -ne '30d2030f87645ea0d0f391cdba48bee51efcd086a9ca8ee8fb670b28ff91c1c6'){throw 'Approved bundle hash mismatch'}
          Expand-Archive bundle.zip bundle
          python controller/qa/angra-sync/prepare.py
          if($LASTEXITCODE -ne 0){throw 'Pinned media/baseline verification failed'}
      - name: Alterar somente midia e temporizacao no PET 005 existente
        shell: pwsh
        run: |
          dotnet run --project controller/qa/angra-sync/SyncPatcher.csproj -c Release -- baseline/Extensions/PET/Pet.dll sync-media.mp4 controller/qa/angra-sync/player.html Pet-1.5.dll
          if($LASTEXITCODE -ne 0){throw 'Minimal PET timing patch failed'}
          python controller/qa/angra-sync/package.py
          if($LASTEXITCODE -ne 0){throw 'PET 1.5 package failed'}
      - name: Validar frase completa, watchdog, login e recuperacao do pacote real
        shell: pwsh
        run: |
          ./controller/qa/angra-sync/test.ps1
          if($LASTEXITCODE -ne 0){throw 'Opening synchronization validation failed'}
      - name: Publicar exclusivamente PET 005 1.5 no mesmo canal QA
        shell: pwsh
        run: |
          $actual=(git -C controller ls-remote origin refs/heads/qa/angra-etapa4-setup-20261114).Split("`t")[0]
          if($actual -ne '${{ github.sha }}'){throw 'QA branch changed: publication refused'}
          Copy-Item sync-channel/* controller/qa/etapa4-setup/channel/
          git -C controller config user.name 'LEAL INFO QA Actions'
          git -C controller config user.email 'qa@users.noreply.github.com'
          git -C controller add -- qa/etapa4-setup/channel/ANGRA_005_PET_1_5.zip qa/etapa4-setup/channel/version.json
          git -C controller commit -m 'QA only: publish PET 005 1.5 opening synchronization'
          if($LASTEXITCODE -ne 0){throw 'QA channel commit failed'}
          git -C controller push origin HEAD:refs/heads/qa/angra-etapa4-setup-20261114
          if($LASTEXITCODE -ne 0){throw 'QA channel push failed'}
      - name: Conferir oferta e hash publicos
        shell: pwsh
        run: |
          $url='https://raw.githubusercontent.com/lealinfopdvnovo/leal-info-pdv/qa/angra-etapa4-setup-20261114/qa/etapa4-setup/channel/version.json'
          $ready=$false
          for($i=0;$i -lt 40;$i++){
            try{
              $offer=Invoke-RestMethod ($url+'?t='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())
              if($offer.Version -eq '1.5' -and $offer.TargetClientCode -eq '005'){
                Invoke-WebRequest $offer.PackageUrl -OutFile public-pet.zip
                if((Get-FileHash public-pet.zip).Hash.ToLowerInvariant() -eq $offer.Sha256){$ready=$true;break}
              }
            }catch{}
            Start-Sleep -Seconds 3
          }
          if(!$ready){throw 'QA 1.5 public offer/hash not yet visible'}
          @{Pass=$true;Version='1.5';Identity='005';SHA256=$offer.Sha256;PublicPackageVerified=$true}|ConvertTo-Json|Set-Content sync-evidence/public-offer.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ANGRA-QA-PET15-SYNC-EVIDENCIAS
          path: sync-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: ANGRA-QA-PET15-PACOTE
          path: sync-channel/
