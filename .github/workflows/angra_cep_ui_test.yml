name: ANGRA real CEP native UI only
on:
  push:
    branches: ['feature/angra-cep-qa']
permissions: {contents: read}
jobs:
  cep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Ephemeral signing for isolated UI fixture only
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 30 -dname "CN=CEP QA,O=Test,C=BR" >/dev/null 2>&1
      - working-directory: mobile/vidraceiro
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install mobile/vidraceiro/app/build/outputs/apk/debug/app-debug.apk
            adb install mobile/vidraceiro/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e phase cepCreate br.com.lealinfo.vidraceiro.profissional022.test/br.com.lealinfo.vidraceiro.MeasureFlowInstrumentation | tee cep-create.txt
            grep -q 'PASS PROFESSIONAL_CEPCREATE' cep-create.txt
            adb shell am force-stop br.com.lealinfo.vidraceiro.profissional022
            adb shell am instrument -w -e phase cepVerify br.com.lealinfo.vidraceiro.profissional022.test/br.com.lealinfo.vidraceiro.MeasureFlowInstrumentation | tee cep-reopen.txt
            grep -q 'PASS PROFESSIONAL_CEPVERIFY' cep-reopen.txt
            adb exec-out run-as br.com.lealinfo.vidraceiro.profissional022 tar -cf - files > cep-proof.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ANGRA_NATIVE_CEP_REAL_QA
          path: |
            cep-*.txt
            cep-proof.tar
