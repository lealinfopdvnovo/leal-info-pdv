name: Loja001 10.469 — approved migration release
on:
  push:
    branches: [qa/etapa6-loja-leal-info-20261123]
    paths: ['qa/loja-release469/**', '.github/workflows/loja_release469.yml']
concurrency:
  group: loja001-release469
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  initial-transition:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {path: controller}
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 98915ae5a9eb02825d77f74bb179e0ce27d65bd9
      - uses: actions/checkout@v4
        with:
          path: recipe
          ref: 78c0d348d210f9c9b2672746e09bcddbf4ba4474
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      - name: Conferir sintaxe dos scripts novos
        shell: pwsh
        run: |
          foreach($script in @('JointInitialRecovery.ps1','test_joint_recovery.ps1')){
            $tokens=$null;$parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd ('controller/qa/organization/bridge/'+$script)),[ref]$tokens,[ref]$parseErrors)|Out-Null
            if($parseErrors){throw ($parseErrors|Out-String)}
          }
      - name: Preparar Loja exclusivamente com a arquitetura aprovada
        shell: pwsh
        run: |
          python controller/qa/loja-release469/prepare.py
          if($LASTEXITCODE -ne 0){throw 'Selective Loja recipe failed'}
      - name: Compilar o destino real e apenas o PET Loja ja existente
        shell: pwsh
        run: |
          dotnet build candidate/LealInfoPDV.csproj -c Release -p:UseSharedCompilation=false
          if($LASTEXITCODE -ne 0){throw 'New modular destination build failed'}
          dotnet build candidate/extensions/profiles/001/Pet.csproj -c Release -p:UseSharedCompilation=false
          if($LASTEXITCODE -ne 0){throw 'Existing Loja PET build failed'}
          $build=Split-Path (Get-ChildItem candidate/bin/Release -Filter LealInfoPDV.exe -Recurse|Select-Object -First 1).FullName
          $pet=(Get-ChildItem candidate/extensions/profiles/001/bin/Release -Filter LealInfoPDV.Pet.Profile.dll -Recurse|Select-Object -First 1).FullName
          dotnet run --project controller/qa/organization/bridge/DestinationProbe.csproj -c Release -- $build $pet
          if($LASTEXITCODE -ne 0){throw 'New destination contract/capsule validation failed'}
      - name: Executar somente os novos cenarios de recuperacao conjunta
        shell: pwsh
        run: |
          ./controller/qa/loja-release469/test467.ps1
          if($LASTEXITCODE -ne 0){throw 'Origin467 recovery failed'}
          ./controller/qa/loja-release469/test468.ps1
          if($LASTEXITCODE -ne 0){throw 'New joint rollback failed'}
      - name: Testar janela de backup preservada sem banco real
        shell: pwsh
        run: |
          dotnet run --project candidate/qa/backup-progress/BackupProbe.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Approved backup UI regressed'}
          python controller/qa/loja-release469/verify_package.py
          if($LASTEXITCODE -ne 0){throw 'Distribution compatibility failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loja001-release469-evidence
          path: |
            distribution-evidence/
            completion-evidence/
            destination-10469/
            recovery468-evidence/
            pair-evidence/destination-source.json
