name: ANGRA37 - publish verified PET116 to QA005 only
on:
  push:
    branches: [qa/angra37-owner-delivery-20261115]
    paths: [.github/workflows/angra37_deliver_owner.yml]
permissions: {contents: write, actions: read}
jobs:
  qa005_only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: lealinfopdvnovo/leal-info-pdv
          run-id: 43790791142
          name: ANGRA37-PET116-candidate
          github-token: ${{ github.token }}
          path: receiver
      - name: Publish one verified QA005 package and its feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,json,urllib.request,base64,hashlib,zipfile,io
          from pathlib import Path
          repo='lealinfopdvnovo/leal-info-pdv';api='https://api.github.com/repos/'+repo
          branch='qa/angra-etapa4-setup-20261114';lease='de851df1c370d351321922e663b249536bb2f5dc'
          def req(path,data=None,method=None):
            raw=None if data is None else json.dumps(data).encode()
            q=urllib.request.Request(api+path,data=raw,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(q,timeout=60) as r:return json.load(r)
          run=req('/actions/runs/43790791142')
          assert run['head_sha']=='0b935f777cc72b3e64cee15c05f232965cf6a6cb','Wrong candidate source'
          jobs=req('/actions/runs/43790791142/jobs')['jobs']
          for job in ['security','android','receiver']:assert next(j for j in jobs if j['name']==job)['conclusion']=='success',job+' not approved'
          ref=req('/git/ref/heads/'+branch);assert ref['object']['sha']==lease,'QA feed changed: stop rather than overwrite'
          commit=req('/git/commits/'+lease);path='qa/etapa4-setup/channel/'
          old=req('/contents/'+path+'version.json?ref='+branch);feed=json.loads(base64.b64decode(old['content']))
          assert feed['TargetClientCode']=='005' and feed['Version']=='1.15'
          raw=urllib.request.urlopen('https://raw.githubusercontent.com/'+repo+'/'+lease+'/'+path+'ANGRA_005_PET_1_15_QA37.zip',timeout=60).read()
          assert hashlib.sha256(raw).hexdigest()==feed['Sha256']
          m=json.loads(zipfile.ZipFile(io.BytesIO(raw)).read('Extensions/PET/manifest.json'));dll=Path('receiver/Pet.dll').read_bytes()
          assert m['Identity']=='005';m['Version']='1.16';m['Sha256']=hashlib.sha256(dll).hexdigest()
          b=io.BytesIO()
          with zipfile.ZipFile(b,'w',zipfile.ZIP_DEFLATED) as z:
            z.writestr('Extensions/PET/Pet.dll',dll);z.writestr('Extensions/PET/manifest.json',json.dumps(m))
          package=b.getvalue();name='ANGRA_005_PET_1_16_QA37.zip';feed['Version']='1.16';feed['Sha256']=hashlib.sha256(package).hexdigest();feed['PackageUrl']='https://raw.githubusercontent.com/'+repo+'/'+branch+'/'+path+name
          blob=req('/git/blobs',{'encoding':'base64','content':base64.b64encode(package).decode()})['sha']
          tree=req('/git/trees',{'base_tree':commit['tree']['sha'],'tree':[{'path':path+name,'mode':'100644','type':'blob','sha':blob},{'path':path+'version.json','mode':'100644','type':'blob','content':json.dumps(feed,indent=2)}]})['sha']
          c=req('/git/commits',{'message':'qa(005): publish tested PET 1.16 owner administration entry; preserve GLOBAL and every other client [skip ci]','parents':[lease],'tree':tree})['sha']
          assert req('/git/ref/heads/'+branch)['object']['sha']==lease,'QA feed lease changed'
          req('/git/refs/heads/'+branch,{'sha':c,'force':False},'PATCH')
          result={'QAOnly':True,'Identity':'005','Version':'1.16','Commit':c,'Sha256':feed['Sha256'],'RealDeviceTest':'PENDING'}
          Path('qa005-publication.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ANGRA37-PET116-publication-evidence, path: qa005-publication.json}
