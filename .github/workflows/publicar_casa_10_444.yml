name: Publicar Casa do Leal 10.444 aprovada
on:
  push:
    branches: [release/casa-migracao-10-444]
permissions:
  contents: read
  actions: read
concurrency:
  group: publicar-casa-10-444
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Casa-migracao-protegida-isolada
          run-id: 39871413552
          github-token: ${{ github.token }}
          path: proof
      - name: Publicar pacote aprovado somente para Casa do Leal
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
        run: python qa/casa-migracao/publicar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publicacao-casa-10-444
          path: |
            published-CASA.json
            version-previous.json
