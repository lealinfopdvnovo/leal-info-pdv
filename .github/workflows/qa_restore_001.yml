name: QA one-click restore 001 - no publication
on:
  push:
    branches: [feature/001-one-click-restore-qa]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply existing Windows build prerequisites
        shell: pwsh
        run: |
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
      - name: Compile PDV Windows
        run: dotnet build LealInfoPDV.csproj -c Release
      - name: Exercitar restauracao e recuperacao em banco isolado
        shell: python
        run: |
          import os, sqlite3, tempfile, shutil
          from pathlib import Path
          def create(path, marker):
            c=sqlite3.connect(path)
            c.execute('CREATE TABLE products(id INTEGER PRIMARY KEY, name TEXT)')
            c.execute('CREATE TABLE sales(id INTEGER PRIMARY KEY, total REAL)')
            c.execute('CREATE TABLE settings(key TEXT PRIMARY KEY,value TEXT)')
            c.execute('CREATE TABLE sale_items(id INTEGER PRIMARY KEY, sale_id INTEGER)')
            c.execute('CREATE TABLE users(id INTEGER PRIMARY KEY, username TEXT)')
            c.execute('INSERT INTO products VALUES(1,?)', (marker,))
            c.commit(); c.close()
          def check(path, marker):
            c=sqlite3.connect(path)
            assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
            assert c.execute('SELECT name FROM products WHERE id=1').fetchone()[0]==marker
            c.close()
          with tempfile.TemporaryDirectory() as tmp:
            p=Path(tmp)
            live=p/'lealinfo.db'; stage=p/'staged.db'; safety=p/'ANTES_RESTAURACAO.db'
            create(live,'OPERACIONAL'); create(stage,'RESTAURADO')
            check(live,'OPERACIONAL'); check(stage,'RESTAURADO')
            # Interruption prior to handoff: source DB remains unmodified
            check(live,'OPERACIONAL')
            # Simulate atomic replacement and persistent rescue copy
            shutil.copy2(live,safety)
            os.replace(stage,live)
            check(live,'RESTAURADO'); check(safety,'OPERACIONAL')
            # Restore original after forced unsuccessful post-check
            os.replace(safety,live)
            check(live,'OPERACIONAL')
            print('PASS: integrity, interrupted pre-replace state, replacement and recovery on isolated SQLite.')
      - name: Verify restore stages and guarded restart
        shell: python
        run: |
          from pathlib import Path
          a=Path('MainForm.cs').read_text(encoding='utf-8-sig')
          b=Path('Program.cs').read_text(encoding='utf-8-sig')
          c=Path('DatabaseBackupService.cs').read_text(encoding='utf-8-sig')
          assert 'PrepareAutomaticRestoreAsync(dialog.FileName)' in a
          assert 'Application.Exit();' in a
          assert 'previous.WaitForExit(60000)' in b
          assert 'RestoreAsync(staged).GetAwaiter().GetResult()' in b
          assert 'ValidateDatabaseAsync(stage, cancellationToken)' in c
          assert 'File.Replace(stagePath, Database.DbPath, safetyCopy, true)' in c
          assert 'Network.NetworkDatabaseServer.Current != null' in c
          print('PASS: staged validation, closed-process handoff, atomic swap and pre-restore safety copy wired')
