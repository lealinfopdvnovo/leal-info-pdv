name: QA one-click restore 001 - no publication
on:
  push:
    branches: [feature/001-one-click-restore-qa]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply existing Windows build prerequisites
        shell: pwsh
        run: |
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
      - name: Compile PDV Windows
        run: dotnet build LealInfoPDV.csproj -c Release
      - name: Executar motor real de restauracao com falhas e processos Windows
        run: dotnet run --project qa/restore-real/LealInfoPDV.RestoreTests.csproj -c Release
      - name: Compilar servico de protecao externo independente
        run: dotnet publish tools/RecoveryBridge/RecoveryBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o bridge-publish
      - name: Executar recuperacao externa real de executaveis
        run: dotnet run --project qa/bridge-real/LealInfoPDV.BridgeTests.csproj -c Release -- --service-binary bridge-publish/LealInfoProtecao001.exe
      - name: Executar regressao de rede real
        run: dotnet run --project qa/network/LealInfoPDV.NetworkTests.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-real-windows-evidence
          path: restore-evidence/
