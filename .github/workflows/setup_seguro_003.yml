name: Setup seguro exclusivo 003
# Targeted first-transition validation; tested worker remains unchanged.
on:
  push:
    branches: ['feature/setup-seguro-003']
    paths: ['.github/workflows/setup_seguro_003.yml']
permissions:
  contents: read
  actions: read
jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: '003'
      SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {path: source}
      - uses: actions/checkout@v4
        with:
          ref: b95da478624312a5070e9ee512e156b3a9dcb858
          path: controller
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with:
          name: setup-003-failure
          run-id: 39340260479
          github-token: ${{ github.token }}
          path: controller/reuse
      - name: Reutilizar binarios compilados sem recompilar cozinha
        working-directory: controller
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-output -Force|Out-Null
          Copy-Item reuse/release-output/* release-output/
          $m=Get-Content release-output/candidate.json -Raw|ConvertFrom-Json
          if($m.Channel -ne '003' -or $m.Version -ne '10.416'){throw 'Wrong reused artifact'}
          Invoke-WebRequest $m.Baseline.PackageUrl -OutFile previous.zip
          if((Get-FileHash previous.zip).Hash.ToLowerInvariant() -ne $m.Baseline.Sha256){throw 'Baseline hash failed'}
          Expand-Archive previous.zip previous
          $deps=Get-Content previous/LealInfoPDV.deps.json -Raw|ConvertFrom-Json -AsHashtable
          $sdk=($deps.libraries.Keys|Where-Object{$_ -like 'runtimepack.Microsoft.Windows.SDK.NET.Ref/*'}|Select-Object -First 1).Split('/')[1]
          Set-Content sdk-version.txt $sdk
          git clone --branch feature/setup-seguro-003 --single-branch https://github.com/lealinfopdvnovo/leal-info-pdv.git candidate
      - name: Preparar setup sem alterar fontes operacionais
        working-directory: controller
        shell: pwsh
        run: |
          New-Item -ItemType Directory source/setup-003,bundle -Force|Out-Null
          Copy-Item ../source/setup-003/* source/setup-003
          Copy-Item ../source/TransactionalUpdate.ps1 bundle/worker.ps1
          Copy-Item ../source/setup-003/activate.ps1 bundle/
          Copy-Item release-output/candidate.json bundle/
          $meta=Get-Content bundle/candidate.json -Raw|ConvertFrom-Json
          if($meta.Channel -ne '003' -or $meta.Version -ne '10.416'){throw 'Wrong setup channel'}
          Copy-Item (Join-Path release-output $meta.Package) bundle/payload.zip
          $sdk=Get-Content sdk-version.txt
          dotnet publish candidate/qa/update-transaction/StartupFixture.csproj -c Release -r win-x64 --self-contained true -p:WindowsSdkPackageVersion=$sdk -o startup-fixture-publish
          if($LASTEXITCODE -ne 0){throw 'Fixture build failed'}
          $iscc=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6/ISCC.exe'
          if(!(Test-Path $iscc)){choco install innosetup --no-progress -y; if($LASTEXITCODE -ne 0){throw 'Inno unavailable'}}
          "ISCC=$iscc"|Out-File $env:GITHUB_ENV -Append
      - name: Testar somente setup e primeira transicao em Windows isolado
        working-directory: controller
        shell: pwsh
        run: |
          ./source/setup-003/test.ps1 2>&1|Tee-Object setup-tests.log
          if($LASTEXITCODE -ne 0){throw 'Setup tests failed'}
      - name: Compilar setup real 003 apos PASS
        working-directory: controller
        shell: pwsh
        run: |
          Remove-Item source/setup-003/bundle -Recurse -Force
          Copy-Item bundle source/setup-003/bundle -Recurse
          & $env:ISCC source/setup-003/setup.iss
          if($LASTEXITCODE -ne 0){throw 'Production setup compilation failed'}
          New-Item -ItemType Directory deliverable|Out-Null
          Copy-Item source/setup-003/output/*.exe deliverable/
          Get-FileHash deliverable/*.exe -Algorithm SHA256|Format-List|Out-File deliverable/SHA256.txt
          Copy-Item setup-tests.log,setup-ui.log deliverable/
          Copy-Item bundle/candidate.json deliverable/
      - name: Confirmar todos os feeds intactos
        working-directory: controller
        shell: python
        run: |
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('d','scripts/distribute_channels.py')
          d=importlib.util.module_from_spec(spec);spec.loader.exec_module(d)
          baseline=json.load(open('release-output/candidate.json',encoding='utf-8-sig'))
          assert d.readfeed('003')['sha']==baseline['ExpectedFeedSha'],'003 feed changed'
          assert baseline['Channel']=='003'
          print('PASS all feeds unchanged; 001/002/004/GLOBAL untouched')
      - uses: actions/upload-artifact@v4
        with:
          name: Setup_Correcao_003_10_416_TESTADO
          path: controller/deliverable/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: setup-003-failure
          path: |
            controller/setup*.log
            controller/source/setup-003/output/
            controller/release-output/

# Validate setup launcher native argument compatibility.

# Include takeover of the existing Armed 10.415 protection journal.

# Validate native Program Files under installer environment.
