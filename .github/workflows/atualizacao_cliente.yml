name: Publicar atualizacao do proprio cliente
on:
  push:
    branches: ['client/**']
    paths-ignore: ['README.md']
permissions:
  contents: read
  actions: read
jobs:
  canal:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.id.outputs.code }}
    steps:
      - id: id
        shell: bash
        run: |
          code="${GITHUB_REF_NAME#client/}"
          [[ "$code" =~ ^00[1-4]$ ]] || exit 1
          echo "code=$code" >> "$GITHUB_OUTPUT"
  distribuir:
    needs: canal
    uses: lealinfopdvnovo/leal-info-pdv/.github/workflows/distribuir_atualizacoes.yml@main
    with:
      channel: ${{ needs.canal.outputs.code }}
      source: ${{ github.sha }}
    secrets: inherit
