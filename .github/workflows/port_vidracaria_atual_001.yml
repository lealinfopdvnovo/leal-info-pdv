      - name: Auditar PACOTES REAIS 001 e 003 e hash/origem publicados
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($item in @(@('001','10.392','b2dffdec03445295bebed8c6d8c1033642ae16ead6f9e751b243d8e71a64c0f3','e210bd4dc7a02a3992432046a98de43250c39488'),@('003','10.398','67e1d092994a2a1ff2877400e1363865de7c70856882114249b3fe97e5cbd432','f3d855709810ab63d60a63b56e2dfadda5541463'))){
            $m=Invoke-RestMethod "https://raw.githubusercontent.com/lealinfopdvnovo/leal-info-pdv-updates/main/clients/$($item[0])/version.json"
            if($m.Version -ne $item[1] -or $m.Sha256 -ne $item[2] -or $m.SourceCommit -ne $item[3]){throw 'Origem publicada mudou'}
            Invoke-WebRequest $m.PackageUrl -OutFile "audit-$($item[0]).zip"
            if((Get-FileHash "audit-$($item[0]).zip").Hash.ToLowerInvariant() -ne $item[2]){throw 'Hash origem divergente'}
            Expand-Archive "audit-$($item[0]).zip" "audit-$($item[0])"
            $files=@(Get-ChildItem "audit-$($item[0])" -Recurse -File|ForEach-Object {$_.Name}|Sort-Object)
            if(Compare-Object $files @('LealInfoPDV.deps.json','LealInfoPDV.dll','LealInfoPDV.exe')){throw 'Conteudo origem inesperado'}
            $v=[Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD "audit-$($item[0])/LealInfoPDV.dll")).FileVersion
            if(!$v.StartsWith($item[1]+'.')){throw 'Versao binaria origem divergente'}
            Write-Host "PASS PACOTE REAL $($item[0]) $v hash correto sem dados operacionais"
          }
