      - name: Publicar somente canal 001 com guarda concorrencial
        shell: pwsh
        env: {GH_TOKEN: '${{ secrets.UPDATE_REPO_TOKEN }}', SOURCE_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'
          $head=(Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/$env:GITHUB_REF_NAME" -Headers @{Authorization="Bearer $env:SOURCE_TOKEN"}).object.sha
          if($head -ne $env:GITHUB_SHA){throw 'Candidato superado'}
          $repo='lealinfopdvnovo/leal-info-pdv-updates'
          $protected=@{}
          foreach($p in @('version.json','clients/003/version.json','clients/002/version.json')){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Feed protegido nao pode ser lido'}
            $protected[$p]=$v.sha
          }
          $fourBefore=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExists=$LASTEXITCODE -eq 0
          if($fourExists){$fourSha=($fourBefore|ConvertFrom-Json).sha}
          $entry=gh api "repos/$repo/contents/clients/001/version.json"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw '001 nao pode ser lido'}
          $old=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($entry.content))|ConvertFrom-Json
          if($old.Version -ne '10.392' -or $old.TargetClientCode -ne '001' -or $old.Sha256 -ne 'b2dffdec03445295bebed8c6d8c1033642ae16ead6f9e751b243d8e71a64c0f3'){throw 'Canal 001 mudou; abortar'}
          $tags=gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[].tag_name'
          if($LASTEXITCODE -ne 0 -or 'client-001-v10.399' -in @($tags)){throw 'Release existente ou auditoria falhou'}
          $package='LEAL_INFO_PDV_001_V10_399_UPDATE.zip'
          $notes='V10.399 exclusiva001: port seletivo da Vidracaria003/10.398, unidades mm/cm/m, moeda brasileira com centavos, cadastro original e vinculo, subtotal e A4/PDF. Persistencia/schema existente, dados e personalizacoes do001 preservados; 003 inalterado. Aguardando homologacao fisica.'
          $notes|Set-Content notes.txt
          gh release create client-001-v10.399 $package --repo $repo --title 'LEAL INFO PDV 001 V10.399 - Vinculo do cliente no cadastro original' --notes-file notes.txt --latest=false
          if($LASTEXITCODE -ne 0){throw 'Pacote nao publicado; nao mudar feed'}
