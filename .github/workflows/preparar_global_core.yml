name: Preparar GLOBAL independente de PET - sem publicar
'on':
  push:
    branches: [prepare/global-core-runtime]
permissions:
  contents: read
concurrency:
  group: prepare-global-core-runtime
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Conferir escopo GLOBAL sem alterar negocios licencas ou clientes
      run: python qa/global-core/scope.py
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.401
    - name: Preparar compilacao da base existente
      shell: pwsh
      run: |
        '{"sdk":{"version":"10.0.401","rollForward":"disable"}}'|Set-Content global.json -Encoding UTF8
        ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
        ./scripts/aplicar_lic_ai_botao_v10_186.ps1
        ./scripts/aplicar_lic_ai_estado_v10_210.ps1
        ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
        ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
        ./scripts/aplicar_central_equipamentos_v10_314.ps1
    - name: Compilar extensao PET de teste e executar GLOBAL real no Windows
      shell: pwsh
      run: |
        dotnet build qa/global-core/fixture/Pet.csproj -c Release -p:UseSharedCompilation=false -p:BuildInParallel=false
        if($LASTEXITCODE -ne 0){throw 'Fixture compile failed'}
        $fixture=(Resolve-Path qa/global-core/fixture/bin/Release/net8.0-windows10.0.19041.0/PetFixture.dll).Path
        dotnet run --project qa/global-core/Tests.csproj -c Release -p:UseSharedCompilation=false -p:BuildInParallel=false -- $fixture
        if($LASTEXITCODE -ne 0){throw 'GLOBAL/PET tests failed'}
        dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish -p:UseSharedCompilation=false
        if($LASTEXITCODE -ne 0){throw 'Windows build failed'}
    - name: Testar backup recuperacao SYSTEM e preservacao de PET sem instalar
      shell: pwsh
      run: |
        ./qa/global-core/rollback.ps1
        if($LASTEXITCODE -ne 0){throw 'Rollback/PET preservation failed'}
    - name: Guardar compilacao candidata sem criar release ou alterar feeds
      shell: pwsh
      run: |
        New-Item -ItemType Directory evidence/common-files -Force|Out-Null
        $files=@{}
        foreach($n in @('LealInfoPDV.exe','LealInfoPDV.dll','LealInfoPDV.deps.json')){Copy-Item (Join-Path publish $n) evidence/common-files/;$files[$n]=(Get-FileHash (Join-Path publish $n)).Hash.ToLowerInvariant()}
        @{Component='GLOBAL';Version='10.443';PetApiVersion=1;Source=$env:GITHUB_SHA;Published=$false;InstallableOnLegacyClients=$false;ClientMigrationDeferred=$true;Files=$files}|ConvertTo-Json -Depth 6|Set-Content evidence/prepared.json -Encoding UTF8
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: GLOBAL-core-preparado-sem-publicacao
        path: evidence/
