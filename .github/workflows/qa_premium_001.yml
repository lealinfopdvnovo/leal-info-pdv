name: QA premium global 001 - no publication
on:
  push:
    branches: [feature/001-premium-global-405]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply existing Windows build prerequisites
        shell: pwsh
        run: |
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
      - name: Compile Windows PDV
        run: dotnet build LealInfoPDV.csproj -c Release
      - name: Exercise real modules and capture Windows UI
        timeout-minutes: 4
        run: dotnet run --project qa/premium-global/LealInfoPDV.PremiumTests.csproj -c Release
      - name: Build incremental candidate from installed 10.404 dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/lealinfopdvnovo/leal-info-pdv-updates/releases/download/client-001-v10.404/LEAL_INFO_PDV_001_V10_404_UPDATE.zip' -OutFile previous001.zip
          if((Get-FileHash previous001.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a6dc443af7c8a26c191487744ce3039441363ec6670bc4759002dcefbd5b967c'){throw 'Published 10.404 baseline changed'}
          Expand-Archive previous001.zip previous001
          $old=Get-Content previous001/LealInfoPDV.deps.json -Raw|ConvertFrom-Json
          $key=$old.libraries.PSObject.Properties.Name|Where-Object {$_ -like 'runtimepack.Microsoft.Windows.SDK.NET.Ref/*'}|Select-Object -First 1
          if(!$key){throw 'Installed SDK not found'}
          $sdkVersion=$key.Split('/')[1]
          dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -p:WindowsSdkPackageVersion=$sdkVersion -o candidate-publish
          if($LASTEXITCODE -ne 0){throw 'Candidate build failed'}
          New-Item -ItemType Directory -Force candidate001,premium-evidence|Out-Null
          $previous=@{};$target=@{}
          foreach($file in @('LealInfoPDV.exe','LealInfoPDV.dll','LealInfoPDV.deps.json')){
            $previous[$file]=(Get-FileHash "previous001/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            $target[$file]=(Get-FileHash "candidate-publish/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            Copy-Item "candidate-publish/$file" "candidate001/$file"
          }
          @{Version='10.405';SourceCommit=$env:GITHUB_SHA;Previous=$previous;Target=$target}|ConvertTo-Json -Depth 6|Set-Content premium-evidence/candidate-plan.json -Encoding utf8
          Compress-Archive candidate001/* LEAL_INFO_PDV_001_V10_405_UPDATE.zip
      - name: Verify unchanged incremental dependencies
        shell: python
        run: |
          import json
          from pathlib import Path
          values=[json.loads(Path(p).read_text(encoding='utf-8-sig')) for p in ['previous001/LealInfoPDV.deps.json','candidate001/LealInfoPDV.deps.json']]
          for obj in values:
              for bag in [obj['libraries'],*obj['targets'].values()]:
                  for k in list(bag):
                      if k.startswith('LealInfoPDV/'):del bag[k]
          assert values[0]==values[1], 'Incremental dependencies changed'
      - name: Validate candidate with installed payload policy
        run: dotnet run --project qa/network/LealInfoPDV.NetworkTests.csproj -c Release -- --validate-package LEAL_INFO_PDV_001_V10_405_UPDATE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: candidato-001-10.405
          path: LEAL_INFO_PDV_001_V10_405_UPDATE.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-global-windows-evidence
          path: premium-evidence/
