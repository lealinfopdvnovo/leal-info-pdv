name: Rollback transacional 001 e 003 - somente QA
on:
  push:
    branches: ['feature/rollback-001', 'feature/rollback-003']
permissions:
  contents: read
  actions: read
jobs:
  preparar:
    runs-on: windows-latest
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ github.ref_name == 'feature/rollback-001' && '001' || '003' }}
      SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {path: source, fetch-depth: 0}
      - name: Congelar cozinha testada e permitir somente metadados e preparo
        shell: python
        run: |
          import os,re,subprocess
          from pathlib import Path
          ch=os.environ['CHANNEL']
          base={'001':'e1516fc266410e95dd3482680933af9bbe3ee8ba','003':'7fe10c57c8de781e6d6284f251ed00cff5505573'}[ch]
          def git(*args):return subprocess.check_output(['git','-C','source',*args]).decode('utf-8')
          subprocess.run(['git','-C','source','merge-base','--is-ancestor',base,'HEAD'],check=True)
          changed=set(git('diff','--name-only',base,'HEAD').splitlines())
          allowed={'UpdateManager.cs','Program.cs','LealInfoPDV.csproj','TransactionalUpdate.cs','TransactionalUpdate.ps1','.github/workflows/qa_transactional_update.yml','qa/update-transaction/test-transaction.ps1','qa/update-transaction/StartupFixture.csproj','qa/update-transaction/StartupFixture.cs'}
          assert changed <= allowed,changed-allowed
          old=git('show',base+':UpdateManager.cs').replace('\r\n','\n')
          new=Path('source/UpdateManager.cs').read_text(encoding='utf-8')
          marker=' private static async Task DownloadAndApplyAsync('
          assert old[:old.index(marker)]==new[:new.index(marker)],'Channel selection or identity modified'
          old=git('show',base+':Program.cs').replace('\r\n','\n')
          new=Path('source/Program.cs').read_text(encoding='utf-8')
          guard='        try { TransactionalUpdate.BeforeStartup(); }\n        catch(Exception ex) { System.Diagnostics.Trace.WriteLine(ex); return; }\n'
          assert new.replace(guard,'').replace('            TransactionalUpdate.ReportReady();\n\n','')==old,'Unrelated startup changes'
          old=git('show',base+':LealInfoPDV.csproj').replace('\r\n','\n')
          new=Path('source/LealInfoPDV.csproj').read_text(encoding='utf-8')
          assert new.replace('  <ItemGroup><EmbeddedResource Include="TransactionalUpdate.ps1" LogicalName="TransactionalUpdateWorker" /></ItemGroup>\n','')==old,'Dependencies modified'
          print('PASS strict scope: only updater transaction and startup guard; business modules, kitchen, license, database and cash unchanged')
      - uses: actions/checkout@v4
        with:
          ref: b95da478624312a5070e9ee512e156b3a9dcb858
          path: controller
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Verificações essenciais de distribuição e plano exclusivo
        working-directory: controller
        shell: pwsh
        run: |
          python -m unittest discover -s qa/distribution -v
          if($LASTEXITCODE -ne 0){throw 'Distribution checks failed'}
          python scripts/distribute_channels.py plan
          if($LASTEXITCODE -ne 0){throw 'Channel plan failed'}
          $plan=Get-Content release-plan.json -Raw|ConvertFrom-Json
          if($plan.Entries.Count -ne 1 -or $plan.Entries[0].Channel -ne $env:CHANNEL){throw 'Wrong channel scope'}
          python scripts/distribute_channels.py prepare $env:CHANNEL
          if($LASTEXITCODE -ne 0){throw 'Baseline/incremental preparation failed'}
          git -C candidate show ($plan.Entries[0].BaselineSource+':UpdateManager.cs') | Set-Content installed-UpdateManager.cs -Encoding UTF8
      - name: Pré-requisitos de compilação existentes
        working-directory: controller/candidate
        shell: pwsh
        run: |
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
      - name: Compilar candidato com dependências já instaladas
        working-directory: controller
        shell: pwsh
        run: |
          $sdk=Get-Content sdk-version.txt
          dotnet publish candidate/LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -p:WindowsSdkPackageVersion=$sdk -o candidate-publish
          if($LASTEXITCODE -ne 0){throw 'Windows compilation failed'}
          python scripts/distribute_channels.py package $env:CHANNEL
          if($LASTEXITCODE -ne 0){throw 'Incremental compatibility failed'}
          Copy-Item release-plan.json release-output/
      - name: Testar seletor, confirmação, integridade e preservação com atualizador existente
        working-directory: controller
        shell: pwsh
        run: |
          $e=Get-Content build-entry.json -Raw|ConvertFrom-Json
          $package=Join-Path (Get-Location) ('release-output/'+$e.Package)
          dotnet run --project candidate/qa/channel-isolation/LealInfoPDV.ChannelTests.csproj -c Release 2>&1|Tee-Object release-output/windows-integration.log
          if($LASTEXITCODE -ne 0){throw 'Updater integration failed'}
          dotnet run --project candidate/qa/network/LealInfoPDV.NetworkTests.csproj -c Release -- --validate-package $package 2>&1|Tee-Object release-output/payload-policy.log
          if($LASTEXITCODE -ne 0){throw 'Installed payload validation failed'}
      - name: Testar transação, interrupções, tarefa SYSTEM e recuperação sem PDV
        working-directory: controller
        shell: pwsh
        run: |
          $sdk=Get-Content sdk-version.txt
          dotnet publish candidate/qa/update-transaction/StartupFixture.csproj -c Release -r win-x64 --self-contained true -p:WindowsSdkPackageVersion=$sdk -o startup-fixture-publish
          if($LASTEXITCODE -ne 0){throw 'Startup fixture compilation failed'}
          ../source/qa/update-transaction/test-transaction.ps1 2>&1|Tee-Object release-output/transaction-tests.log
          if($LASTEXITCODE -ne 0){throw 'Transactional update tests failed'}
      - name: Regressão real do caixa em perfil Windows descartável
        working-directory: controller
        shell: pwsh
        run: |
          dotnet run --project candidate/qa/cash-flow/LealInfoPDV.CashTests.csproj -c Release 2>&1|Tee-Object release-output/cash-regression.log
          if($LASTEXITCODE -ne 0){throw 'Cash regression failed'}
          Copy-Item cash-test-results.txt,fluxo-caixa-qa.png release-output/
      - name: Bloquear primeira transição ainda aplicada pelo atualizador legado
        working-directory: controller
        shell: python
        run: |
          import json
          from pathlib import Path
          gate=json.loads(Path('release-output/release-gate.json').read_text(encoding='utf-8-sig'))
          assert gate['SafeForPublication'] is False and gate['Legacy10415BootstrapProtected'] is False
          p=Path('release-output/candidate.json')
          c=json.loads(p.read_text(encoding='utf-8-sig'));c.update(TransactionalTestsPassed=True,PublicationAuthorized=False,RollbackBootstrapPassed=False,SafeForPublication=False)
          p.write_text(json.dumps(c,ensure_ascii=False,indent=2),encoding='utf-8')
          print('BLOCKED for publication: installed legacy updater cannot pre-protect its own first replacement')
      - name: Reter candidato interno sem autorização de publicação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-transacional-${{ env.CHANNEL }}-NAO-PUBLICAR
          path: controller/release-output/
          retention-days: 30
      - name: Confirmar feeds e canais intactos
        if: always()
        working-directory: controller
        shell: python
        run: |
          import importlib.util,json
          from pathlib import Path
          p=Path('release-plan.json')
          if not p.exists():raise SystemExit('No release plan; no publication capability was used')
          spec=importlib.util.spec_from_file_location('distribution','scripts/distribute_channels.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          before=json.loads(p.read_text(encoding='utf-8-sig'))['Before']
          for ch in module.CHANNELS:assert module.readfeed(ch)['sha']==before[ch]['sha'],'Feed changed '+ch
          print('PASS all five feeds unchanged; read-only token; no publishing or installation job')

