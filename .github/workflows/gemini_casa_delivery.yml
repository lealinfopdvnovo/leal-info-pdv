name: Casa Gemini Live - entrega transacional sem publicar
on:
  push:
    branches: [prepare/casa-gemini-frames-461]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CHANNEL: CASA
      PYTHONUTF8: '1'
      LEAL_NOTIFIER_ISOLATED_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 874bc1e77fc3fb9b643ed17ceb0e1e1c91ad2ac8
          path: candidate
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      - name: Verificar isolamento e recuperar artefatos aprovados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python -c "import subprocess; c=subprocess.check_output(['git','-C','controller','diff','--name-only','29546006a1bd4c98511727c358f184a50fb927b3','HEAD'],text=True).splitlines();assert c and all(x.startswith(('qa/gemini-delivery/','qa/gemini-casa/')) or x=='.github/workflows/gemini_casa_delivery.yml' for x in c),c;print('PASS source scope Casa only')"
          python controller/qa/gemini-delivery/prepare.py download
          if($LASTEXITCODE -ne 0){throw 'Approved artifacts failed'}
      - name: Preparar localizador da instalacao na candidata derivada
        working-directory: controller
        shell: pwsh
        run: |
          python qa/gemini-delivery/prepare.py sidecar
          if($LASTEXITCODE -ne 0){throw 'Locator failed'}
      - name: Compilar LIA separada preservando runtime aprovado
        shell: pwsh
        run: |
          dotnet run --project controller/qa/gemini-casa/Tests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Protocol tests failed'}
          dotnet publish controller/qa/gemini-casa/LiaGeminiCasa.csproj -c Release -r win-x64 --self-contained true -o sidecar-built
          if($LASTEXITCODE -ne 0){throw 'Sidecar build failed'}
          python controller/qa/gemini-delivery/prepare.py bundle
          if($LASTEXITCODE -ne 0){throw 'Bundle provenance failed'}
          dotnet run --project controller/qa/gemini-delivery/Tests.csproj -c Release -- bundle/casa-gemini.zip bundle/hashes.json
          if($LASTEXITCODE -ne 0){throw 'Atomic installation tests failed'}
      - name: Reconstituir compilacao exclusiva Casa10.458
        shell: pwsh
        run: |
          python controller/qa/login457/prepare.py
          if($LASTEXITCODE -ne 0){throw 'Baseline failed'}
          python controller/qa/login457/finish.py
          if($LASTEXITCODE -ne 0){throw 'Finish baseline failed'}
          python controller/qa/lia-casa/prepare.py
          if($LASTEXITCODE -ne 0){throw '458 failed'}
          Push-Location candidate
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          Pop-Location
          python controller/qa/lia-casa/prepare.py verify
          if($LASTEXITCODE -ne 0){throw 'LIA scope failed'}
      - name: Preparar entrega incorporada sem ampliar politica ou alterar worker
        shell: pwsh
        run: |
          python controller/qa/gemini-delivery/prepare.py candidate
          if($LASTEXITCODE -ne 0){throw 'Delivery scope failed'}
          $a=[Reflection.Assembly]::Load([IO.File]::ReadAllBytes((Resolve-Path legacy-458/LealInfoPDV.dll).Path))
          $stream=$a.GetManifestResourceStream('LealInfoPDV.UpdateNotifier.Native')
          if(!$stream){throw 'Notifier missing'}
          New-Item -ItemType Directory native -Force|Out-Null
          $dest=[IO.File]::Create((Join-Path $pwd 'native/LealInfoPDV.Notificador.exe'))
          try{$stream.CopyTo($dest)}finally{$stream.Dispose();$dest.Dispose()}
      - name: Compilar PDV Casa e testar preservacao da interface
        shell: pwsh
        run: |
          $native=(Resolve-Path native/LealInfoPDV.Notificador.exe).Path
          $sdk=Get-Content sdk-version.txt
          Push-Location candidate
          $props=@('-p:UseSharedCompilation=false',"-p:NotifierPayload=$native","-p:WindowsSdkPackageVersion=$sdk")
          dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish @props
          if($LASTEXITCODE -ne 0){throw 'Casa compilation failed'}
          dotnet run --project qa/login457/Tests.csproj -c Release @props
          if($LASTEXITCODE -ne 0){throw 'Login regression failed'}
          dotnet run --project qa/lia-casa/Tests.csproj -c Release @props
          if($LASTEXITCODE -ne 0){throw 'LIA regression failed'}
          Pop-Location
          python controller/qa/gemini-delivery/prepare.py package
          if($LASTEXITCODE -ne 0){throw 'Package failed'}
          Push-Location candidate
          dotnet run --project qa/gemini-delivery/DeliveryProbe.csproj -c Release @props -- ../output/LEAL_INFO_PDV_CASA_V10_461_UPDATE.zip
          if($LASTEXITCODE -ne 0){throw 'Scope/license/package policy failed'}
          Pop-Location
      - name: Testar aplicacao interrupcoes corrupcao recuperacao e rollback completos
        shell: pwsh
        run: |
          New-Item -ItemType Directory previous,release-output -Force|Out-Null
          Copy-Item legacy-458/* previous/
          Copy-Item output/LEAL_INFO_PDV_CASA_V10_461_UPDATE.zip release-output/
          '{"Package":"LEAL_INFO_PDV_CASA_V10_461_UPDATE.zip","Channel":"GLOBAL","Version":"10.461"}'|Set-Content build-entry.json
          New-Item -ItemType Directory candidate/qa/update-transaction -Force|Out-Null
          Copy-Item controller/qa/update-transaction/StartupFixture* candidate/qa/update-transaction/
          $fixture='candidate/qa/update-transaction/StartupFixture.cs'
          (Get-Content $fixture -Raw).Replace('10.422','10.461')|Set-Content $fixture
          dotnet publish candidate/qa/update-transaction/StartupFixture.csproj -c Release -r win-x64 --self-contained true -o startup-fixture-publish
          if($LASTEXITCODE -ne 0){throw 'Startup fixture build failed'}
          ./controller/qa/update-transaction/test-transaction.ps1
          if($LASTEXITCODE -ne 0){throw 'Transactional recovery failed'}
          python controller/qa/gemini-delivery/prepare.py finish
          if($LASTEXITCODE -ne 0){throw 'Final validation failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casa-gemini-10-461-CANDIDATA-NAO-PUBLICADA
          path: |
            output/
            evidence/
            candidate/evidence/
            release-output/transaction-results.json
            release-output/transaction-failure.json
