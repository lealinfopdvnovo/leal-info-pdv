name: Gelamaq - diagnostico financeiro Windows isolado
on:
  push:
    branches: [qa/gelamaq-finance-diagnostico-20261024]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reproduzir conversao com provedor real
        shell: pwsh
        run: |
          dotnet run --project qa/gelamaq-finance-diagnostico/Test.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Diagnostic failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gelamaq-finance-diagnostico
          path: evidence/
