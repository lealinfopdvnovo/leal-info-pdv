name: SETUP TESTE ANGRA ETAPA4 - DOWNLOAD
on:
  push:
    branches: [qa/angra-etapa4-setup-20261114]
    paths: ['qa/etapa4-setup/**', '.github/workflows/angra_etapa4_setup.yml']
concurrency:
  group: angra-qa-channel
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
env:
  PYTHONUTF8: '1'
jobs:
  qa-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {path: controller}
      - uses: actions/checkout@v4
        with:
          path: approved
          ref: a0f49da19885c87415fa01f7848dbd85b0577f0b
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 98915ae5a9eb02825d77f74bb179e0ce27d65bd9
      - uses: actions/checkout@v4
        with:
          path: recipe
          ref: 78c0d348d210f9c9b2672746e09bcddbf4ba4474
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      - name: Preparar somente o novo destino com as receitas ja aprovadas
        shell: pwsh
        run: |
          python controller/qa/organization/prepare_current_common.py
          if($LASTEXITCODE -ne 0){throw 'Existing common recipe failed'}
          pwsh -NoProfile -File controller/qa/organization/common_resource_contract.ps1 -Mode Extract
          if($LASTEXITCODE -ne 0){throw 'Existing notifier extraction failed'}
          python controller/qa/organization/prepare_integration.py
          if($LASTEXITCODE -ne 0){throw 'Existing modular integration failed'}
          python controller/qa/organization/bridge/fetch_origin.py
          if($LASTEXITCODE -ne 0){throw 'Pinned origin unavailable'}
          pwsh -NoProfile -File controller/qa/organization/extract_loja_worker.ps1
          if($LASTEXITCODE -ne 0){throw 'Original Loja resources differ'}
          python controller/qa/organization/prepare_pet_seal.py
          if($LASTEXITCODE -ne 0){throw 'Existing PET recipe failed'}
          python controller/qa/organization/extract_gelamaq_legacy.py
          if($LASTEXITCODE -ne 0){throw 'Preserved Gelamaq resource unavailable'}
          pwsh -NoProfile -File controller/qa/organization/extract_preserved_presentations.ps1
          if($LASTEXITCODE -ne 0){throw 'Original PET resource preservation failed'}
          python controller/qa/organization/prepare_finance_compat.py
          if($LASTEXITCODE -ne 0){throw 'Existing compatibility recipe failed'}
          python controller/qa/organization/prepare_compatibility.py
          if($LASTEXITCODE -ne 0){throw 'Existing contracts preparation failed'}
          New-Item -ItemType Directory logon-probe -Force|Out-Null
          python controller/qa/organization/preserve_logon.py
          if($LASTEXITCODE -ne 0){throw 'Preserved LOGON source differs'}
          pwsh -NoProfile -File controller/qa/organization/bridge/preserve_origin_notifier.ps1
          if($LASTEXITCODE -ne 0){throw 'Identified notifier preservation failed'}
          python controller/qa/organization/bridge/prepare_destination.py
          if($LASTEXITCODE -ne 0){throw 'New initial coordinator integration failed'}
      - name: Isolar somente a copia de testes
        shell: pwsh
        run: |
          python controller/qa/etapa4-setup/prepare_qa.py
          if($LASTEXITCODE -ne 0){throw 'QA data isolation preparation failed'}
      - name: Configurar somente o canal QA e reutilizar a bandeirinha nativa
        shell: pwsh
        run: |
          python controller/qa/etapa4-setup/prepare_channel.py
          if($LASTEXITCODE -ne 0){throw 'QA route preparation failed'}
      - name: Compilar a mesma bandeirinha com rota QA exclusiva
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /std:c++17 /EHsc /utf-8 candidate\current-embedded\notifier-qa.cpp /Fe:candidate\current-embedded\Notifier.exe /link /SUBSYSTEM:WINDOWS /MACHINE:X64
          if errorlevel 1 exit /b 1
      - name: Compilar payload offline e PET Loja existente
        shell: pwsh
        run: |
          dotnet publish candidate/LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -p:UseSharedCompilation=false -o qa-publish
          if($LASTEXITCODE -ne 0){throw 'QA app publish failed'}
          dotnet build candidate/extensions/profiles/001/Pet.csproj -c Release -p:UseSharedCompilation=false
          if($LASTEXITCODE -ne 0){throw 'Existing Loja PET compilation failed'}
          ./controller/qa/etapa4-setup/package_payload.ps1
          if($LASTEXITCODE -ne 0){throw 'QA payload validation failed'}
      - name: Empacotar PET ANGRA 005 com video aprovado e narracao offline
        shell: pwsh
        run: |
          python controller/qa/etapa4-setup/prepare_brand.py
          if($LASTEXITCODE -ne 0){throw 'Brand preparation failed'}
          dotnet build candidate/extensions/profiles/001/Pet.csproj -c Release -p:UseSharedCompilation=false
          if($LASTEXITCODE -ne 0){throw 'QA PET 1.4 compilation failed'}
          ./controller/qa/etapa4-setup/package_brand.ps1
          if($LASTEXITCODE -ne 0){throw 'QA patch packaging failed'}
      - name: Recuperar somente o instalador QA anterior ja validado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/lealinfopdvnovo/leal-info-pdv/actions/artifacts/14135945779/zip > previous-qa.zip
          if($LASTEXITCODE -ne 0){throw 'Previous QA artifact unavailable'}
          if((Get-FileHash previous-qa.zip).Hash.ToLowerInvariant() -ne 'a3f2047d0ecc2486fc2151fdad8e021198996c9dc70d2e2018a99a367222d74a'){throw 'Previous QA ZIP changed'}
          Expand-Archive previous-qa.zip previous-qa
      - name: Gerar apenas instalador de testes independente
        shell: pwsh
        run: |
          Copy-Item controller/qa/etapa4-setup/setup.iss setup.iss
          $compiler=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6/ISCC.exe'
          if(!(Test-Path $compiler)){choco install innosetup --no-progress -y; if($LASTEXITCODE -ne 0){throw 'Installer compiler unavailable'}}
          & $compiler setup.iss
          if($LASTEXITCODE -ne 0){throw 'QA installer compilation failed'}
      - name: Instalar no runner e observar isolamento e ativacao real
        shell: pwsh
        run: |
          ./controller/qa/etapa4-setup/test_setup.ps1
          if($LASTEXITCODE -ne 0){throw 'QA installer safety validation failed'}
          ./controller/qa/etapa4-setup/test_notifier.ps1
          if($LASTEXITCODE -ne 0){throw 'QA tray startup validation failed'}
      - name: Validar contrato PET 005 com licenca de fixture assinada e login
        shell: pwsh
        run: |
          ./controller/qa/etapa4-setup/test_contract.ps1
          if($LASTEXITCODE -ne 0){throw 'Licensed PET 005 contract regression failed'}
      - name: Validar recuperacao e isolamento da nova identidade QA
        shell: pwsh
        run: |
          ./qa-005-tests/test.ps1
          if($LASTEXITCODE -ne 0){throw 'QA PET rollback scenarios failed'}
          Copy-Item pair-evidence/pet-transaction-results.json qa-setup-evidence/rollback-005.json
      - name: Publicar somente o canal QA na mesma branch autorizada
        shell: pwsh
        run: |
          $expected='${{ github.sha }}'
          $actual=(git -C controller ls-remote origin refs/heads/qa/angra-etapa4-setup-20261114).Split("`t")[0]
          if($actual -ne $expected){throw 'QA branch changed during validation; publication refused'}
          New-Item -ItemType Directory controller/qa/etapa4-setup/channel -Force|Out-Null
          Copy-Item qa-channel/* controller/qa/etapa4-setup/channel/
          git -C controller config user.name 'LEAL INFO QA Actions'
          git -C controller config user.email 'qa@users.noreply.github.com'
          git -C controller add -- qa/etapa4-setup/channel/
          git -C controller commit -m 'QA only: publish verified ANGRA 005 PET 1.4 channel'
          if($LASTEXITCODE -ne 0){throw 'QA channel commit failed'}
          git -C controller push origin HEAD:refs/heads/qa/angra-etapa4-setup-20261114
          if($LASTEXITCODE -ne 0){throw 'QA channel push failed'}
      - name: Guardar binarios ja testados para verificacoes sem recompilar
        shell: pwsh
        run: |
          New-Item -ItemType Directory validation-bundle/base-pet -Force|Out-Null
          Copy-Item setup-output/LEAL_INFO_ANGRA_QA_ATUALIZADOR.exe validation-bundle/
          $app=Join-Path $env:ProgramFiles 'LEAL INFO PDV - TESTE ANGRA ETAPA4 CORRIGIDO'
          Copy-Item "$app/ContractProbe.dll" validation-bundle/
          Copy-Item qa-publish/Extensions/PET/* validation-bundle/base-pet/
      - uses: actions/upload-artifact@v4
        with:
          name: ANGRA-QA-BINARIOS-TESTADOS
          path: validation-bundle/
      - name: Conferir canal publicado na janela verdadeira de atualizacoes
        shell: pwsh
        run: |
          $url='https://raw.githubusercontent.com/lealinfopdvnovo/leal-info-pdv/qa/angra-etapa4-setup-20261114/qa/etapa4-setup/channel/version.json'
          $ready=$false
          for($i=0;$i -lt 40;$i++){
            try{$offer=Invoke-RestMethod ($url+'?t='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds());if($offer.Version -eq '1.4' -and $offer.TargetClientCode -eq '005'){$ready=$true;break}}catch{}
            Start-Sleep -Seconds 3
          }
          if(!$ready){throw 'QA public feed not visible'}
          $app=Join-Path $env:ProgramFiles 'LEAL INFO PDV - TESTE ANGRA ETAPA4 CORRIGIDO'
          $env:QA_BASE_PET=(Resolve-Path qa-publish/Extensions/PET).Path
          $env:QA_EVIDENCE=(Resolve-Path qa-setup-evidence).Path
          dotnet exec --runtimeconfig "$app/LealInfoPDV.runtimeconfig.json" --depsfile "$app/LealInfoPDV.deps.json" "$app/ContractProbe.dll" live-feed
          if($LASTEXITCODE -ne 0){throw 'Live QA update dialog validation failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: BAIXAR-SETUP-TESTE-ANGRA-ETAPA4
          path: setup-output/LEAL_INFO_ANGRA_QA_ATUALIZADOR.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-setup-angra-etapa4
          path: qa-setup-evidence/
