name: App Vidraceiro Android - base generica isolada
on:
  push:
    branches: ['feature/app-vidraceiro-android-foundation']
permissions: {contents: read, actions: read, id-token: write}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preservar integralmente PDV10.403
        shell: python
        run: |
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only','3dfab93e04ebb1cfef72606c2d52a76c05eead94','HEAD']).decode().splitlines()
          assert all(f.startswith('mobile/vidraceiro/') or f in ('.github/workflows/app_vidraceiro_android.yml','.github/workflows/angra_cloud_run.yml') for f in files)
          print('PASS PDV10.403 e todos canais inalterados')
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Testes de dominio, lint e APK
        working-directory: mobile/vidraceiro
        run: |
          node --test gateway/*.test.mjs
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256.txt
          cp app/src/androidTest/assets/ATTRIBUTION.txt app/build/reports/IMAGE_ATTRIBUTION.txt
      - name: Enable KVM for actual Android execution
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m pip install Pillow imageio-ffmpeg
      - name: APK 0.1.4 aprovado para testar preservacao lado a lado
        uses: actions/download-artifact@v4
        with:
          repository: lealinfopdvnovo/leal-info-pdv
          run-id: 38654283648
          name: ANGRA_VIDROS_ANDROID_0_1_4_TESTE
          github-token: ${{ github.token }}
          path: /tmp/angra-approved
      - name: Verificar hash do APK aprovado
        shell: python
        run: |
          from pathlib import Path
          import hashlib,shutil
          files=list(Path('/tmp/angra-approved').rglob('app-debug.apk'))
          assert len(files)==1
          assert hashlib.sha256(files[0].read_bytes()).hexdigest()=='b17a1a22e7d7ec6c244766a32528c1f16e93512bbf4b72aa2a06b80facfc354b'
          shutil.copyfile(files[0],'/tmp/angra-approved.apk')
          print('PASS approved 0.1.4 APK SHA256')
      - name: Two cold launches - opacity, progress and transition
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install /tmp/angra-approved.apk
            adb shell run-as br.com.lealinfo.vidraceiro mkdir -p files
            adb shell run-as br.com.lealinfo.vidraceiro touch files/approved-marker
            cd mobile/vidraceiro && python3 tests/cold_start.py
            cd mobile/vidraceiro && adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            cd mobile/vidraceiro && adb shell am instrument -w br.com.lealinfo.vidraceiro.teste.test/br.com.lealinfo.vidraceiro.MeasureFlowInstrumentation | tee app/build/reports/measure-ui.txt
            cd mobile/vidraceiro && grep -q 'PASS MEASURE_UI_FLOW' app/build/reports/measure-ui.txt
            cd mobile/vidraceiro && adb shell am instrument -w -e networkPhase prepare br.com.lealinfo.vidraceiro.teste.test/br.com.lealinfo.vidraceiro.MeasureFlowInstrumentation | tee app/build/reports/network-prepare.txt
            cd mobile/vidraceiro && grep -q 'PASS NETWORK_PREPARE' app/build/reports/network-prepare.txt
            cd mobile/vidraceiro && adb shell run-as br.com.lealinfo.vidraceiro.teste cat files/network-device.json > app/build/reports/network-device.json
            cd mobile/vidraceiro && node tests/authorize-ci.mjs
            cd mobile/vidraceiro && adb shell am instrument -w -e networkPhase generate br.com.lealinfo.vidraceiro.teste.test/br.com.lealinfo.vidraceiro.MeasureFlowInstrumentation | tee app/build/reports/network-image-ui.txt
            cd mobile/vidraceiro && grep -q 'PASS REAL_NETWORK_IMAGE_UI' app/build/reports/network-image-ui.txt
            cd mobile/vidraceiro && adb shell run-as br.com.lealinfo.vidraceiro.teste cat files/network-screen.png > app/build/reports/network-image-ui.png
            cd mobile/vidraceiro && adb shell run-as br.com.lealinfo.vidraceiro.teste cat files/network-result.json > app/build/reports/network-result.json
            cd mobile/vidraceiro && adb shell run-as br.com.lealinfo.vidraceiro ls files/approved-marker > app/build/reports/approved-preservation.txt
            cd mobile/vidraceiro && adb shell dumpsys package br.com.lealinfo.vidraceiro | grep 'versionName=0.1.4' >> app/build/reports/approved-preservation.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ANGRA_VIDROS_ANDROID_0_1_5_TESTE
          path: |
            mobile/vidraceiro/app/build/outputs/apk/debug/*.apk
            mobile/vidraceiro/app/build/outputs/apk/debug/SHA256.txt
            mobile/vidraceiro/app/build/reports/
          retention-days: 30
