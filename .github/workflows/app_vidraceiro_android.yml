name: App Vidraceiro Android - base generica isolada
on:
  push:
    branches: ['feature/app-vidraceiro-android-foundation']
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preservar integralmente PDV10.403
        shell: python
        run: |
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only','3dfab93e04ebb1cfef72606c2d52a76c05eead94','HEAD']).decode().splitlines()
          assert all(f.startswith('mobile/vidraceiro/') or f=='.github/workflows/app_vidraceiro_android.yml' for f in files)
          print('PASS PDV10.403 e todos canais inalterados')
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Testes de dominio, lint e APK
        working-directory: mobile/vidraceiro
        run: |
          node --test gateway/domain.test.mjs
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LEAL_INFO_VIDRACEIRO_ANDROID_0_1_0_TESTE
          path: |
            mobile/vidraceiro/app/build/outputs/apk/debug/*.apk
            mobile/vidraceiro/app/build/outputs/apk/debug/SHA256.txt
            mobile/vidraceiro/app/build/reports/
          retention-days: 30
