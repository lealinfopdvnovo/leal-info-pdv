name: Publicar alerta global e tipografia validados - updater existente
on:
  push:
    branches: ['release/alerta-tipografia-validado-10379']
    paths: ['.github/workflows/publicar_alerta_tipografia_validado.yml']
permissions: { contents: read, actions: read }
concurrency: { group: publicar-alerta-tipografia-10379, cancel-in-progress: false }
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UPDATE_REPO: lealinfopdvnovo/leal-info-pdv-updates
      QA_RUN: '38009051677'
      GLOBAL_SOURCE: '9a3c5eccc283363433fdf9e9e5493925b1ff81f9'
      SOURCE_001: '447f223c1266888d2377fb8ab393c72f42501c18'
      SOURCE_002: '01abfb4ea64e5958b2a12ec33d3a6b5b06c34378'
      SOURCE_003: '75bd6c55c4985fabbc6bcec19a66cc7dd2b1ba30'
    steps:
      - uses: actions/checkout@v4
      - name: Exigir quatro builds homologados antes de publicar
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $ErrorActionPreference='Stop'
          $run=gh api repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QA_RUN|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:GLOBAL_SOURCE){throw 'QA nao aprovada'}
          $jobs=gh api repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QA_RUN/jobs|ConvertFrom-Json
          if($jobs.jobs.Count -ne 4 -or ($jobs.jobs|Where-Object conclusion -ne 'success')){throw 'Bateria incompleta'}
      - uses: actions/download-artifact@v4
        with:
          pattern: alerta-tipografia-*
          run-id: ${{ env.QA_RUN }}
          github-token: ${{ github.token }}
          path: payload
      - name: Auditar artefatos aprovados e manifests reais atuais
        shell: pwsh
        env: { GH_TOKEN: '${{ secrets.UPDATE_REPO_TOKEN }}' }
        run: |
          $ErrorActionPreference='Stop'
          $sources=@{global=$env:GLOBAL_SOURCE;'001'=$env:SOURCE_001;'002'=$env:SOURCE_002;'003'=$env:SOURCE_003}
          $expected=Get-Content .github/alerta-tipografia-feeds-anteriores.json -Raw|ConvertFrom-Json -AsHashtable
          $dirs=gh api repos/$env:UPDATE_REPO/contents/clients|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or @($dirs|Where-Object {$_.name -notin @('001','002','003')}).Count){throw 'Canal nao auditado apareceu; nao publicar global'}
          $tags=gh api --paginate "repos/$env:UPDATE_REPO/releases?per_page=100" --jq '.[].tag_name'
          if($LASTEXITCODE -ne 0){throw 'Nao foi possivel auditar releases existentes'}
          foreach($flavor in @('global','001','002','003')){
            $payload="payload/alerta-tipografia-$flavor"
            $zip="$payload/update-$flavor.zip"
            if((Get-FileHash $zip).Hash.ToLowerInvariant() -ne (Get-Content "$payload/kitchen-evidencias/sha-$flavor.txt" -Raw).Trim()){throw 'Artefato mudou apos QA'}
            if((Get-Content "$payload/kitchen-evidencias/source-$flavor.txt" -Raw).Trim() -ne $sources[$flavor]){throw 'Fonte nao homologada'}
            $z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
            try{
              $wanted=@('LealInfoPDV.deps.json','LealInfoPDV.dll','LealInfoPDV.exe'|Sort-Object)
              if(Compare-Object @($z.Entries.FullName|Sort-Object) $wanted){throw 'Arquivo inesperado no ZIP'}
            }finally{$z.Dispose()}
            $path=if($flavor -eq 'global'){'version.json'}else{"clients/$flavor/version.json"}
            $entry=gh api "repos/$env:UPDATE_REPO/contents/${path}?ref=main"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Feed nao pode ser lido'}
            $old=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($entry.content))|ConvertFrom-Json
            foreach($key in @('Version','SourceCommit','Sha256','PackageUrl')){if($old.$key -ne $expected[$flavor][$key]){throw "Feed $flavor mudou concorrencialmente"}}
            if($flavor -ne 'global' -and $old.TargetClientCode -ne $flavor){throw 'ID incorreto'}
            $entry.sha|Set-Content "feed-sha-$flavor.txt"
            $tag=if($flavor -eq 'global'){'v10.379'}else{"client-$flavor-v10.379"}
            if($tag -in @($tags)){throw 'Release existe; nao sobrescrever'}
          }
          Write-Host 'PASS quatro artefatos aprovados; feeds anteriores e personalizacoes auditados'
      - name: Publicar primeiro pacotes compativeis 001 002 003
        shell: pwsh
        env: { GH_TOKEN: '${{ secrets.UPDATE_REPO_TOKEN }}' }
        run: |
          $ErrorActionPreference='Stop'
          $sources=@{'001'=$env:SOURCE_001;'002'=$env:SOURCE_002;'003'=$env:SOURCE_003}
          foreach($id in @('001','002','003')){
            $package="LEAL_INFO_PDV_$($id)_V10_379_UPDATE.zip"
            Copy-Item "payload/alerta-tipografia-$id/update-$id.zip" $package
            $tag="client-$id-v10.379"
            $notes='V10.379: legendas completas com quebra controlada e centralizacao, sem cortes de segunda linha. Preserva todas as particularidades deste cliente, icones, dados e licenca.'
            $notes|Set-Content "notes-$id.txt"
            gh release create $tag $package --repo $env:UPDATE_REPO --title "LEAL INFO PDV $id V10.379 - Alerta e Tipografia" --notes-file "notes-$id.txt" --latest=false
            if($LASTEXITCODE -ne 0){throw 'Asset nao publicado; nao mudar feed'}
            $m=@{Version='10.379';TargetClientCode=$id;PackageUrl="https://github.com/$env:UPDATE_REPO/releases/download/$tag/$package";Sha256=(Get-FileHash $package).Hash.ToLowerInvariant();SourceCommit=$sources[$id];Notes=$notes;Mandatory=$false}
            $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($m|ConvertTo-Json)))
            @{message="Alerta e tipografia 10.379 compativel $id";sha=(Get-Content "feed-sha-$id.txt" -Raw).Trim();content=$content}|ConvertTo-Json -Compress|Set-Content "request-$id.json"
            gh api --method PUT "repos/$env:UPDATE_REPO/contents/clients/$id/version.json" --input "request-$id.json"
            if($LASTEXITCODE -ne 0){throw 'Feed direcionado falhou; global permanece anterior'}
          }
      - name: Confirmar tres canais personalizados antes de ofertar global
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($id in @('001','002','003')){
            $url="https://raw.githubusercontent.com/lealinfopdvnovo/leal-info-pdv-updates/main/clients/$id/version.json"
            for($i=0;$i -lt 24;$i++){
              $m=Invoke-RestMethod ($url+'?t='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -Headers @{'Cache-Control'='no-cache'}
              if($m.Version -eq '10.379' -and $m.TargetClientCode -eq $id){break}
              Start-Sleep -Seconds 5
            }
            if($m.Version -ne '10.379' -or $m.TargetClientCode -ne $id){throw 'Canal nao propagou; nao publicar global'}
          }
          1..4|ForEach-Object {Start-Sleep -Seconds 30}
          Write-Host 'PASS 001/002/003 propagados antes do global; intervalo de protecao preservado'
      - name: Publicar pacote e manifesto GLOBAL
        shell: pwsh
        env: { GH_TOKEN: '${{ secrets.UPDATE_REPO_TOKEN }}' }
        run: |
          $ErrorActionPreference='Stop'
          foreach($id in @('001','002','003')){
            $entry=gh api "repos/$env:UPDATE_REPO/contents/clients/$id/version.json"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Nao foi possivel conferir canal personalizado'}
            $m=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($entry.content))|ConvertFrom-Json
            if($m.Version -ne '10.379' -or $m.TargetClientCode -ne $id){throw 'Canal personalizado mudou; bloquear global'}
          }
          $package='LEAL_INFO_PDV_V10_379_UPDATE.zip'
          Copy-Item payload/alerta-tipografia-global/update-global.zip $package
          $notes='V10.379 GLOBAL: legendas completas com quebra controlada e centralizacao, sem cortes de segunda linha. Pacotes compativeis 001/002/003 preservam particularidades. Sem dados, licencas, configuracoes ou icones no pacote.'
          $notes|Set-Content notes-global.txt
          gh release create v10.379 $package --repo $env:UPDATE_REPO --title 'LEAL INFO PDV V10.379 Global - Alerta e Tipografia' --notes-file notes-global.txt --latest
          if($LASTEXITCODE -ne 0){throw 'Asset global falhou; nao mudar feed'}
          $m=@{Version='10.379';PackageUrl="https://github.com/$env:UPDATE_REPO/releases/download/v10.379/$package";Sha256=(Get-FileHash $package).Hash.ToLowerInvariant();SourceCommit=$env:GLOBAL_SOURCE;Notes=$notes;Mandatory=$false;Editions=@('STANDARD','PLUS','PRO')}
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($m|ConvertTo-Json)))
          @{message='Alerta e tipografia 10.379 GLOBAL';sha=(Get-Content feed-sha-global.txt -Raw).Trim();content=$content}|ConvertTo-Json -Compress|Set-Content request-global.json
          gh api --method PUT repos/$env:UPDATE_REPO/contents/version.json --input request-global.json
          if($LASTEXITCODE -ne 0){throw 'Feed global falhou'}
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Conferir selecao e downloads reais pelo updater existente
        shell: pwsh
        run: |
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
          dotnet run --project qa/kitchen/LealInfoPDV.KitchenTests.csproj -c Release -- --live
          if($LASTEXITCODE -ne 0){throw 'Validacao real pos-publicacao falhou'}
