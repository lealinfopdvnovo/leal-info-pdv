name: Publicar atualizacao LEAL INFO PDV V10.274 
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']
concurrency:
  group: publicar-atualizacao-pdv
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  publicar-atualizacao:
    runs-on: windows-latest
    env:
      UPDATE_VERSION: "10.274"
      UPDATE_TAG: "v10.274"
      SETUP_FILE: "Setup_LEAL_INFO_PDV_V10_274_FINAL.exe"
      UPDATE_PACKAGE: "LEAL_INFO_PDV_V10_274_UPDATE.zip"
      UPDATE_REPO: "lealinfopdvnovo/leal-info-pdv-updates"
      GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Preparar versao
        shell: powershell
        run: |
          $i=Get-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" -Raw -Encoding UTF8
          $i=[regex]::Replace($i,'#define MyAppVersion[^\r\n]*','#define MyAppVersion "10.274"')
          $i=[regex]::Replace($i,'OutputBaseFilename=.*','OutputBaseFilename=Setup_LEAL_INFO_PDV_V10_274_FINAL')
          Set-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" $i -Encoding UTF8
          if ((Get-Content "LealInfoPDV.csproj" -Raw) -notmatch '<Version>10\.273\.0</Version>') { throw "csproj nao esta em V10.274" }
          if ((Get-Content "UpdateManager.cs" -Raw) -notmatch 'CurrentVersion="10\.273"') { throw "UpdateManager nao esta em V10.274" }
      - name: Preservar visual
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_visual_estavel_v10_177.ps1"
      - name: Aplicar login centralizado
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_login_futurista_v10_259.ps1"
      - name: Login premium
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_login_premium_v10_261.ps1"
      - name: Login GDI
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_login_gdi_v10_263.ps1"
      - name: Aplicar esfera
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_lic_ai_botao_v10_186.ps1"
      - name: Estados esfera
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_lic_ai_estado_v10_210.ps1"
      - name: Encerrar LIA com PDV
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1"
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore LealInfoPDV.csproj
      - name: Compilar PDV
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish_setup
      - name: Trazer LIC AI
        shell: powershell
        run: |
          git fetch origin lic-ai
          git checkout origin/lic-ai -- LIC-AI
      - name: Protecao LIA
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_protecao_legada_lia_v10_253.ps1"
      - name: Conversa LIA
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_lic_ai_conversa_v10_210.ps1"
      - name: Captura LIA
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_resposta_v10_213.ps1"
      - name: Ciclo voz
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_ciclo_voz_v10_215.ps1"
      - name: Limitar captura
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_captura_timeout_v10_240.ps1"
      - name: Timeout
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_timeout_v10_220.ps1"
      - name: Resposta rapida
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_resposta_rapida_v10_221.ps1"
      - name: Inteligencia
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\expandir_inteligencia_lia_v10_225.ps1"
      - name: TTS
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_tts_openai_v10_217.ps1"
      - name: Realtime
        shell: powershell
        run: |
          Copy-Item "realtime\OpenAiRealtimeConnection.cs" "LIC-AI\Core\OpenAiRealtimeConnection.cs" -Force
          Copy-Item "realtime\MainForm.cs" "LIC-AI\MainForm.cs" -Force
          $project=Get-Content "LIC-AI\LicAi.csproj" -Raw
          $project=$project.Replace('<PackageReference Include="Vosk" Version="0.3.38" />','')
          if($project -notmatch 'PackageReference Include="Microsoft.Windows.SDK.Contracts"'){ $project=$project.Replace('</ItemGroup>','    <PackageReference Include="Microsoft.Windows.SDK.Contracts" Version="10.0.26100.4948" />' + [Environment]::NewLine + '  </ItemGroup>') }
          Set-Content "LIC-AI\LicAi.csproj" $project -Encoding UTF8
      - run: dotnet restore LIC-AI/LicAi.csproj
      - run: dotnet publish LIC-AI/LicAi.csproj -c Release -r win-x64 --self-contained true -o publish_setup/LIC-AI
      - name: Gerar ZIP
        shell: powershell
        run: Compress-Archive -Path "publish_setup\*" -DestinationPath $env:UPDATE_PACKAGE -CompressionLevel Optimal
      - name: Instalar Inno
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Fabricar Setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "INSTALADOR_LEAL_INFO_PDV_V10_130.iss"'
      - name: Publicar Release
        shell: pwsh
        run: |
          $setup="SETUP_PRONTO/$env:SETUP_FILE"
          gh release delete $env:UPDATE_TAG --repo $env:UPDATE_REPO --cleanup-tag --yes 2>$null
          gh release create $env:UPDATE_TAG $env:UPDATE_PACKAGE $setup --repo $env:UPDATE_REPO --title "LEAL INFO PDV V$env:UPDATE_VERSION" --notes "V10.274: somente centralizacao nativa da janela de login; demais funcoes preservadas." --latest
      - name: Validar e ativar
        shell: pwsh
        run: |
          $release=gh api "repos/$env:UPDATE_REPO/releases/latest" | ConvertFrom-Json
          if($release.tag_name -ne $env:UPDATE_TAG){throw "Release incorreto"}
          $asset=$release.assets|Where-Object{$_.name -eq $env:UPDATE_PACKAGE}
          if(-not $asset){throw "ZIP ausente"}
          $hash=(Get-FileHash $env:UPDATE_PACKAGE -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes="V10.274: somente centralizacao nativa da janela de login; demais funcoes preservadas."
          $manifest=@{Version=$env:UPDATE_VERSION;PackageUrl=$asset.browser_download_url;Sha256=$hash;Notes=$notes;DownloadUrl="https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:SETUP_FILE";Mandatory=$false}|ConvertTo-Json
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest))
          $sha=gh api "repos/$env:UPDATE_REPO/contents/version.json" --jq ".sha"
          gh api --method PUT "repos/$env:UPDATE_REPO/contents/version.json" -f message="Ativar V10.274" -f content="$encoded" -f sha="$sha"
