name: Publicar atualizacao LEAL INFO PDV V10.179

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publicar-atualizacao-pdv
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar-atualizacao:
    runs-on: windows-latest
    env:
      UPDATE_VERSION: "10.179"
      UPDATE_TAG: "v10.179"
      SETUP_FILE: "Setup_LEAL_INFO_PDV_V10_179_FINAL.exe"
      UPDATE_PACKAGE: "LEAL_INFO_PDV_V10_179_UPDATE.zip"
      UPDATE_REPO: "lealinfopdvnovo/leal-info-pdv-updates"
      GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar versao
        shell: powershell
        run: |
          $u = Get-Content "UpdateManager.cs" -Raw
          $u = [regex]::Replace($u, 'CurrentVersion="[^"]+"', 'CurrentVersion="10.179"')
          $u = [regex]::Replace($u, 'LEAL-INFO-PDV-Updater/[0-9.]+', 'LEAL-INFO-PDV-Updater/10.179')
          Set-Content "UpdateManager.cs" $u -Encoding UTF8
          $i = Get-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" -Raw
          $i = [regex]::Replace($i, '#define MyAppVersion[^\r\n]*', '#define MyAppVersion "10.179"')
          $i = [regex]::Replace($i, 'OutputBaseFilename=.*', 'OutputBaseFilename=Setup_LEAL_INFO_PDV_V10_179_FINAL')
          Set-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" $i -Encoding UTF8
          if ((Get-Content "LealInfoPDV.csproj" -Raw) -notmatch '<Version>10\.179\.0</Version>') { throw "csproj nao esta em V10.179" }

      - name: Preservar visual aprovado do PDV
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_visual_estavel_v10_177.ps1"

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore LealInfoPDV.csproj

      - name: Publicar LEAL INFO PDV
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish_setup

      - name: Criar pacote
        shell: powershell
        run: Compress-Archive -Path "publish_setup\*" -DestinationPath $env:UPDATE_PACKAGE -CompressionLevel Optimal

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Fabricar Setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "INSTALADOR_LEAL_INFO_PDV_V10_130.iss"'

      - name: Publicar Release e ativar atualizacao
        shell: pwsh
        run: |
          $setup = "SETUP_PRONTO/$env:SETUP_FILE"
          $package = $env:UPDATE_PACKAGE
          if (!(Test-Path $setup)) { throw "Setup nao encontrado" }
          if (!(Test-Path $package)) { throw "Pacote nao encontrado" }
          $packageHash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $ErrorActionPreference = "Continue"
          gh release delete $env:UPDATE_TAG --repo $env:UPDATE_REPO --cleanup-tag --yes 2>$null
          $ErrorActionPreference = "Stop"
          $notes = "V10.179: abertura correta do PDV restaurada com o video oficial, mantendo a antiga assistente removida e as demais funcoes preservadas."
          gh release create $env:UPDATE_TAG $package $setup --repo $env:UPDATE_REPO --title "LEAL INFO PDV V$env:UPDATE_VERSION" --notes $notes
          $manifest = @{Version=$env:UPDATE_VERSION;PackageUrl="https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:UPDATE_PACKAGE";Sha256=$packageHash;Notes=$notes;DownloadUrl="https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:SETUP_FILE";Mandatory=$false;Message=$notes} | ConvertTo-Json
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest))
          $sha = gh api "repos/$env:UPDATE_REPO/contents/version.json" --jq ".sha"
          gh api --method PUT "repos/$env:UPDATE_REPO/contents/version.json" -f message="Ativar V10.179" -f content="$encoded" -f sha="$sha"

      - name: Guardar pacote
        uses: actions/upload-artifact@v4
        with:
          name: LEAL_INFO_PDV_V10_179_UPDATE
          path: LEAL_INFO_PDV_V10_179_UPDATE.zip
          if-no-files-found: error

      - name: Guardar Setup
        uses: actions/upload-artifact@v4
        with:
          name: Setup_LEAL_INFO_PDV_V10_179_FINAL
          path: SETUP_PRONTO/Setup_LEAL_INFO_PDV_V10_179_FINAL.exe
          if-no-files-found: error
