# V10.147 wake words e apelidos informais da LIA
name: Publicar atualização automática LEAL INFO PDV V10.147

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publicar-atualizacao-pdv
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar-atualizacao:
    runs-on: windows-latest
    env:
      UPDATE_VERSION: "10.147"
      UPDATE_TAG: "v10.147"
      SETUP_FILE: "Setup_LEAL_INFO_PDV_V10_147_LIA_FINAL.exe"
      UPDATE_PACKAGE: "LEAL_INFO_PDV_V10_147_UPDATE.zip"
      UPDATE_REPO: "lealinfopdvnovo/leal-info-pdv-updates"
      GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Alinhar versão interna do atualizador
        shell: powershell
        run: |
          $p = "UpdateManager.cs"
          $c = Get-Content $p -Raw
          $c = $c.Replace('CurrentVersion="10.143"','CurrentVersion="10.147"')
          $c = $c.Replace('CurrentVersion="10.144"','CurrentVersion="10.147"')
          $c = $c.Replace('CurrentVersion="10.145"','CurrentVersion="10.147"')
          $c = $c.Replace('CurrentVersion="10.146"','CurrentVersion="10.147"')
          $c = $c.Replace('Updater/10.143','Updater/10.147')
          $c = $c.Replace('Updater/10.144','Updater/10.147')
          $c = $c.Replace('Updater/10.145','Updater/10.147')
          $c = $c.Replace('Updater/10.146','Updater/10.147')
          Set-Content -Path $p -Value $c -Encoding UTF8
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar dependências
        run: dotnet restore LealInfoPDV.csproj
      - name: Publicar LEAL INFO PDV
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish_setup
      - name: Criar pacote da atualização automática
        shell: powershell
        run: |
          if (Test-Path $env:UPDATE_PACKAGE) { Remove-Item $env:UPDATE_PACKAGE -Force }
          Compress-Archive -Path "publish_setup\*" -DestinationPath $env:UPDATE_PACKAGE -CompressionLevel Optimal
      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Fabricar Setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "INSTALADOR_LEAL_INFO_PDV_V10_130.iss"'
      - name: Publicar Release e ativar atualização
        shell: pwsh
        run: |
          $setup = "SETUP_PRONTO/$env:SETUP_FILE"
          $package = $env:UPDATE_PACKAGE
          $ErrorActionPreference = "Continue"
          gh release delete $env:UPDATE_TAG --repo $env:UPDATE_REPO --cleanup-tag --yes 2>$null
          $ErrorActionPreference = "Stop"
          gh release create $env:UPDATE_TAG $package $setup --repo $env:UPDATE_REPO --title "LEAL INFO PDV V$env:UPDATE_VERSION" --notes "V10.147: LIA atende quando chamada pelo nome e por apelidos informais configurados, mantendo comandos do PDV e proteções locais."
          $manifest = @{
            Version = $env:UPDATE_VERSION
            PackageUrl = "https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:UPDATE_PACKAGE"
            Sha256 = ""
            Notes = "V10.147: LIA atende ao ser chamada por LIA e apelidos informais configurados."
          } | ConvertTo-Json
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest))
          $sha = gh api "repos/$env:UPDATE_REPO/contents/version.json" --jq ".sha"
          gh api --method PUT "repos/$env:UPDATE_REPO/contents/version.json" -f message="Ativar atualizacao V$env:UPDATE_VERSION" -f content="$encoded" -f sha="$sha"
      - name: Guardar pacote de atualização
        uses: actions/upload-artifact@v4
        with:
          name: LEAL_INFO_PDV_V10_147_UPDATE
          path: LEAL_INFO_PDV_V10_147_UPDATE.zip
          if-no-files-found: error
      - name: Guardar Setup
        uses: actions/upload-artifact@v4
        with:
          name: Setup_LEAL_INFO_PDV_V10_147_LIA_FINAL
          path: SETUP_PRONTO/Setup_LEAL_INFO_PDV_V10_147_LIA_FINAL.exe
          if-no-files-found: error
