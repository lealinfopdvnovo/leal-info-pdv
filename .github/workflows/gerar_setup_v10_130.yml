# V10.169 - atalhos grandes no padrão holográfico da LIA
name: Publicar atualização automática LEAL INFO PDV V10.169

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publicar-atualizacao-pdv
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar-atualizacao:
    runs-on: windows-latest
    env:
      UPDATE_VERSION: "10.169"
      UPDATE_TAG: "v10.169"
      SETUP_FILE: "Setup_LEAL_INFO_PDV_V10_169_LIA_FINAL.exe"
      UPDATE_PACKAGE: "LEAL_INFO_PDV_V10_169_UPDATE.zip"
      UPDATE_REPO: "lealinfopdvnovo/leal-info-pdv-updates"
      GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar V10.169
        shell: powershell
        run: |
          $u = Get-Content "UpdateManager.cs" -Raw
          $u = $u.Replace('CurrentVersion="10.168"','CurrentVersion="10.169"')
          $u = $u.Replace('Updater/10.168','Updater/10.169')
          Set-Content "UpdateManager.cs" $u -Encoding UTF8
          $i = Get-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" -Raw
          $i = $i.Replace('#define MyAppVersion "10.168"','#define MyAppVersion "10.169"')
          $i = $i.Replace('OutputBaseFilename=Setup_LEAL_INFO_PDV_V10_168_LIA_FINAL','OutputBaseFilename=Setup_LEAL_INFO_PDV_V10_169_LIA_FINAL')
          Set-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" $i -Encoding UTF8
          if ((Get-Content "LealInfoPDV.csproj" -Raw) -notmatch '<Version>10\.169\.0</Version>') { throw "csproj nao esta em V10.169" }
          if (!(Test-Path "Assets\lia_abertura_pro.mp4")) { throw "Video oficial da abertura Pro nao encontrado" }

      - name: Ampliar atalhos e aplicar visual LIA
        shell: powershell
        run: |
          $main = Get-Content "MainForm.cs" -Raw
          $start = $main.IndexOf('private void AddTool(')
          $end = $main.IndexOf('private void ApplyFloatingTheme', $start)
          if ($start -lt 0 -or $end -lt 0) { throw "Metodo AddTool nao localizado" }
          $before = $main.Substring(0,$start)
          $tool = $main.Substring($start,$end-$start)
          $after = $main.Substring($end)
          $tool = $tool.Replace('Width = 42,','Width = 82,')
          $tool = $tool.Replace('Height = 42,','Height = 76,')
          $tool = $tool.Replace('Left = (cardW - 42) / 2,','Left = (cardW - 82) / 2,')
          $tool = $tool.Replace('Top = 4,','Top = 2,')
          $tool = $tool.Replace('Height = 52,','Height = 28,')
          $tool = $tool.Replace('Top = 48,','Top = 74,')
          $tool = $tool.Replace('Font = new Font("Segoe UI", 7.8f, FontStyle.Bold),','Font = new Font("Segoe UI", 8.2f, FontStyle.Bold),')
          $tool = $tool.Replace('int target = 42;','int target = 82;')
          $tool = $tool.Replace('target = on ? 52 : 42;','target = on ? 88 : 82;')
          $tool = $tool.Replace('pic.Top = hover ? 0 : 4;','pic.Top = hover ? 0 : 2;')
          $tool = $tool.Replace('pic.Top = hover ? Math.Max(0,4-(next-42)/3) : 4;','pic.Top = hover ? Math.Max(0,2-(next-82)/3) : 2;')
          $main = $before + $tool + $after
          Set-Content "MainForm.cs" $main -Encoding UTF8

          Add-Type -AssemblyName System.Drawing
          $cores = @{
            'products.png'  = [System.Drawing.Color]::FromArgb(0,174,239)
            'customers.png' = [System.Drawing.Color]::FromArgb(35,205,255)
            'suppliers.png' = [System.Drawing.Color]::FromArgb(255,145,55)
            'services.png'  = [System.Drawing.Color]::FromArgb(35,205,155)
            'history.png'   = [System.Drawing.Color]::FromArgb(145,105,255)
            'finance.png'   = [System.Drawing.Color]::FromArgb(0,205,220)
            'orders.png'    = [System.Drawing.Color]::FromArgb(255,175,35)
            'quotes.png'    = [System.Drawing.Color]::FromArgb(0,190,235)
            'sales.png'     = [System.Drawing.Color]::FromArgb(255,75,150)
            'reports.png'   = [System.Drawing.Color]::FromArgb(95,135,255)
            'backup.png'    = [System.Drawing.Color]::FromArgb(30,205,245)
            'settings.png'  = [System.Drawing.Color]::FromArgb(145,180,210)
            'exit.png'      = [System.Drawing.Color]::FromArgb(255,80,90)
          }
          foreach ($nome in $cores.Keys) {
            $path = Join-Path 'Assets' $nome
            if (!(Test-Path $path)) { continue }
            $accent = $cores[$nome]
            $src = [System.Drawing.Bitmap]::FromFile((Resolve-Path $path))
            $out = New-Object System.Drawing.Bitmap 160,160
            $g = [System.Drawing.Graphics]::FromImage($out)
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.Clear([System.Drawing.Color]::Transparent)
            foreach ($r in @(154,146,138)) {
              $alpha = if ($r -eq 154) { 22 } elseif ($r -eq 146) { 40 } else { 65 }
              $b = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb($alpha,$accent.R,$accent.G,$accent.B))
              $xy=(160-$r)/2
              $g.FillEllipse($b,$xy,$xy,$r,$r)
              $b.Dispose()
            }
            $orb = New-Object System.Drawing.Rectangle 12,12,136,136
            $grad = New-Object System.Drawing.Drawing2D.LinearGradientBrush($orb,[System.Drawing.Color]::FromArgb(255,38,195,250),[System.Drawing.Color]::FromArgb(255,1,28,68),90)
            $g.FillEllipse($grad,$orb)
            $grad.Dispose()
            $ring1 = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(245,$accent.R,$accent.G,$accent.B),6)
            $g.DrawEllipse($ring1,$orb)
            $ring1.Dispose()
            $ring2 = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(150,210,250,255),2)
            $g.DrawEllipse($ring2,18,18,124,124)
            $ring2.Dispose()
            $shine = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(95,255,255,255))
            $g.FillEllipse($shine,43,25,74,25)
            $shine.Dispose()
            $attrs = New-Object System.Drawing.Imaging.ImageAttributes
            $matrix = New-Object System.Drawing.Imaging.ColorMatrix
            $matrix.Matrix00=0; $matrix.Matrix11=0; $matrix.Matrix22=0
            $matrix.Matrix40=1; $matrix.Matrix41=1; $matrix.Matrix42=1
            $attrs.SetColorMatrix($matrix)
            $dest = New-Object System.Drawing.Rectangle 45,45,70,70
            $g.DrawImage($src,$dest,0,0,$src.Width,$src.Height,[System.Drawing.GraphicsUnit]::Pixel,$attrs)
            $attrs.Dispose(); $src.Dispose(); $g.Dispose()
            $tmp = "$path.tmp.png"
            $out.Save($tmp,[System.Drawing.Imaging.ImageFormat]::Png)
            $out.Dispose()
            Move-Item $tmp $path -Force
          }

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore LealInfoPDV.csproj

      - name: Publicar LEAL INFO PDV
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish_setup

      - name: Criar pacote da atualização automática
        shell: powershell
        run: |
          if (Test-Path $env:UPDATE_PACKAGE) { Remove-Item $env:UPDATE_PACKAGE -Force }
          Compress-Archive -Path "publish_setup\*" -DestinationPath $env:UPDATE_PACKAGE -CompressionLevel Optimal

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Fabricar Setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "INSTALADOR_LEAL_INFO_PDV_V10_130.iss"'

      - name: Publicar Release e ativar atualização
        shell: pwsh
        run: |
          $setup = "SETUP_PRONTO/$env:SETUP_FILE"
          $package = $env:UPDATE_PACKAGE
          if (!(Test-Path $package)) { throw "Pacote nao encontrado: $package" }
          if (!(Test-Path $setup)) { throw "Setup nao encontrado: $setup" }
          $packageHash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $ErrorActionPreference = "Continue"
          gh release delete $env:UPDATE_TAG --repo $env:UPDATE_REPO --cleanup-tag --yes 2>$null
          $ErrorActionPreference = "Stop"
          $notes = "V10.169: atalhos superiores ampliados para preencher praticamente todo o card, com acabamento holográfico inspirado na LIA e nomes integrados no próprio botão."
          gh release create $env:UPDATE_TAG $package $setup --repo $env:UPDATE_REPO --title "LEAL INFO PDV V$env:UPDATE_VERSION" --notes $notes
          $manifest = @{
            Version = $env:UPDATE_VERSION
            PackageUrl = "https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:UPDATE_PACKAGE"
            Sha256 = $packageHash
            Notes = $notes
            DownloadUrl = "https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:SETUP_FILE"
            Mandatory = $false
            Message = $notes
          } | ConvertTo-Json
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest))
          $sha = gh api "repos/$env:UPDATE_REPO/contents/version.json" --jq ".sha"
          gh api --method PUT "repos/$env:UPDATE_REPO/contents/version.json" -f message="Ativar atualizacao V$env:UPDATE_VERSION" -f content="$encoded" -f sha="$sha"

      - name: Guardar pacote de atualização
        uses: actions/upload-artifact@v4
        with:
          name: LEAL_INFO_PDV_V10_169_UPDATE
          path: LEAL_INFO_PDV_V10_169_UPDATE.zip
          if-no-files-found: error

      - name: Guardar Setup
        uses: actions/upload-artifact@v4
        with:
          name: Setup_LEAL_INFO_PDV_V10_169_LIA_FINAL
          path: SETUP_PRONTO/Setup_LEAL_INFO_PDV_V10_169_LIA_FINAL.exe
          if-no-files-found: error
