name: Publicar atualizacao LEAL INFO PDV V10.226

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

concurrency:
  group: publicar-atualizacao-pdv
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar-atualizacao:
    runs-on: windows-latest
    env:
      UPDATE_VERSION: "10.226"
      UPDATE_TAG: "v10.226"
      SETUP_FILE: "Setup_LEAL_INFO_PDV_V10_226_FINAL.exe"
      UPDATE_PACKAGE: "LEAL_INFO_PDV_V10_226_UPDATE.zip"
      UPDATE_REPO: "lealinfopdvnovo/leal-info-pdv-updates"
      GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar versao
        shell: powershell
        run: |
          $u=Get-Content "UpdateManager.cs" -Raw; $u=[regex]::Replace($u,'CurrentVersion="[^"]+"','CurrentVersion="10.226"'); $u=[regex]::Replace($u,'LEAL-INFO-PDV-Updater/[0-9.]+','LEAL-INFO-PDV-Updater/10.226'); Set-Content "UpdateManager.cs" $u -Encoding UTF8
          $i=Get-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" -Raw; $i=[regex]::Replace($i,'#define MyAppVersion[^\r\n]*','#define MyAppVersion "10.226"'); $i=[regex]::Replace($i,'OutputBaseFilename=.*','OutputBaseFilename=Setup_LEAL_INFO_PDV_V10_226_FINAL'); Set-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" $i -Encoding UTF8
          if ((Get-Content "LealInfoPDV.csproj" -Raw) -notmatch '<Version>10\.226\.0</Version>') { throw "csproj nao esta em V10.226" }

      - name: Preservar visual aprovado do PDV
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_visual_estavel_v10_177.ps1"

      - name: Aplicar esfera LIC AI
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_lic_ai_botao_v10_186.ps1"

      - name: Aplicar estados dinamicos da esfera
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_lic_ai_estado_v10_210.ps1"

      - name: Encerrar LIA junto com o PDV
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1"

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias PDV
        run: dotnet restore LealInfoPDV.csproj

      - name: Publicar LEAL INFO PDV
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish_setup

      - name: Trazer LIC AI isolada
        shell: powershell
        run: |
          git fetch origin lic-ai
          git checkout origin/lic-ai -- LIC-AI
          if (!(Test-Path "LIC-AI\LicAi.csproj")) { throw "Projeto LIC AI nao encontrado" }

      - name: Aplicar conversa continua
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_lic_ai_conversa_v10_210.ps1"

      - name: Corrigir captura e resposta do microfone
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_resposta_v10_213.ps1"

      - name: Sincronizar microfone, fala e repouso
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_ciclo_voz_v10_215.ps1"

      - name: Ativar voz natural da OpenAI
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_tts_openai_v10_217.ps1"

      - name: Impedir instancia invisivel travada
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_timeout_v10_220.ps1"

      - name: Ativar resposta rapida da LIA
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_resposta_rapida_v10_221.ps1"

      - name: Expandir inteligencia e conhecimento do PDV
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\expandir_inteligencia_lia_v10_225.ps1"

      - name: Ativar conversa continua e voz rapida
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_velocidade_continua_v10_222.ps1"

      - name: Restaurar dependencias LIC AI
        run: dotnet restore LIC-AI/LicAi.csproj

      - name: Publicar LIC AI separada
        run: dotnet publish LIC-AI/LicAi.csproj -c Release -r win-x64 --self-contained true -o publish_setup/LIC-AI

      - name: Validar LIC AI no pacote
        shell: powershell
        run: if (!(Test-Path "publish_setup\LIC-AI\LicAi.exe")) { throw "LIC AI nao foi incluida no pacote" }

      - name: Criar pacote
        shell: powershell
        run: Compress-Archive -Path "publish_setup\*" -DestinationPath $env:UPDATE_PACKAGE -CompressionLevel Optimal

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Fabricar Setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "INSTALADOR_LEAL_INFO_PDV_V10_130.iss"'

      - name: Publicar Release e ativar atualizacao
        shell: pwsh
        run: |
          $setup="SETUP_PRONTO/$env:SETUP_FILE"; $package=$env:UPDATE_PACKAGE
          if (!(Test-Path $setup)) { throw "Setup nao encontrado" }; if (!(Test-Path $package)) { throw "Pacote nao encontrado" }
          $packageHash=(Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $ErrorActionPreference="Continue"; gh release delete $env:UPDATE_TAG --repo $env:UPDATE_REPO --cleanup-tag --yes 2>$null; $ErrorActionPreference="Stop"
          $notes="V10.226: impede telas duplicadas e repete comandos apenas quando solicitado explicitamente."
          gh release create $env:UPDATE_TAG $package $setup --repo $env:UPDATE_REPO --title "LEAL INFO PDV V$env:UPDATE_VERSION" --notes $notes
          $manifest=@{Version=$env:UPDATE_VERSION;PackageUrl="https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:UPDATE_PACKAGE";Sha256=$packageHash;Notes=$notes;DownloadUrl="https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:SETUP_FILE";Mandatory=$false;Message=$notes}|ConvertTo-Json
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest)); $sha=gh api "repos/$env:UPDATE_REPO/contents/version.json" --jq ".sha"; gh api --method PUT "repos/$env:UPDATE_REPO/contents/version.json" -f message="Ativar V10.226" -f content="$encoded" -f sha="$sha"

      - name: Guardar pacote
        uses: actions/upload-artifact@v4
        with:
          name: LEAL_INFO_PDV_V10_226_UPDATE
          path: LEAL_INFO_PDV_V10_226_UPDATE.zip
          if-no-files-found: error

      - name: Guardar Setup
        uses: actions/upload-artifact@v4
        with:
          name: Setup_LEAL_INFO_PDV_V10_226_FINAL
          path: SETUP_PRONTO/Setup_LEAL_INFO_PDV_V10_226_FINAL.exe
          if-no-files-found: error
