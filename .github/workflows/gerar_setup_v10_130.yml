name: Publicar atualizacao LEAL INFO PDV V10.186

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publicar-atualizacao-pdv
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publicar-atualizacao:
    runs-on: windows-latest
    env:
      UPDATE_VERSION: "10.186"
      UPDATE_TAG: "v10.186"
      SETUP_FILE: "Setup_LEAL_INFO_PDV_V10_186_FINAL.exe"
      UPDATE_PACKAGE: "LEAL_INFO_PDV_V10_186_UPDATE.zip"
      RELEASE_REPO: "lealinfopdvnovo/leal-info-pdv"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar versao
        shell: powershell
        run: |
          $u = Get-Content "UpdateManager.cs" -Raw
          $u = [regex]::Replace($u, 'CurrentVersion="[^"]+"', 'CurrentVersion="10.186"')
          $u = [regex]::Replace($u, 'LEAL-INFO-PDV-Updater/[0-9.]+', 'LEAL-INFO-PDV-Updater/10.186')
          Set-Content "UpdateManager.cs" $u -Encoding UTF8
          $i = Get-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" -Raw
          $i = [regex]::Replace($i, '#define MyAppVersion[^\r\n]*', '#define MyAppVersion "10.186"')
          $i = [regex]::Replace($i, 'OutputBaseFilename=.*', 'OutputBaseFilename=Setup_LEAL_INFO_PDV_V10_186_FINAL')
          Set-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" $i -Encoding UTF8
          if ((Get-Content "LealInfoPDV.csproj" -Raw) -notmatch '<Version>10\.186\.0</Version>') { throw "csproj nao esta em V10.186" }
      - name: Preservar visual aprovado do PDV
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_visual_estavel_v10_177.ps1"
      - name: Aplicar botao LIC AI flamejante
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_lic_ai_botao_v10_186.ps1"
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar dependencias PDV
        run: dotnet restore LealInfoPDV.csproj
      - name: Publicar LEAL INFO PDV
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish_setup
      - name: Trazer LIC AI isolada
        shell: powershell
        run: |
          git fetch origin lic-ai
          git checkout origin/lic-ai -- LIC-AI
          if (!(Test-Path "LIC-AI\LicAi.csproj")) { throw "Projeto LIC AI nao encontrado" }
      - name: Restaurar dependencias LIC AI
        run: dotnet restore LIC-AI/LicAi.csproj
      - name: Publicar LIC AI separada
        run: dotnet publish LIC-AI/LicAi.csproj -c Release -r win-x64 --self-contained true -o publish_setup/LIC-AI
      - name: Validar LIC AI no pacote
        shell: powershell
        run: |
          if (!(Test-Path "publish_setup\LIC-AI\LicAi.exe")) { throw "LIC AI nao foi incluida no pacote" }
      - name: Criar pacote
        shell: powershell
        run: Compress-Archive -Path "publish_setup\*" -DestinationPath $env:UPDATE_PACKAGE -CompressionLevel Optimal
      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Fabricar Setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "INSTALADOR_LEAL_INFO_PDV_V10_130.iss"'
      - name: Publicar release V10.186
        shell: pwsh
        run: |
          $setup = "SETUP_PRONTO/$env:SETUP_FILE"
          if (!(Test-Path $setup)) { throw "Setup nao encontrado" }
          $ErrorActionPreference = "Continue"
          gh release delete $env:UPDATE_TAG --repo $env:RELEASE_REPO --cleanup-tag --yes 2>$null
          $ErrorActionPreference = "Stop"
          $notes = "V10.186: botao LIC AI reposicionado na tela principal em vermelho flamejante pulsante; LIC AI continua separada do PDV."
          gh release create $env:UPDATE_TAG $env:UPDATE_PACKAGE $setup --repo $env:RELEASE_REPO --title "LEAL INFO PDV V$env:UPDATE_VERSION" --notes $notes
      - name: Guardar pacote
        uses: actions/upload-artifact@v4
        with:
          name: LEAL_INFO_PDV_V10_186_UPDATE
          path: LEAL_INFO_PDV_V10_186_UPDATE.zip
          if-no-files-found: error
      - name: Guardar Setup
        uses: actions/upload-artifact@v4
        with:
          name: Setup_LEAL_INFO_PDV_V10_186_FINAL
          path: SETUP_PRONTO/Setup_LEAL_INFO_PDV_V10_186_FINAL.exe
          if-no-files-found: error
