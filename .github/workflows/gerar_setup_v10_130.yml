name: Publicar atualização automática LEAL INFO PDV V10.170

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publicar-atualizacao-pdv
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar-atualizacao:
    runs-on: windows-latest
    env:
      UPDATE_VERSION: "10.170"
      UPDATE_TAG: "v10.170"
      SETUP_FILE: "Setup_LEAL_INFO_PDV_V10_170_LIA_FINAL.exe"
      UPDATE_PACKAGE: "LEAL_INFO_PDV_V10_170_UPDATE.zip"
      UPDATE_REPO: "lealinfopdvnovo/leal-info-pdv-updates"
      GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar V10.170
        shell: powershell
        run: |
          $u = Get-Content "UpdateManager.cs" -Raw
          $u = $u.Replace('CurrentVersion="10.168"','CurrentVersion="10.170"')
          $u = $u.Replace('CurrentVersion="10.169"','CurrentVersion="10.170"')
          $u = $u.Replace('Updater/10.168','Updater/10.170')
          $u = $u.Replace('Updater/10.169','Updater/10.170')
          Set-Content "UpdateManager.cs" $u -Encoding UTF8
          $i = Get-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" -Raw
          $i = $i.Replace('#define MyAppVersion "10.168"','#define MyAppVersion "10.170"')
          $i = $i.Replace('#define MyAppVersion "10.169"','#define MyAppVersion "10.170"')
          $i = $i.Replace('OutputBaseFilename=Setup_LEAL_INFO_PDV_V10_168_LIA_FINAL','OutputBaseFilename=Setup_LEAL_INFO_PDV_V10_170_LIA_FINAL')
          $i = $i.Replace('OutputBaseFilename=Setup_LEAL_INFO_PDV_V10_169_LIA_FINAL','OutputBaseFilename=Setup_LEAL_INFO_PDV_V10_170_LIA_FINAL')
          Set-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" $i -Encoding UTF8
          if ((Get-Content "LealInfoPDV.csproj" -Raw) -notmatch '<Version>10\.170\.0</Version>') { throw "csproj nao esta em V10.170" }
          if (!(Test-Path "Assets\lia_abertura_pro.mp4")) { throw "Video oficial da abertura Pro nao encontrado" }

      - name: Aplicar cards holográficos sem bolinhas
        shell: powershell
        run: |
          $main = Get-Content "MainForm.cs" -Raw
          $start = $main.IndexOf('private void AddTool(')
          $end = $main.IndexOf('private void ApplyFloatingTheme', $start)
          if ($start -lt 0 -or $end -lt 0) { throw "Metodo AddTool nao localizado" }
          $before = $main.Substring(0,$start)
          $after = $main.Substring($end)
          $tool = @'
private void AddTool(Control parent, string text, string iconFile, Action action)
    {
        const int cardW = 92;
        const int cardH = 104;
        var card = new Panel
        {
            Width = cardW,
            Height = cardH,
            Margin = new Padding(1),
            BackColor = Color.Transparent,
            Cursor = Cursors.Hand
        };
        bool hover = false;
        card.Paint += (_, e) =>
        {
            e.Graphics.SmoothingMode = System.Drawing.Drawing2D.SmoothingMode.AntiAlias;
            var rect = new Rectangle(2, 2, card.Width - 5, card.Height - 5);
            int radius = 20;
            using var gp = new System.Drawing.Drawing2D.GraphicsPath();
            gp.AddArc(rect.X, rect.Y, radius, radius, 180, 90);
            gp.AddArc(rect.Right-radius, rect.Y, radius, radius, 270, 90);
            gp.AddArc(rect.Right-radius, rect.Bottom-radius, radius, radius, 0, 90);
            gp.AddArc(rect.X, rect.Bottom-radius, radius, radius, 90, 90);
            gp.CloseFigure();
            using var glow = new Pen(hover ? Color.FromArgb(185,235,255) : Color.FromArgb(80,205,255), hover ? 4f : 3f);
            e.Graphics.DrawPath(glow, gp);
            var inner = Rectangle.Inflate(rect, -3, -3);
            using var gp2 = new System.Drawing.Drawing2D.GraphicsPath();
            gp2.AddArc(inner.X, inner.Y, radius, radius, 180, 90);
            gp2.AddArc(inner.Right-radius, inner.Y, radius, radius, 270, 90);
            gp2.AddArc(inner.Right-radius, inner.Bottom-radius, radius, radius, 0, 90);
            gp2.AddArc(inner.X, inner.Bottom-radius, radius, radius, 90, 90);
            gp2.CloseFigure();
            using var bg = new System.Drawing.Drawing2D.LinearGradientBrush(inner,
                hover ? Color.FromArgb(22,145,210) : Color.FromArgb(10,96,160),
                Color.FromArgb(2,31,69), 90f);
            e.Graphics.FillPath(bg, gp2);
            using var shine = new Pen(Color.FromArgb(hover ? 175 : 100, 225, 250, 255), 1.5f);
            e.Graphics.DrawArc(shine, inner.X+8, inner.Y+5, inner.Width-16, 28, 195, 150);
        };
        var caption = new Label
        {
            Text = text.Replace("\n", " "),
            Dock = DockStyle.Fill,
            TextAlign = ContentAlignment.MiddleCenter,
            ForeColor = Color.White,
            BackColor = Color.Transparent,
            Font = new Font("Segoe UI", 9.2f, FontStyle.Bold),
            AutoEllipsis = false,
            Cursor = Cursors.Hand,
            Padding = new Padding(4)
        };
        card.Controls.Add(caption);
        void SetHover(bool on)
        {
            hover = on;
            caption.Font = new Font("Segoe UI", on ? 9.7f : 9.2f, FontStyle.Bold);
            card.Invalidate();
        }
        void Enter(object? s, EventArgs e) => SetHover(true);
        void Leave(object? s, EventArgs e)
        {
            var pt = card.PointToClient(Cursor.Position);
            if (!card.ClientRectangle.Contains(pt)) SetHover(false);
        }
        card.MouseEnter += Enter;
        card.MouseLeave += Leave;
        caption.MouseEnter += Enter;
        caption.MouseLeave += Leave;
        void Run(object? s, EventArgs e) => action();
        card.Click += Run;
        caption.Click += Run;
        parent.Controls.Add(card);
    }


    '@
          $main = $before + $tool + $after
          Set-Content "MainForm.cs" $main -Encoding UTF8

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore LealInfoPDV.csproj

      - name: Publicar LEAL INFO PDV
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish_setup

      - name: Criar pacote da atualização automática
        shell: powershell
        run: |
          if (Test-Path $env:UPDATE_PACKAGE) { Remove-Item $env:UPDATE_PACKAGE -Force }
          Compress-Archive -Path "publish_setup\*" -DestinationPath $env:UPDATE_PACKAGE -CompressionLevel Optimal

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Fabricar Setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "INSTALADOR_LEAL_INFO_PDV_V10_130.iss"'

      - name: Publicar Release e ativar atualização
        shell: pwsh
        run: |
          $setup = "SETUP_PRONTO/$env:SETUP_FILE"
          $package = $env:UPDATE_PACKAGE
          if (!(Test-Path $package)) { throw "Pacote nao encontrado: $package" }
          if (!(Test-Path $setup)) { throw "Setup nao encontrado: $setup" }
          $packageHash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $ErrorActionPreference = "Continue"
          gh release delete $env:UPDATE_TAG --repo $env:UPDATE_REPO --cleanup-tag --yes 2>$null
          $ErrorActionPreference = "Stop"
          $notes = "V10.170: remove os círculos dos atalhos; nomes centralizados; cards retangulares de bordas arredondadas com acabamento holográfico inspirado no botão da LIA."
          gh release create $env:UPDATE_TAG $package $setup --repo $env:UPDATE_REPO --title "LEAL INFO PDV V$env:UPDATE_VERSION" --notes $notes
          $manifest = @{
            Version = $env:UPDATE_VERSION
            PackageUrl = "https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:UPDATE_PACKAGE"
            Sha256 = $packageHash
            Notes = $notes
            DownloadUrl = "https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:SETUP_FILE"
            Mandatory = $false
            Message = $notes
          } | ConvertTo-Json
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest))
          $sha = gh api "repos/$env:UPDATE_REPO/contents/version.json" --jq ".sha"
          gh api --method PUT "repos/$env:UPDATE_REPO/contents/version.json" -f message="Ativar atualizacao V$env:UPDATE_VERSION" -f content="$encoded" -f sha="$sha"

      - name: Guardar pacote de atualização
        uses: actions/upload-artifact@v4
        with:
          name: LEAL_INFO_PDV_V10_170_UPDATE
          path: LEAL_INFO_PDV_V10_170_UPDATE.zip
          if-no-files-found: error

      - name: Guardar Setup
        uses: actions/upload-artifact@v4
        with:
          name: Setup_LEAL_INFO_PDV_V10_170_LIA_FINAL
          path: SETUP_PRONTO/Setup_LEAL_INFO_PDV_V10_170_LIA_FINAL.exe
          if-no-files-found: error
