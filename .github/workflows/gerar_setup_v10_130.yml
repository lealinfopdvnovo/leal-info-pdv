# V10.183: atualização automática sem setup — comando de voz para recolher a LIA
name: Publicar atualização LEAL INFO PDV V10.183

on:
  workflow_dispatch:
  push:
    branches:
      - licenciamento-v1

concurrency:
  group: publicar-atualizacao-pdv
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar-atualizacao:
    runs-on: windows-latest
    env:
      UPDATE_VERSION: "10.183"
      UPDATE_TAG: "v10.183"
      UPDATE_PACKAGE: "LEAL_INFO_PDV_V10_183_UPDATE.zip"
      UPDATE_REPO: "lealinfopdvnovo/leal-info-pdv-updates"
      GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Validar video oficial da abertura Pro
        shell: powershell
        run: |
          $video = "Assets\lia_abertura_pro.mp4"
          if (!(Test-Path $video)) { throw "Assets/lia_abertura_pro.mp4 nao encontrado. V10.183 cancelada." }

      - name: Manter correção WebView2 da LIA por voz
        shell: powershell
        run: |
          $p = "LiaVoiceController.cs"
          $c = Get-Content $p -Raw
          $oldCreation = '        web.CreationProperties = new CoreWebView2CreationProperties { UserDataFolder = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "LEAL INFO PDV", "WebView2", "LIA_VOZ_V3") };'
          if ($c.Contains($oldCreation)) {
            $c = $c.Replace($oldCreation + "`r`n", "")
            $c = $c.Replace($oldCreation + "`n", "")
          }
          $oldEnsure = 'await web.EnsureCoreWebView2Async();'
          $newEnsure = 'var liaEnv=await WebView2DataBootstrap.GetEnvironmentAsync();await web.EnsureCoreWebView2Async(liaEnv);'
          if ($c.Contains($oldEnsure)) { $c = $c.Replace($oldEnsure, $newEnsure) }
          if (-not $c.Contains('WebView2DataBootstrap.GetEnvironmentAsync()')) { throw "Ambiente compartilhado da LIA nao aplicado." }
          Set-Content -Path $p -Value $c -Encoding UTF8

      - name: Adicionar comando de voz Recolher LIA
        shell: powershell
        run: |
          $p = "LiaVoiceController.cs"
          $c = Get-Content $p -Raw
          $alvo = '        var n=Normalizar(texto);'
          $novo = @'
        var n=Normalizar(texto);

        // V10.183: permite recolher a LIA por voz, mantendo o clique liga/desliga existente.
        if(Tem(n,"recolher lia","recolhe lia","lia recolher","lia recolhe","fechar lia","fecha lia"))
        {
            orbe.SetEstado("RECOLHENDO");
            main.BeginInvoke(new Action(Encerrar));
            return string.Empty;
        }
'@
          if (-not $c.Contains($alvo)) { throw "Ponto de insercao do comando Recolher LIA nao encontrado." }
          $c = $c.Replace($alvo, $novo.TrimEnd())
          Set-Content -Path $p -Value $c -Encoding UTF8
          $check = Get-Content $p -Raw
          if (-not $check.Contains('"recolher lia"')) { throw "Comando Recolher LIA nao foi aplicado." }

      - name: Alinhar versão interna do atualizador
        shell: powershell
        run: |
          $p = "UpdateManager.cs"
          $c = Get-Content $p -Raw
          foreach ($v in @('10.143','10.144','10.145','10.146','10.147','10.148','10.149','10.150','10.151','10.152','10.153','10.154','10.155','10.156','10.157','10.158','10.159','10.160','10.161','10.162','10.163','10.164','10.165','10.166','10.167','10.168','10.169','10.170','10.171','10.172','10.173','10.174','10.175','10.176','10.177','10.178','10.179','10.180','10.181','10.182')) {
            $c = $c.Replace(('CurrentVersion="' + $v + '"'),'CurrentVersion="10.183"')
            $c = $c.Replace(('Updater/' + $v),'Updater/10.183')
          }
          Set-Content -Path $p -Value $c -Encoding UTF8

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore LealInfoPDV.csproj

      - name: Validar gerador mestre contra o validador real do PDV
        run: dotnet run --project tools/LicenseCompatibilityCheck/LicenseCompatibilityCheck.csproj -c Release

      - name: Publicar LEAL INFO PDV
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish_update

      - name: Criar pacote da atualização automática
        shell: powershell
        run: |
          if (Test-Path $env:UPDATE_PACKAGE) { Remove-Item $env:UPDATE_PACKAGE -Force }
          Compress-Archive -Path "publish_update\*" -DestinationPath $env:UPDATE_PACKAGE -CompressionLevel Optimal

      - name: Publicar pacote e ativar atualização
        shell: pwsh
        run: |
          $package = $env:UPDATE_PACKAGE
          if (!(Test-Path $package)) { throw "Pacote nao encontrado: $package" }
          $packageHash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $ErrorActionPreference = "Continue"
          gh release delete $env:UPDATE_TAG --repo $env:UPDATE_REPO --cleanup-tag --yes 2>$null
          $ErrorActionPreference = "Stop"
          gh release create $env:UPDATE_TAG $package --repo $env:UPDATE_REPO --title "LEAL INFO PDV V$env:UPDATE_VERSION" --notes "V10.183: adiciona o comando de voz 'Recolher LIA' para fechar/recolher a LIA sem clicar novamente. O clique liga/desliga continua funcionando normalmente. Mantém a correção WebView2 da V10.182 e preserva o restante do sistema. Atualização automática, sem Setup."
          $manifest = @{
            Version = $env:UPDATE_VERSION
            PackageUrl = "https://github.com/$env:UPDATE_REPO/releases/download/$env:UPDATE_TAG/$env:UPDATE_PACKAGE"
            Sha256 = $packageHash
            Notes = "V10.183: comando de voz Recolher LIA; restante do sistema preservado."
          } | ConvertTo-Json
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest))
          $sha = gh api "repos/$env:UPDATE_REPO/contents/version.json" --jq ".sha"
          gh api --method PUT "repos/$env:UPDATE_REPO/contents/version.json" -f message="Ativar atualização V$env:UPDATE_VERSION" -f content="$encoded" -f sha="$sha"

      - name: Guardar pacote como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LEAL_INFO_PDV_V10_183_UPDATE
          path: LEAL_INFO_PDV_V10_183_UPDATE.zip
          if-no-files-found: error
          retention-days: 7

      # Mantém a base aprovada; adiciona somente o comando de recolhimento por voz.
