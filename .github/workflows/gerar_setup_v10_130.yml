# V10.180: atualização automática sem setup — LIA + ícones 55x55
name: Preparar atualização LEAL INFO PDV V10.180

on:
  workflow_dispatch:
  push:
    branches:
      - licenciamento-v1

concurrency:
  group: publicar-atualizacao-pdv
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preparar-atualizacao:
    runs-on: windows-latest
    env:
      UPDATE_VERSION: "10.180"
      UPDATE_PACKAGE: "LEAL_INFO_PDV_V10_180_UPDATE.zip"
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Validar video oficial da abertura Pro
        shell: powershell
        run: |
          $video = "Assets\lia_abertura_pro.mp4"
          if (!(Test-Path $video)) { throw "Assets/lia_abertura_pro.mp4 nao encontrado. V10.180 cancelada." }

      - name: Alinhar versão interna do atualizador
        shell: powershell
        run: |
          $p = "UpdateManager.cs"
          $c = Get-Content $p -Raw
          foreach ($v in @('10.143','10.144','10.145','10.146','10.147','10.148','10.149','10.150','10.151','10.152','10.153','10.154','10.155','10.156','10.157','10.158','10.159','10.160','10.161','10.162','10.163','10.164','10.165','10.166','10.167','10.168','10.169','10.170','10.171','10.172','10.173','10.174','10.175','10.176','10.177','10.178','10.179')) {
            $c = $c.Replace(('CurrentVersion="' + $v + '"'),'CurrentVersion="10.180"')
            $c = $c.Replace(('Updater/' + $v),'Updater/10.180')
          }
          Set-Content -Path $p -Value $c -Encoding UTF8

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore LealInfoPDV.csproj

      - name: Validar gerador mestre contra o validador real do PDV
        run: dotnet run --project tools/LicenseCompatibilityCheck/LicenseCompatibilityCheck.csproj -c Release

      - name: Publicar LEAL INFO PDV
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish_update

      - name: Criar pacote da atualização automática
        shell: powershell
        run: |
          if (Test-Path $env:UPDATE_PACKAGE) { Remove-Item $env:UPDATE_PACKAGE -Force }
          Compress-Archive -Path "publish_update\*" -DestinationPath $env:UPDATE_PACKAGE -CompressionLevel Optimal

      - name: Disponibilizar pacote da atualização
        uses: actions/upload-artifact@v4
        with:
          name: LEAL_INFO_PDV_V10_180_UPDATE
          path: LEAL_INFO_PDV_V10_180_UPDATE.zip
          if-no-files-found: error
          retention-days: 7

      # Da V10.180 em diante, esta rotina não fabrica instalador/setup.
