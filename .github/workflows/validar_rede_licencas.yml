name: Validar rede e licencas do PDV
on:
  push:
    branches: ['codex/pdv-rede-*', 'repair/license-persistence']
  pull_request:
    branches: [main]
    paths: ['Network/**', 'Licensing/**', 'tools/SellerGui/**', 'qa/ActivationCapture.cs.txt', 'qa/network/**', 'Database.cs', 'DatabaseBackupService.cs', 'Program.cs', 'MainForm.cs', 'ProductRegistrationForm.cs', 'LealInfoPDV.csproj', 'tools/licencas/**', '.github/workflows/validar_rede_licencas.yml']
permissions:
  contents: read
jobs:
  validar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Aplicar ajustes usados na publicacao
        shell: powershell
        run: |
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
      - name: Testar diagnostico somente leitura no Windows PowerShell
        shell: powershell
        run: ./tools/license-diagnostic/Testar_Diagnostico.ps1
      - name: Compilar PDV com rede
        run: dotnet build LealInfoPDV.csproj -c Release
      - name: Validar licencas e rede TLS com banco central
        run: dotnet run --project qa/network/LealInfoPDV.NetworkTests.csproj -c Release
      - name: Identidade real em dois processos Windows
        shell: pwsh
        run: |
          $a=& ./qa/network/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.NetworkTests.exe --license-identity
          if($LASTEXITCODE -ne 0){throw 'Falha identidade processo A'}
          $b=& ./qa/network/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.NetworkTests.exe --license-identity
          if($LASTEXITCODE -ne 0 -or $a -ne $b){throw 'Identidade mudou entre processos'}
          Write-Host "PASS: identidade igual em dois processos. $a. NAO equivale a reboot ou formatacao real."
      - name: Capturar ativacao e login reais
        shell: pwsh
        run: |
          Copy-Item Program.cs Program.cs.original
          Copy-Item qa/ActivationCapture.cs.txt Program.cs -Force
          dotnet build LealInfoPDV.csproj -c Release -t:Rebuild -o activation-ui
          if($LASTEXITCODE -ne 0){throw 'Falha ao compilar fluxo'}
          $p=Start-Process ./activation-ui/LealInfoPDV.exe -PassThru
          if(-not $p.WaitForExit(90000)){$p.Kill();throw 'Fluxo nao encerrou'}
          if($p.ExitCode -ne 0 -or (Test-Path activation-qa/error.txt)){if(Test-Path activation-qa/error.txt){Get-Content activation-qa/error.txt};throw 'Falha no fluxo'}
          Move-Item Program.cs.original Program.cs -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ativacao-login-windows
          path: activation-qa/
      - name: Preparar pacote de teste
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o network-build
      - uses: actions/upload-artifact@v4
        with:
          name: PDV-rede-validacao
          path: network-build/

      - name: Preparar teste de licenciamento Windows isolado
        shell: pwsh
        run: |
          dotnet publish qa/network/LealInfoPDV.NetworkTests.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o license-field-build
          if($LASTEXITCODE -ne 0){throw 'Falha ao compilar teste isolado'}
          Get-ChildItem license-field-build -Filter *.pdb | Remove-Item
          foreach($name in @('Assets','LIC-AI')){
            $path=Join-Path (Resolve-Path license-field-build) $name
            if(Test-Path $path){Remove-Item -LiteralPath $path -Recurse -Force}
          }
          Set-Content license-field-build/INICIAR_TESTE.bat @("@echo off", 'cd /d "%~dp0"', '"%~dp0LealInfoPDV.NetworkTests.exe" --field-license') -Encoding ascii
          Copy-Item tools/license-migration/Autorizar_Migracao.ps1 license-field-build/
          Copy-Item tools/license-migration/LEIA_ME_TESTE.txt license-field-build/
      - uses: actions/upload-artifact@v4
        with:
          name: LICENCIAMENTO_TESTE_WINDOWS_ISOLADO
          path: license-field-build/
