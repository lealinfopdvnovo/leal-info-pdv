name: Publicar LIA 10.458 somente Casa do Adriano
on:
  push:
    branches: [release/lia-casa-10-458]
permissions:
  contents: read
  actions: read
concurrency:
  group: publicar-lia-casa-10-458
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VALIDATED_SOURCE: c19a69f50616c652dd89341fa4a07fa311750b61
    steps:
      - uses: actions/checkout@v4
      - name: Baixar exatamente candidato aprovado no Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python qa/lia-casa/publish.py download
      - name: Publicar somente feed Casa e verificar URL publica
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: python qa/lia-casa/publish.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publicacao-lia-casa-10-458
          path: |
            published-lia-casa.json
            previous-casa.json
