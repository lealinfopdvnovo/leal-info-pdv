name: Moeda brasileira e orcamento A4 somente 003 - 10.396
on:
  push:
    branches: ['release/vidracaria-moeda-a4-003-10396']
permissions: {contents: read, actions: read}
concurrency:
  group: moeda-a4-vidracaria-003-10396
  cancel-in-progress: true
jobs:
  validar-publicar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Auditar preservacao 003 homologado 10.395
        shell: python
        run: |
          import subprocess
          base='355a81f36ab561779b1b7e88cdc51ac95615b668'
          allowed={'GlassBrazilianMoney.cs','GlassQuoteForm.cs','GlassCommercialDocument.cs','GlassWorkshopForm.cs','GlassMaterialSelection.cs','LealInfoPDV.csproj','UpdateManager.cs','qa/glass-money/Program.cs','qa/glass-money/LealInfoPDV.GlassMoneyTests.csproj','qa/glass-quote-windows/Program.cs','qa/glass-tabs/Program.cs','.github/workflows/moeda_a4_vidracaria_003.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert changed==allowed,changed
          for f in ['LealInfoPDV.csproj','UpdateManager.cs']:
              assert subprocess.check_output(['git','show',base+':'+f]).replace(b'10.395',b'10.396')==subprocess.check_output(['git','show','HEAD:'+f]),f
          print('PASS matematica GlassQuote, SQLite/schema/persistencia, CRUD, +CADASTRAR, dimensoes/unidades, pecas, packing, 2D/3D/cotas e impressao tecnica intactos byte a byte')
      - name: Build e testes Windows antes de publicar
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
          dotnet build LealInfoPDV.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Build falhou'}
          if($env:GITHUB_ACTIONS -ne 'true'){throw 'Exige runner descartavel'}
          $sandbox=Join-Path $env:LOCALAPPDATA 'LealInfoPDV'
          if(Test-Path $sandbox){Remove-Item $sandbox -Recurse -Force}
          dotnet build qa/glass-persistence/LealInfoPDV.GlassPersistenceTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Harness de persistencia nao compilou'}
          New-Item -ItemType Directory glass-persistence-evidencias -Force|Out-Null
          $process=Start-Process dotnet -ArgumentList 'qa/glass-persistence/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.GlassPersistenceTests.dll' -PassThru -NoNewWindow -RedirectStandardOutput glass-persistence-evidencias/stdout.log -RedirectStandardError glass-persistence-evidencias/stderr.log
          $finished=$process.WaitForExit(90000)
          if(!$finished){$process.Kill($true);$process.WaitForExit()}
          Get-Content glass-persistence-evidencias/stdout.log
          Get-Content glass-persistence-evidencias/stderr.log
          if(!$finished -or $process.ExitCode -ne 0){throw 'Persistencia/reinicio/interface falhou'}
      - name: Validar moeda em tres culturas e total132 na tela/A4/persistencia
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sandbox=Join-Path $env:LOCALAPPDATA 'LealInfoPDV'
          if(Test-Path $sandbox){Remove-Item $sandbox -Recurse -Force}
          dotnet build qa/glass-money/LealInfoPDV.GlassMoneyTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'QA moeda nao compilou'}
          $process=Start-Process dotnet -ArgumentList 'qa/glass-money/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.GlassMoneyTests.dll' -PassThru -NoNewWindow -RedirectStandardOutput money-stdout.log -RedirectStandardError money-stderr.log
          $finished=$process.WaitForExit(120000)
          if(!$finished){$process.Kill($true);$process.WaitForExit()}
          Get-Content money-stdout.log
          Get-Content money-stderr.log
          if(!$finished -or $process.ExitCode -ne 0){throw 'Moeda/tela/A4/persistencia falhou'}
      - name: Regressao fisica do Plano de Corte aprovado sem alterar algoritmo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sandbox=Join-Path $env:LOCALAPPDATA 'LealInfoPDV'
          if(Test-Path $sandbox){Remove-Item $sandbox -Recurse -Force}
          dotnet build qa/glass-unit-physical/LealInfoPDV.GlassUnitPhysicalTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'QA fisica nao compilou'}
          $process=Start-Process dotnet -ArgumentList 'qa/glass-unit-physical/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.GlassUnitPhysicalTests.dll' -PassThru -NoNewWindow -RedirectStandardOutput physical-stdout.log -RedirectStandardError physical-stderr.log
          $finished=$process.WaitForExit(120000)
          if(!$finished){$process.Kill($true);$process.WaitForExit()}
          Get-Content physical-stdout.log
          Get-Content physical-stderr.log
          if(!$finished -or $process.ExitCode -ne 0){throw 'Regressao plano de corte falhou'}
      - name: Cadastro real pela Vidracaria e permissao original
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sandbox=Join-Path $env:LOCALAPPDATA 'LealInfoPDV'
          if(Test-Path $sandbox){Remove-Item $sandbox -Recurse -Force}
          dotnet build qa/glass-customer/LealInfoPDV.GlassCustomerTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Teste de cadastro nao compilou'}
          New-Item -ItemType Directory glass-customer-evidencias -Force|Out-Null
          $process=Start-Process dotnet -ArgumentList 'qa/glass-customer/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.GlassCustomerTests.dll' -PassThru -NoNewWindow -RedirectStandardOutput glass-customer-evidencias/stdout.log -RedirectStandardError glass-customer-evidencias/stderr.log
          $finished=$process.WaitForExit(90000)
          if(!$finished){$process.Kill($true);$process.WaitForExit()}
          Get-Content glass-customer-evidencias/stdout.log
          Get-Content glass-customer-evidencias/stderr.log
          if(!$finished -or $process.ExitCode -ne 0){throw 'Cadastro real/layout/permissao falhou'}
      - name: Regressao completa Windows da 10.395
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -ne 'true'){throw 'Exige runner descartavel'}
          $tests=Get-ChildItem qa -Recurse -Filter '*.csproj' | Where-Object {$_.FullName -notmatch '[\\/](speedfood|port003|glass-persistence|glass-customer|glass-unit-physical|glass-money)[\\/]'}
          $tests=$tests | Sort-Object @{Expression={if($_.FullName -match '[\\/](glass-cotas|glass-units)[\\/]'){0}else{1}}},FullName
          foreach($test in $tests){
            $sandbox=Join-Path $env:LOCALAPPDATA 'LealInfoPDV'
            if([IO.Path]::GetFileName($sandbox) -ne 'LealInfoPDV'){throw 'Pasta inesperada'}
            if(Test-Path $sandbox){Remove-Item $sandbox -Recurse -Force}
            Write-Host ('TEST SUITE '+$test.FullName)
            $argsExtra=@()
            if($test.FullName -match '[\\/]kitchen[\\/]'){$argsExtra=@('--','--global')}
            if($test.FullName -match '[\\/](company-cep|sales-logo)[\\/]'){$argsExtra=@('--','003')}
            dotnet run --project $test.FullName -c Release @argsExtra
            if($LASTEXITCODE -ne 0){throw ('Suite falhou: '+$test.FullName)}
          }
          Write-Host 'PASS suites locais; SpeedFood/Firebase online nao executado para preservar escopo'
          Invoke-WebRequest 'https://github.com/lealinfopdvnovo/leal-info-pdv-updates/releases/download/client-003-v10.395/LEAL_INFO_PDV_003_V10_395_UPDATE.zip' -OutFile baseline.zip
          if((Get-FileHash baseline.zip).Hash.ToLowerInvariant() -ne 'f976000c2a493ce5abb3c0d654961c5943c86f0273bda53ef9083f6578339125'){throw 'Baseline mudou'}
          Expand-Archive baseline.zip baseline
          $deps=Get-Content baseline/LealInfoPDV.deps.json -Raw|ConvertFrom-Json
          $sdk=$deps.libraries.PSObject.Properties.Name|Where-Object {$_ -like 'runtimepack.Microsoft.Windows.SDK.NET.Ref/*'}|Select-Object -First 1
          if(!$sdk){throw 'SDK nao encontrado'}
          dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -p:WindowsSdkPackageVersion=$($sdk.Split('/')[1]) -o publish
          if($LASTEXITCODE -ne 0){throw 'Publish build falhou'}
          New-Item -ItemType Directory package|Out-Null
          'LealInfoPDV.exe','LealInfoPDV.dll','LealInfoPDV.deps.json'|ForEach-Object {Copy-Item "publish/$_" package/}
          $before=Get-Content baseline/LealInfoPDV.deps.json -Raw|ConvertFrom-Json -AsHashtable
          $after=Get-Content package/LealInfoPDV.deps.json -Raw|ConvertFrom-Json -AsHashtable
          $old=@($before.libraries.Keys|Where-Object {$_ -notlike 'LealInfoPDV/*'}|Sort-Object)
          $new=@($after.libraries.Keys|Where-Object {$_ -notlike 'LealInfoPDV/*'}|Sort-Object)
          if(Compare-Object $old $new){throw 'Dependencias mudaram'}
          Compress-Archive package/* LEAL_INFO_PDV_003_V10_396_UPDATE.zip
      - name: Validar PDF real e multipagina
        shell: pwsh
        run: |
          python -m pip install pypdf
          if($LASTEXITCODE -ne 0){throw 'Validador PDF indisponivel'}
          @'
          from pypdf import PdfReader
          for name in ['orcamento-real.pdf','orcamento-multipagina.pdf']:
              r=PdfReader('glass-commercial-evidencias/'+name,strict=True)
              assert len(r.pages)>0
              if 'multipagina' in name: assert len(r.pages)>1
              for p in r.pages:
                  assert abs(float(p.mediabox.width)-595.28)<1
                  assert abs(float(p.mediabox.height)-841.89)<1
                  assert len(p.images)>0
              print('PASS PDF A4',name,len(r.pages))
          for name in ['orcamento-132.pdf','reaberto-132.pdf']:
              r=PdfReader('glass-money-evidencias/'+name,strict=True)
              assert len(r.pages)==1
              assert abs(float(r.pages[0].mediabox.width)-595.28)<1
              assert abs(float(r.pages[0].mediabox.height)-841.89)<1
              assert len(r.pages[0].images)>0
              print('PASS PDF132 antes/depois A4',name)
          '@ | python
          if($LASTEXITCODE -ne 0){throw 'PDF invalido'}
      - name: Publicar somente canal 003 com guarda concorrencial
        shell: pwsh
        env: {GH_TOKEN: '${{ secrets.UPDATE_REPO_TOKEN }}', SOURCE_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'
          $head=(Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/$env:GITHUB_REF_NAME" -Headers @{Authorization="Bearer $env:SOURCE_TOKEN"}).object.sha
          if($head -ne $env:GITHUB_SHA){throw 'Candidato superado'}
          $repo='lealinfopdvnovo/leal-info-pdv-updates'
          $protected=@{}
          foreach($p in @('version.json','clients/001/version.json','clients/002/version.json')){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Feed protegido nao pode ser lido'}
            $protected[$p]=$v.sha
          }
          $fourBefore=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExists=$LASTEXITCODE -eq 0
          if($fourExists){$fourSha=($fourBefore|ConvertFrom-Json).sha}
          $entry=gh api "repos/$repo/contents/clients/003/version.json"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw '003 nao pode ser lido'}
          $old=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($entry.content))|ConvertFrom-Json
          if($old.Version -ne '10.395' -or $old.TargetClientCode -ne '003' -or $old.Sha256 -ne 'f976000c2a493ce5abb3c0d654961c5943c86f0273bda53ef9083f6578339125'){throw 'Canal 003 mudou; abortar'}
          $tags=gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[].tag_name'
          if($LASTEXITCODE -ne 0 -or 'client-003-v10.396' -in @($tags)){throw 'Release existente ou auditoria falhou'}
          $package='LEAL_INFO_PDV_003_V10_396_UPDATE.zip'
          $notes='V10.396 exclusiva 003: campos monetários da Vidraçaria em reais/pt-BR, vírgula decimal independente da cultura do Windows; subtotal/totais coerentes com GlassQuote real, valores comerciais A4 e persistência validados no cenário R$132,00. Acesso à prévia comercial A4/PDF explicitado. Plano de Corte homologado, unidades, +CADASTRAR CLIENTE, banco, backup e demais funções preservados. Aguardando homologação física do usuário.'
          $notes|Set-Content notes.txt
          gh release create client-003-v10.396 $package --repo $repo --title 'LEAL INFO PDV 003 V10.396 - Moeda brasileira e Orcamento A4' --notes-file notes.txt --latest=false
          if($LASTEXITCODE -ne 0){throw 'Pacote nao publicado; nao mudar feed'}
          $m=@{Version='10.396';TargetClientCode='003';PackageUrl="https://github.com/$repo/releases/download/client-003-v10.396/$package";Sha256=(Get-FileHash $package).Hash.ToLowerInvariant();SourceCommit=$env:GITHUB_SHA;Notes=$notes;Mandatory=$false}
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($m|ConvertTo-Json)))
          @{message='Moeda e Orcamento A4 10.396 somente 003';sha=$entry.sha;content=$content}|ConvertTo-Json -Compress|Set-Content request.json
          gh api --method PUT "repos/$repo/contents/clients/003/version.json" --input request.json
          if($LASTEXITCODE -ne 0){throw 'Manifest nao publicado'}
          foreach($p in $protected.Keys){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or $v.sha -ne $protected[$p]){throw 'Feed protegido mudou'}
          }
          $fourAfter=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExistsAfter=$LASTEXITCODE -eq 0
          if($fourExistsAfter -ne $fourExists){throw '004 mudou'}
          if($fourExists -and ($fourAfter|ConvertFrom-Json).sha -ne $fourSha){throw '004 mudou'}
          $url="https://raw.githubusercontent.com/$repo/main/clients/003/version.json"
          for($i=0;$i -lt 24;$i++){
            $live=Invoke-RestMethod ($url+'?t='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())
            if($live.Version -eq '10.396' -and $live.TargetClientCode -eq '003'){break}
            Start-Sleep -Seconds 5
          }
          if($live.Version -ne '10.396' -or $live.Sha256 -ne $m.Sha256){throw 'Manifest nao propagou'}
          Invoke-WebRequest $live.PackageUrl -OutFile verificado.zip
          if((Get-FileHash verificado.zip).Hash.ToLowerInvariant() -ne $live.Sha256){throw 'Hash publicado incorreto'}
          Write-Host 'PASS PUBLICADO 003 10.396; hash remoto confirmado; global 001 002 004 intactos'
          exit 0

      - name: Deteccao e download pelo seletor REAL do updater do 003
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $qa=Get-Content qa/glass/Program.cs -Raw
          $qa=$qa.Replace('id == "003" ? "10.383" : "10.379"','id == "001" ? "10.392" : id == "003" ? "10.396" : "10.385"')
          $qa=$qa.Replace('new[] { "001", "002", "003", "004" }','new[] { "003" }')
          $qa=$qa.Replace('new object[] { http, id, "10.378" }','new object[] { http, id, "10.395" }')
          [IO.File]::WriteAllText((Join-Path $PWD 'qa/glass/Program.cs'),$qa)
          dotnet run --project qa/glass/LealInfoPDV.GlassTests.csproj -c Release -- --live
          if($LASTEXITCODE -ne 0){throw 'Deteccao/download do updater real falhou'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidracaria-003-10396-evidencias
          path: |
            *-evidencias/
            LEAL_INFO_PDV_003_V10_396_UPDATE.zip
            verificado.zip
            notes.txt
            money-stdout.log
            money-stderr.log
            physical-stdout.log
            physical-stderr.log
          retention-days: 14
