name: ANGRA workshop real Windows Android data exchange
on:
  pull_request:
    branches: ['feature/app-vidraceiro-android-foundation']
permissions: {contents: read, actions: read, id-token: write}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: actions/cache@v4
        with: {path: ~/.android/debug.keystore, key: angra-professional-explicit-debug-signing-v2}
      - name: Build preserving approved assets and home
        working-directory: mobile/vidraceiro
        run: |
          test -f "$HOME/.android/debug.keystore"
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signature.txt
          grep -q 2ee54920efe7042320f90814e45fd10997f9deb28e213ee92a8955b3e00ffac7 signature.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 mobile/vidraceiro/tests/unlink_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unlink-033
          path: |
            mobile/vidraceiro/unlink-evidence/*
            mobile/vidraceiro/unlink-evidence/*.txt
            mobile/vidraceiro/app/build/outputs/apk/debug/app-debug.apk
