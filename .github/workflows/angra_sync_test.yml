name: ANGRA workshop real Windows Android data exchange
on:
  pull_request:
    branches: ['feature/app-vidraceiro-android-foundation']
permissions: {contents: read, actions: read, id-token: write}
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix: {channel: ['001', '003']}
    env: {ANGRA_QA_CHANNEL: '${{ matrix.channel }}'}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read exact candidate
        shell: pwsh
        run: |
          $s=Get-Content qa/pairing-sources.json -Raw|ConvertFrom-Json
          "SOURCE=$($s.'${{ matrix.channel }}')" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with: {ref: '${{ env.SOURCE }}', path: candidate}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Existing compilation prerequisites
        working-directory: candidate
        shell: pwsh
        run: |
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
      - name: Baseline timing using unchanged installed implementation
        working-directory: candidate
        shell: pwsh
        run: |
          Copy-Item ../qa/angra-perf/BenchmarkProgram.cs qa/angra-sync/Program.cs -Force
          dotnet run --project qa/angra-sync/AngraSyncTests.csproj -c Release -- benchmark
          if($LASTEXITCODE -ne 0){throw 'Timing failed'}
      - uses: actions/upload-artifact@v4
        with: {name: 'before-${{ matrix.channel }}', path: candidate/perf-evidence/, retention-days: 1}
