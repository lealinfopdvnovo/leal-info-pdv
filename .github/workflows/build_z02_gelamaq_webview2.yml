name: Build isolado Z02 GelaMaq WebView2
on:
  workflow_dispatch:
  push:
    branches: [codex/z02-webview-tutorial-fix]
    paths-ignore: ['README.md']
concurrency:
  group: build-isolado-z02-gelamaq
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  publicar-atualizacao:
    runs-on: windows-latest
    env:
      UPDATE_VERSION: "10.357"
      UPDATE_TAG: "v10.357"
      SETUP_FILE: "Setup_LEAL_INFO_PDV_Z02_GELAMAQ_V10_357.exe"
      UPDATE_PACKAGE: "LEAL_INFO_PDV_Z02_GELAMAQ_V10_357_UPDATE.zip"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Preparar versao
        shell: powershell
        run: |
          $i=Get-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" -Raw -Encoding UTF8
          $i=[regex]::Replace($i,'#define MyAppVersion[^\r\n]*','#define MyAppVersion "10.357"')
          $i=[regex]::Replace($i,'OutputBaseFilename=.*','OutputBaseFilename=Setup_LEAL_INFO_PDV_Z02_GELAMAQ_V10_357')
          Set-Content "INSTALADOR_LEAL_INFO_PDV_V10_130.iss" $i -Encoding UTF8
          if ((Get-Content "LealInfoPDV.csproj" -Raw) -notmatch '<Version>10\.357\.0</Version>') { throw "csproj nao esta em V10.357" }
          if ((Get-Content "UpdateManager.cs" -Raw) -notmatch 'CurrentVersion="10\.357"') { throw "UpdateManager nao esta em V10.357" }
      - name: Restaurar Azul Texturizado
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_tema_azul_texturizado_v10_306.ps1"
      - name: Restaurar esfera da LIA
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_lic_ai_botao_v10_186.ps1"
      - name: Restaurar estados da LIA
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_lic_ai_estado_v10_210.ps1"
      - name: Encerrar LIA com PDV
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1"
      - name: Cadastro avancado de produtos
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_cadastro_produtos_avancado_v10_312.ps1"
      - name: Central de equipamentos
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_central_equipamentos_v10_314.ps1"
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore LealInfoPDV.csproj
      - name: Compilar PDV
        run: dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o publish_setup
      - name: Incluir instalador WebView2 da Microsoft
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "publish_setup\\MicrosoftEdgeWebView2Setup.exe"
          if ((Get-Item "publish_setup\\MicrosoftEdgeWebView2Setup.exe").Length -lt 100000) { throw "Bootstrapper WebView2 inválido" }
      - name: Trazer LIC AI
        shell: powershell
        run: |
          git fetch origin lic-ai
          git checkout origin/lic-ai -- LIC-AI
      - name: Protecao LIA
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_protecao_legada_lia_v10_253.ps1"
      - name: Conversa LIA
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\aplicar_lic_ai_conversa_v10_210.ps1"
      - name: Captura LIA
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_resposta_v10_213.ps1"
      - name: Ciclo voz
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_ciclo_voz_v10_215.ps1"
      - name: Limitar captura
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_captura_timeout_v10_240.ps1"
      - name: Timeout
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_timeout_v10_220.ps1"
      - name: Resposta rapida
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_resposta_rapida_v10_221.ps1"
      - name: Inteligencia
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\expandir_inteligencia_lia_v10_225.ps1"
      - name: TTS
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\corrigir_lic_ai_tts_openai_v10_217.ps1"
      - name: Realtime
        shell: powershell
        run: |
          Copy-Item "realtime\OpenAiRealtimeConnection.cs" "LIC-AI\Core\OpenAiRealtimeConnection.cs" -Force
          Copy-Item "realtime\MainForm.cs" "LIC-AI\MainForm.cs" -Force
          Copy-Item "realtime\PdvKnowledge.cs" "LIC-AI\Core\PdvKnowledge.cs" -Force
          Copy-Item "realtime\LocalPdvAssistant.cs" "LIC-AI\Core\LocalPdvAssistant.cs" -Force
          $project=Get-Content "LIC-AI\LicAi.csproj" -Raw
          $project=$project.Replace('<PackageReference Include="Vosk" Version="0.3.38" />','')
          if($project -notmatch 'PackageReference Include="Microsoft.CognitiveServices.Speech"'){ $project=$project.Replace('</ItemGroup>','    <PackageReference Include="Microsoft.CognitiveServices.Speech" Version="1.45.0" />' + [Environment]::NewLine + '  </ItemGroup>') }
          if($project -notmatch 'PackageReference Include="System.Speech"'){ $project=$project.Replace('</ItemGroup>','    <PackageReference Include="System.Speech" Version="8.0.0" />' + [Environment]::NewLine + '  </ItemGroup>') }
          Set-Content "LIC-AI\LicAi.csproj" $project -Encoding UTF8
      - name: Aplicar licenciamento da LIA
        shell: pwsh
        run: |
          Copy-Item realtime/LiaLicenseGate.cs LIC-AI/LiaLicenseGate.cs -Force
          $program=Get-Content LIC-AI/Program.cs -Raw
          if(-not $program.Contains('ApplicationConfiguration.Initialize();')){throw 'Entrada LIA nao encontrada'}
          $program=$program.Replace('ApplicationConfiguration.Initialize();','ApplicationConfiguration.Initialize(); if(!LiaLicenseGate.Allowed()){ MessageBox.Show("LIA disponivel somente com licenca ativa Plus ou Pro."); return; }')
          Set-Content LIC-AI/Program.cs $program -Encoding UTF8
      - run: dotnet restore LIC-AI/LicAi.csproj
      - run: dotnet publish LIC-AI/LicAi.csproj -c Release -r win-x64 --self-contained true -o publish_setup/LIC-AI
      - name: Garantir pacote neutro
        shell: pwsh
        run: |
          $forbidden=Get-ChildItem publish_setup -Recurse -File | Where-Object { $_.Extension -in '.db','.sqlite','.pem','.license','.protected','.config','.dat','.leallicenca','.lealrede' }
          if($forbidden){throw 'Dados particulares encontrados no pacote'}
          if(Test-Path publish_setup/LEAL_INFO_VENDEDOR_REDE.exe){throw 'Gerador privado nao pode ser distribuido'}
      - name: Gerar ZIP
        shell: powershell
        run: Compress-Archive -Path "publish_setup\*" -DestinationPath $env:UPDATE_PACKAGE -CompressionLevel Optimal
      - name: Validar ZIP no atualizador real
        run: dotnet run --project qa/network/LealInfoPDV.NetworkTests.csproj -c Release -- --validate-package ${{ env.UPDATE_PACKAGE }}
      - name: Instalar Inno
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Fabricar Setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "INSTALADOR_LEAL_INFO_PDV_V10_130.iss"'
      - name: Testar instalacao e atualizacao sem apagar dados
        shell: pwsh
        run: |
          $setup=(Resolve-Path "SETUP_PRONTO/$env:SETUP_FILE").Path
          $p=Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\PDV-QA' -PassThru -Wait
          if($p.ExitCode -ne 0){throw 'Primeira instalacao falhou'}
          if(-not(Test-Path C:\PDV-QA/LealInfoPDV.exe)){throw 'PDV nao instalado'}
          $data=Join-Path $env:LOCALAPPDATA 'LealInfoPDV'
          New-Item -ItemType Directory $data -Force | Out-Null
          foreach($name in @('network.license','network.config','lealinfo.db','company-logo.png','client-code.protected','users.protected')){[IO.File]::WriteAllText((Join-Path $data $name),'DADO LOCAL QA PRESERVAR')}
          $before=@{}
          Get-ChildItem $data -File | ForEach-Object {$before[$_.Name]=(Get-FileHash $_.FullName).Hash}
          $p=Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\PDV-QA' -PassThru -Wait
          if($p.ExitCode -ne 0){throw 'Atualizacao via instalador falhou'}
          foreach($name in $before.Keys){if((Get-FileHash (Join-Path $data $name)).Hash -ne $before[$name]){throw "Atualizacao alterou $name"}}
          'PASS: setup novo e reinstalacao preservam os dados locais' | Set-Content setup-preservation-success.txt
      - name: Disponibilizar somente o instalador Z02
        uses: actions/upload-artifact@v4
        with:
          name: Setup_LEAL_INFO_PDV_Z02_GELAMAQ_V10_357
          path: SETUP_PRONTO/Setup_LEAL_INFO_PDV_Z02_GELAMAQ_V10_357.exe
          if-no-files-found: error
          retention-days: 14
