name: Corrigir NOVO PEDIDO 001 - Windows e atualizador interno
on:
  push:
    branches: ['feature/setup-seguro-001']
    paths: ['KitchenForm.cs', 'qa/kitchen-new-order/**', '.github/workflows/novo_pedido_001.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: novo-pedido-001
  cancel-in-progress: false
jobs:
  validar:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: '001'
      SOURCE_REF: ${{ github.sha }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with: {path: source}
      - uses: actions/checkout@v4
        with:
          ref: b95da478624312a5070e9ee512e156b3a9dcb858
          path: controller
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.401'}
      - name: Preparar exclusivamente 001 com dependencias aprovadas
        working-directory: controller
        shell: pwsh
        run: |
          '{"sdk":{"version":"10.0.401","rollForward":"disable"}}'|Set-Content global.json -Encoding UTF8
          python scripts/distribute_channels.py plan
          if($LASTEXITCODE -ne 0){throw 'Plan failed'}
          $plan=Get-Content release-plan.json -Raw|ConvertFrom-Json
          if($plan.Entries.Count -ne 1 -or $plan.Entries[0].Channel -ne '001' -or $plan.Entries[0].Version -ne '10.417'){throw 'Wrong scope'}
          python scripts/distribute_channels.py prepare 001
          if($LASTEXITCODE -ne 0){throw 'Prepare failed'}
          Push-Location candidate
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
          Pop-Location
      - name: Reproduzir clique sem resposta na 10.416 R2 e testar correcao
        working-directory: controller
        shell: pwsh
        run: |
          $fixed=[IO.File]::ReadAllText((Join-Path $PWD 'candidate/KitchenForm.cs'))
          try {
            $old=git -C candidate show 6bdc0772520720a07cbcae7ff102a99ebd6e4caa:KitchenForm.cs
            [IO.File]::WriteAllText((Join-Path $PWD 'candidate/KitchenForm.cs'),($old -join "`n"))
            dotnet run --project candidate/qa/kitchen-new-order/NewOrderTests.csproj -c Release -- --baseline 2>&1|Tee-Object baseline.log
            if($LASTEXITCODE -ne 0){throw 'Baseline reproduction failed'}
          } finally {[IO.File]::WriteAllText((Join-Path $PWD 'candidate/KitchenForm.cs'),$fixed)}
          dotnet run --project candidate/qa/kitchen-new-order/NewOrderTests.csproj -c Release 2>&1|Tee-Object fixed.log
          if($LASTEXITCODE -ne 0){throw 'New order regression failed'}
      - name: Compilar e conferir pacote incremental sem setup
        working-directory: controller
        shell: pwsh
        run: |
          $sdk=Get-Content sdk-version.txt
          dotnet publish candidate/LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -p:WindowsSdkPackageVersion=$sdk -o candidate-publish
          if($LASTEXITCODE -ne 0){throw 'Publish compilation failed'}
          python scripts/distribute_channels.py package 001
          if($LASTEXITCODE -ne 0){throw 'Dependency compatibility failed'}
          $m=Get-Content release-output/candidate.json -Raw|ConvertFrom-Json
          $package=Join-Path $PWD ('release-output/'+$m.Package)
          dotnet run --project candidate/qa/channel-isolation/LealInfoPDV.ChannelTests.csproj -c Release 2>&1|Tee-Object channel.log
          if($LASTEXITCODE -ne 0){throw 'Channel selection failed'}
          dotnet run --project candidate/qa/network/LealInfoPDV.NetworkTests.csproj -c Release -- --validate-package $package 2>&1|Tee-Object payload.log
          if($LASTEXITCODE -ne 0){throw 'Payload validation failed'}
          python scripts/distribute_channels.py passed
          if($LASTEXITCODE -ne 0){throw 'Evidence failed'}
          Copy-Item release-plan.json release-output/
      - uses: actions/upload-artifact@v4
        with: {name: candidate-001, path: controller/release-output/}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novo-pedido-001-windows
          path: |
            controller/*.log
            controller/new-order-evidence/
  publicar:
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: b95da478624312a5070e9ee512e156b3a9dcb858}
      - uses: actions/download-artifact@v4
        with: {name: candidate-001, path: artifacts/candidate-001}
      - name: Publicar somente bytes testados no feed 001
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        shell: bash
        run: |
          cp artifacts/candidate-001/release-plan.json release-plan.json
          python scripts/distribute_channels.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: publication-evidence-001, path: publication-evidence/}
