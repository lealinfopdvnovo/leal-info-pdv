name: Preparar Cozinha Premium 001 - Windows sem publicacao
on:
  push:
    branches: ['feature/setup-seguro-001']
    paths: ['Kitchen*.cs', 'ReadyKitchen*.cs', 'ready-kitchen/**', 'scripts/prepare_ready_kitchen.py', 'qa/kitchen-new-order/**', '.github/workflows/novo_pedido_001.yml']
permissions:
  contents: read
concurrency:
  group: novo-pedido-001
  cancel-in-progress: true
jobs:
  validar:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with: {path: candidate}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.401'}
      - name: Preparar compilacao isolada sem canal de publicacao
        working-directory: candidate
        shell: pwsh
        run: |
          '{"sdk":{"version":"10.0.401","rollForward":"disable"}}'|Set-Content global.json -Encoding UTF8
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
      - name: Preparar fotos licenciadas existentes
        timeout-minutes: 5
        shell: pwsh
        run: |
          python candidate/scripts/prepare_ready_kitchen.py
          if($LASTEXITCODE -ne 0){throw 'Photo preparation failed'}
      - name: Testar interface mesas catalogo e pedidos reais Windows
        timeout-minutes: 4
        shell: pwsh
        run: |
          dotnet run --project candidate/qa/kitchen-new-order/NewOrderTests.csproj -c Release 2>&1|Tee-Object premium-windows.log
          if($LASTEXITCODE -ne 0){throw 'Premium Windows tests failed'}
      - name: Compilar aplicacao Windows sem gerar atualizacao
        shell: pwsh
        run: |
          dotnet publish candidate/LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -o candidate-publish
          if($LASTEXITCODE -ne 0){throw 'Windows compilation failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cozinha-premium-001-preparacao
          path: |
            premium-windows.log
            new-order-evidence/
# Intentionally no publication job, update token, installer, or feed mutation.
# Visual comparison and rollback validation remain mandatory before a future release.
