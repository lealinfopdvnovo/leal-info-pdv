name: Vidracaria parametrica 003 - QA sem publicacao
on:
  push:
    branches: ['qa/vidracaria-parametrico-003']
permissions: {contents: read}
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Validar isolamento e metadados
        shell: python
        run: |
          import subprocess
          base='317d1282f1dbeb31db30cdc086e908f37789fdb1'
          allowed={'.github/workflows/validar_vidracaria_parametrico.yml', 'GlassProjectForm.cs', 'qa/kitchen/Program.cs', 'qa/glass/Program.cs', 'GlassWorkshopForm.cs', 'LealInfoPDV.csproj', 'GlassProject.cs', '.github/workflows/publicar_vidracaria_003.yml', 'qa/glass/LealInfoPDV.GlassTests.csproj', 'UpdateManager.cs', 'GlassWindowRenderer.cs', 'GlassProjectPrint.cs'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert changed==allowed,changed
          for n in ['MainForm.cs','GlassWorkshopIcon.cs','LoginForm.cs','Auth.cs','Database.cs','ClientUpdateIdentity.cs','Assets/kitchen.png','Assets/services.png']:
              assert subprocess.check_output(['git','show',base+':'+n])==subprocess.check_output(['git','show','HEAD:'+n]),n
          for n in ['UpdateManager.cs','LealInfoPDV.csproj']:
              assert subprocess.check_output(['git','show',base+':'+n]).replace(b'10.380',b'10.381')==subprocess.check_output(['git','show','HEAD:'+n]),n
      - name: Build e testes Windows antes de publicar
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
          dotnet build LealInfoPDV.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Build falhou'}
          dotnet run --project qa/kitchen/LealInfoPDV.KitchenTests.csproj -c Release -- --global
          if($LASTEXITCODE -ne 0){throw 'Testes falharam'}
          dotnet run --project qa/glass/LealInfoPDV.GlassTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Testes parametricos falharam'}
          Invoke-WebRequest 'https://github.com/lealinfopdvnovo/leal-info-pdv-updates/releases/download/client-003-v10.380/LEAL_INFO_PDV_003_V10_380_UPDATE.zip' -OutFile baseline.zip
          if((Get-FileHash baseline.zip).Hash.ToLowerInvariant() -ne '444b6a46080e8207cbee8c4a73e78179e0359e43080d8c29e2f93f001a3f4948'){throw 'Baseline mudou'}
          Expand-Archive baseline.zip baseline
          $deps=Get-Content baseline/LealInfoPDV.deps.json -Raw|ConvertFrom-Json
          $sdk=$deps.libraries.PSObject.Properties.Name|Where-Object {$_ -like 'runtimepack.Microsoft.Windows.SDK.NET.Ref/*'}|Select-Object -First 1
          if(!$sdk){throw 'SDK nao encontrado'}
          dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -p:WindowsSdkPackageVersion=$($sdk.Split('/')[1]) -o publish
          if($LASTEXITCODE -ne 0){throw 'Publish build falhou'}
          New-Item -ItemType Directory package|Out-Null
          'LealInfoPDV.exe','LealInfoPDV.dll','LealInfoPDV.deps.json'|ForEach-Object {Copy-Item "publish/$_" package/}
          $before=Get-Content baseline/LealInfoPDV.deps.json -Raw|ConvertFrom-Json -AsHashtable
          $after=Get-Content package/LealInfoPDV.deps.json -Raw|ConvertFrom-Json -AsHashtable
          $old=@($before.libraries.Keys|Where-Object {$_ -notlike 'LealInfoPDV/*'}|Sort-Object)
          $new=@($after.libraries.Keys|Where-Object {$_ -notlike 'LealInfoPDV/*'}|Sort-Object)
          if(Compare-Object $old $new){throw 'Dependencias mudaram'}
          Compress-Archive package/* LEAL_INFO_PDV_003_V10_381_UPDATE.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidracaria-parametrico-003-QA
          path: |
            kitchen-evidencias/
            glass-evidencias/
            LEAL_INFO_PDV_003_V10_381_UPDATE.zip
          retention-days: 14
