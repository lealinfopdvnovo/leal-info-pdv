name: Validar barra backup exclusiva
on:
  push:
    branches: [qa/backup-progress-casa-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar candidato sem publicar
        run: dotnet build LealInfoPDV.csproj -c Release
      - name: Testar janela de backup no Windows
        run: dotnet run --project qa/backup-progress/Probe.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: candidato-barra-backup
          path: bin/Release/
