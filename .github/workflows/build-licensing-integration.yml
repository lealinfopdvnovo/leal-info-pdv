name: Validar Licenciamento LEAL INFO PDV

on:
  workflow_dispatch:
  push:
    branches:
      - licenciamento-v1
    paths:
      - 'LicenseManager.cs'
      - 'LicenseFeatures.cs'
      - 'LicenseActivationForm.cs'
      - 'LiaCore.cs'
      - 'LiaAiClient.cs'
      - 'Program.cs'
      - 'LealInfoPDV.csproj'
      - 'tools/LealInfoLicenseGenerator/LicenseSigner.cs'
      - 'tools/LicenseCompatibilityCheck/**'
      - '.github/workflows/build-licensing-integration.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar PDV
        run: dotnet restore LealInfoPDV.csproj

      - name: Compilar PDV com licenciamento
        run: dotnet build LealInfoPDV.csproj -c Release --no-restore

      - name: Restaurar teste de compatibilidade
        run: dotnet restore tools/LicenseCompatibilityCheck/LicenseCompatibilityCheck.csproj

      - name: Testar serial real do gerador no validador do PDV
        run: dotnet run --project tools/LicenseCompatibilityCheck/LicenseCompatibilityCheck.csproj -c Release --no-restore
