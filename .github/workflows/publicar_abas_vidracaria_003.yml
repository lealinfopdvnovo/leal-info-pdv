name: Abas e tema Vidracaria 003 - publicar 10.387
on:
  push:
    branches: ['release/vidracaria-abas-003-10387']
permissions: {contents: read}
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Validar isolamento e metadados
        shell: python
        run: |
          import subprocess
          base='640ac793fa3a65adce547b2aed692d5b5ff93a0c'
          allowed={'GlassWorkshopForm.cs','GlassProjectForm.cs','GlassQuoteForm.cs','MainForm.cs','qa/glass/Program.cs','qa/glass-tabs/Program.cs','qa/glass-tabs/LealInfoPDV.GlassTabsTests.csproj','LealInfoPDV.csproj','UpdateManager.cs','.github/workflows/publicar_abas_vidracaria_003.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert changed==allowed,changed
          for n in ['GlassQuote.cs','GlassProject.cs','GlassProjectPrint.cs','GlassWindowRenderer.cs','GlassBox3DView.cs','GlassWorkshopIcon.cs','LoginForm.cs','Auth.cs','Database.cs','ClientUpdateIdentity.cs','Assets/kitchen.png','Assets/services.png','SalesDialogTheme.cs']:
              assert subprocess.check_output(['git','show',base+':'+n])==subprocess.check_output(['git','show','HEAD:'+n]),n
          for n in ['UpdateManager.cs','LealInfoPDV.csproj']:
              assert subprocess.check_output(['git','show',base+':'+n]).replace(b'10.386',b'10.387')==subprocess.check_output(['git','show','HEAD:'+n]),n
          main=subprocess.check_output(['git','show',base+':MainForm.cs']).decode()
          current=subprocess.check_output(['git','show','HEAD:MainForm.cs']).decode()
          assert current==main.replace("using var form = new GlassWorkshopForm();","using var form = new GlassWorkshopForm(dialog =>\n        {\n            ApplyFloatingTheme(dialog);\n            if (!Application.OpenForms.Cast<Form>().Any(x => x.Name == \"SalesForm\"))\n                SalesDialogTheme.Apply(dialog, GetSetting(\"sales_theme\", \"Futurista Azul\"), null);\n        });")
          print('PASS isolamento: calculos/renderizadores/licenca/banco intactos; tema nativo sem modificar rotina')
      - name: Build e testes Windows antes de publicar
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
          ./scripts/aplicar_lic_ai_botao_v10_186.ps1
          ./scripts/aplicar_lic_ai_estado_v10_210.ps1
          ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
          ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
          ./scripts/aplicar_central_equipamentos_v10_314.ps1
          dotnet build LealInfoPDV.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Build falhou'}
          if($env:GITHUB_ACTIONS -ne 'true'){throw 'Exige runner descartavel'}
          $tests=Get-ChildItem qa -Recurse -Filter '*.csproj' | Where-Object {$_.FullName -notmatch '[\\/]speedfood[\\/]'}
          foreach($test in $tests){
            $sandbox=Join-Path $env:LOCALAPPDATA 'LealInfoPDV'
            if([IO.Path]::GetFileName($sandbox) -ne 'LealInfoPDV'){throw 'Pasta inesperada'}
            if(Test-Path $sandbox){Remove-Item $sandbox -Recurse -Force}
            Write-Host ('TEST SUITE '+$test.FullName)
            $argsExtra=@()
            if($test.FullName -match '[\\/]kitchen[\\/]'){$argsExtra=@('--','--global')}
            dotnet run --project $test.FullName -c Release @argsExtra
            if($LASTEXITCODE -ne 0){throw ('Suite falhou: '+$test.FullName)}
          }
          Write-Host 'PASS suites locais; SpeedFood/Firebase online nao executado para preservar escopo'
          Invoke-WebRequest 'https://github.com/lealinfopdvnovo/leal-info-pdv-updates/releases/download/client-003-v10.386/LEAL_INFO_PDV_003_V10_386_UPDATE.zip' -OutFile baseline.zip
          if((Get-FileHash baseline.zip).Hash.ToLowerInvariant() -ne 'b1354654ff5c6508a488df04087fecb76cfe0e6c0031a160f72f1de94b96a87c'){throw 'Baseline mudou'}
          Expand-Archive baseline.zip baseline
          $deps=Get-Content baseline/LealInfoPDV.deps.json -Raw|ConvertFrom-Json
          $sdk=$deps.libraries.PSObject.Properties.Name|Where-Object {$_ -like 'runtimepack.Microsoft.Windows.SDK.NET.Ref/*'}|Select-Object -First 1
          if(!$sdk){throw 'SDK nao encontrado'}
          dotnet publish LealInfoPDV.csproj -c Release -r win-x64 --self-contained true -p:WindowsSdkPackageVersion=$($sdk.Split('/')[1]) -o publish
          if($LASTEXITCODE -ne 0){throw 'Publish build falhou'}
          New-Item -ItemType Directory package|Out-Null
          'LealInfoPDV.exe','LealInfoPDV.dll','LealInfoPDV.deps.json'|ForEach-Object {Copy-Item "publish/$_" package/}
          $before=Get-Content baseline/LealInfoPDV.deps.json -Raw|ConvertFrom-Json -AsHashtable
          $after=Get-Content package/LealInfoPDV.deps.json -Raw|ConvertFrom-Json -AsHashtable
          $old=@($before.libraries.Keys|Where-Object {$_ -notlike 'LealInfoPDV/*'}|Sort-Object)
          $new=@($after.libraries.Keys|Where-Object {$_ -notlike 'LealInfoPDV/*'}|Sort-Object)
          if(Compare-Object $old $new){throw 'Dependencias mudaram'}
          Compress-Archive package/* LEAL_INFO_PDV_003_V10_387_UPDATE.zip
      - name: Publicar somente canal 003 com guarda concorrencial
        shell: pwsh
        env: {GH_TOKEN: '${{ secrets.UPDATE_REPO_TOKEN }}'}
        run: |
          $ErrorActionPreference='Stop'
          $repo='lealinfopdvnovo/leal-info-pdv-updates'
          $protected=@{}
          foreach($p in @('version.json','clients/001/version.json','clients/002/version.json')){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Feed protegido nao pode ser lido'}
            $protected[$p]=$v.sha
          }
          $fourBefore=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExists=$LASTEXITCODE -eq 0
          if($fourExists){$fourSha=($fourBefore|ConvertFrom-Json).sha}
          $entry=gh api "repos/$repo/contents/clients/003/version.json"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw '003 nao pode ser lido'}
          $old=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($entry.content))|ConvertFrom-Json
          if($old.Version -ne '10.386' -or $old.TargetClientCode -ne '003' -or $old.Sha256 -ne 'b1354654ff5c6508a488df04087fecb76cfe0e6c0031a160f72f1de94b96a87c'){throw 'Canal 003 mudou; abortar'}
          $tags=gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[].tag_name'
          if($LASTEXITCODE -ne 0 -or 'client-003-v10.387' -in @($tags)){throw 'Release existente ou auditoria falhou'}
          $package='LEAL_INFO_PDV_003_V10_387_UPDATE.zip'
          $notes='V10.387 exclusiva 003: projeto, cliente, medidas e calculos organizados nas abas da Central de Vidracaria; campos e botoes com tema nativo do PDV. Fonte unica, 2D/3D e A4 preservados. Sem alteracao de calculos, licenciamento ou banco. Homologacao fisica pendente.'
          $notes|Set-Content notes.txt
          gh release create client-003-v10.387 $package --repo $repo --title 'LEAL INFO PDV 003 V10.387 - Central organizada' --notes-file notes.txt --latest=false
          if($LASTEXITCODE -ne 0){throw 'Pacote nao publicado; nao mudar feed'}
          $m=@{Version='10.387';TargetClientCode='003';PackageUrl="https://github.com/$repo/releases/download/client-003-v10.387/$package";Sha256=(Get-FileHash $package).Hash.ToLowerInvariant();SourceCommit=$env:GITHUB_SHA;Notes=$notes;Mandatory=$false}
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($m|ConvertTo-Json)))
          @{message='Central Vidracaria 10.387 somente 003';sha=$entry.sha;content=$content}|ConvertTo-Json -Compress|Set-Content request.json
          gh api --method PUT "repos/$repo/contents/clients/003/version.json" --input request.json
          if($LASTEXITCODE -ne 0){throw 'Manifest nao publicado'}
          foreach($p in $protected.Keys){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or $v.sha -ne $protected[$p]){throw 'Feed protegido mudou'}
          }
          $fourAfter=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExistsAfter=$LASTEXITCODE -eq 0
          if($fourExistsAfter -ne $fourExists){throw '004 mudou'}
          if($fourExists -and ($fourAfter|ConvertFrom-Json).sha -ne $fourSha){throw '004 mudou'}
          $url="https://raw.githubusercontent.com/$repo/main/clients/003/version.json"
          for($i=0;$i -lt 24;$i++){
            $live=Invoke-RestMethod ($url+'?t='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())
            if($live.Version -eq '10.387' -and $live.TargetClientCode -eq '003'){break}
            Start-Sleep -Seconds 5
          }
          if($live.Version -ne '10.387' -or $live.Sha256 -ne $m.Sha256){throw 'Manifest nao propagou'}
          Invoke-WebRequest $live.PackageUrl -OutFile verificado.zip
          if((Get-FileHash verificado.zip).Hash.ToLowerInvariant() -ne $live.Sha256){throw 'Hash publicado incorreto'}
          Write-Host 'PASS PUBLICADO 003 10.387; hash remoto confirmado; global 001 002 intactos'
          exit 0
      - name: Conferir deteccao REAL pelo updater
        shell: pwsh
        run: |
          $qa=Get-Content qa/glass/Program.cs -Raw
          $qa=$qa.Replace('10.383','10.387').Replace('10.379','10.385')
          [IO.File]::WriteAllText((Join-Path $PWD 'qa/glass/Program.cs'),$qa)
          dotnet run --project qa/glass/LealInfoPDV.GlassTests.csproj -c Release -- --live
          if($LASTEXITCODE -ne 0){throw 'Deteccao real falhou'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidracaria-003-10387
          path: |
            kitchen-evidencias/
            glass-evidencias/
            glass3d-evidencias/
            glass-tabs-evidencias/
            LEAL_INFO_PDV_003_V10_387_UPDATE.zip
          retention-days: 14
