name: Abas e tema Vidracaria 003 - publicar 10.390
on:
  push:
    branches: ['release/vidracaria-unidades-editar-003-10390']
permissions: {contents: read, actions: read}
concurrency:
  group: unidades-editar-003
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Validar isolamento e metadados
        shell: python
        run: |
          import subprocess
          base='d2f99f3ffa6820ae3b5bb41c2f8519077af71bb4'
          allowed=set(["GlassProjectForm.cs","GlassCutPlanForm.cs","GlassWorkshopVisuals.cs","GlassDimensionUnits.cs","GlassDimensionField.cs","GlassCutPieceEditor.cs","LealInfoPDV.csproj","UpdateManager.cs","qa/glass-cotas/Program.cs","qa/kitchen/Program.cs","qa/glass-units/Program.cs","qa/glass-units/LealInfoPDV.GlassUnitsTests.csproj",".github/workflows/publicar_abas_vidracaria_003.yml"])
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert changed==allowed,changed
          for n in ['GlassCutPlan.cs','GlassWorkshopForm.cs','GlassBox3DView.cs','Glass3DTechnicalOverlay.cs','GlassCutDrawingView.cs','GlassCutPlanPrint.cs','MainForm.cs','GlassQuote.cs','GlassQuoteForm.cs','GlassProject.cs','GlassProjectPrint.cs','GlassWindowRenderer.cs','GlassCommercialDocument.cs','GlassMaterialSelection.cs','LoginForm.cs','Auth.cs','Database.cs','ClientUpdateIdentity.cs','SalesVisuals.cs','SalesDialogTheme.cs','Assets/kitchen.png','Assets/services.png']:
              assert subprocess.check_output(['git','show',base+':'+n])==subprocess.check_output(['git','show','HEAD:'+n]),n
          for n in ['UpdateManager.cs','LealInfoPDV.csproj']:
              assert subprocess.check_output(['git','show',base+':'+n]).replace(b'10.389',b'10.390')==subprocess.check_output(['git','show','HEAD:'+n]),n
          print('PASS preservacao byte a byte: packing/desenhos/cotas/calculos/impressao/PDF/licenca/banco/updater')
      - name: Exigir validação Windows concluída e fonte idêntica
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $r=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/38390138396"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $r.conclusion -ne 'success' -or $r.head_sha -ne '04bce2a13c39402b1bea9ffea047430d9f210dad'){throw 'Validação não aprovada'}
          $changes=@(git diff --name-only 04bce2a13c39402b1bea9ffea047430d9f210dad HEAD)
          if($changes.Count -ne 1 -or $changes[0] -ne '.github/workflows/publicar_abas_vidracaria_003.yml'){throw 'Código diverge do pacote testado'}
      - uses: actions/download-artifact@v4
        with:
          name: vidracaria-003-10390
          run-id: 38390138396
          github-token: '${{ github.token }}'
          path: validado
      - name: Usar exatamente pacote validado automaticamente
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='LEAL_INFO_PDV_003_V10_390_UPDATE.zip'
          Copy-Item "validado/$name" $name
          if((Get-FileHash $name).Hash.ToLowerInvariant() -ne 'fb0a038e274485648193354b24e48625cfce23e7220ebd26710b4562d4479457'){throw 'Pacote validado divergiu'}
          Expand-Archive $name conferir
          $files=@(Get-ChildItem conferir -Recurse -File|ForEach-Object {$_.Name}|Sort-Object)
          $expected=@('LealInfoPDV.deps.json','LealInfoPDV.dll','LealInfoPDV.exe')
          if(Compare-Object $files $expected){throw 'Arquivos proibidos no pacote'}
      - name: Publicar somente canal 003 com guarda concorrencial
        shell: pwsh
        env: {GH_TOKEN: '${{ secrets.UPDATE_REPO_TOKEN }}', SOURCE_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'
          $head=(Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/$env:GITHUB_REF_NAME" -Headers @{Authorization="Bearer $env:SOURCE_TOKEN"}).object.sha
          if($head -ne $env:GITHUB_SHA){throw 'Candidato superado'}
          $repo='lealinfopdvnovo/leal-info-pdv-updates'
          $protected=@{}
          foreach($p in @('version.json','clients/001/version.json','clients/002/version.json')){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Feed protegido nao pode ser lido'}
            $protected[$p]=$v.sha
          }
          $fourBefore=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExists=$LASTEXITCODE -eq 0
          if($fourExists){$fourSha=($fourBefore|ConvertFrom-Json).sha}
          $entry=gh api "repos/$repo/contents/clients/003/version.json"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw '003 nao pode ser lido'}
          $old=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($entry.content))|ConvertFrom-Json
          if($old.Version -ne '10.389' -or $old.TargetClientCode -ne '003' -or $old.Sha256 -ne 'eceb78a65927d2857c437caac390f1570e7e3fee8666a597a178ef051b97fd87'){throw 'Canal 003 mudou; abortar'}
          $tags=gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[].tag_name'
          if($LASTEXITCODE -ne 0 -or 'client-003-v10.390' -in @($tags)){throw 'Release existente ou auditoria falhou'}
          $package='LEAL_INFO_PDV_003_V10_390_UPDATE.zip'
          $notes='V10.390 exclusiva 003: seletor mm/cm/m individual nas dimensões editáveis do projeto, chapa e peças, com conversão interna em mm preservando dimensão física; botão EDITAR PEÇA e edição direta na grade mantida. Packing, 2D/3D, cotas, impressões, PDF, cálculos, banco, licença e lógica do updater preservados. Aguardando homologação real do usuário.'
          $notes|Set-Content notes.txt
          gh release create client-003-v10.390 $package --repo $repo --title 'LEAL INFO PDV 003 V10.390 - Unidades individuais e Editar peça' --notes-file notes.txt --latest=false
          if($LASTEXITCODE -ne 0){throw 'Pacote nao publicado; nao mudar feed'}
          $m=@{Version='10.390';TargetClientCode='003';PackageUrl="https://github.com/$repo/releases/download/client-003-v10.390/$package";Sha256=(Get-FileHash $package).Hash.ToLowerInvariant();SourceCommit=$env:GITHUB_SHA;Notes=$notes;Mandatory=$false}
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($m|ConvertTo-Json)))
          @{message='Unidades e edição de peça 10.390 somente 003';sha=$entry.sha;content=$content}|ConvertTo-Json -Compress|Set-Content request.json
          gh api --method PUT "repos/$repo/contents/clients/003/version.json" --input request.json
          if($LASTEXITCODE -ne 0){throw 'Manifest nao publicado'}
          foreach($p in $protected.Keys){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or $v.sha -ne $protected[$p]){throw 'Feed protegido mudou'}
          }
          $fourAfter=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExistsAfter=$LASTEXITCODE -eq 0
          if($fourExistsAfter -ne $fourExists){throw '004 mudou'}
          if($fourExists -and ($fourAfter|ConvertFrom-Json).sha -ne $fourSha){throw '004 mudou'}
          $url="https://raw.githubusercontent.com/$repo/main/clients/003/version.json"
          for($i=0;$i -lt 24;$i++){
            $live=Invoke-RestMethod ($url+'?t='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())
            if($live.Version -eq '10.390' -and $live.TargetClientCode -eq '003'){break}
            Start-Sleep -Seconds 5
          }
          if($live.Version -ne '10.390' -or $live.Sha256 -ne $m.Sha256){throw 'Manifest nao propagou'}
          Invoke-WebRequest $live.PackageUrl -OutFile verificado.zip
          if((Get-FileHash verificado.zip).Hash.ToLowerInvariant() -ne $live.Sha256){throw 'Hash publicado incorreto'}
          Write-Host 'PASS PUBLICADO 003 10.390; hash remoto confirmado; global 001 002 intactos'
          exit 0
      - name: Conferir deteccao REAL pelo updater
        shell: pwsh
        run: |
          $qa=Get-Content qa/glass/Program.cs -Raw
          $qa=$qa.Replace('10.383','10.390').Replace('10.379','10.385')
          [IO.File]::WriteAllText((Join-Path $PWD 'qa/glass/Program.cs'),$qa)
          dotnet run --project qa/glass/LealInfoPDV.GlassTests.csproj -c Release -- --live
          if($LASTEXITCODE -ne 0){throw 'Deteccao real falhou'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidracaria-003-10390
          path: |
            kitchen-evidencias/
            glass-evidencias/
            glass3d-evidencias/
            glass-tabs-evidencias/
            glass-commercial-evidencias/
            LEAL_INFO_PDV_003_V10_390_UPDATE.zip
          retention-days: 14
