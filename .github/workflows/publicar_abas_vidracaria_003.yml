name: Abas e tema Vidracaria 003 - publicar 10.388
on:
  push:
    branches: ['release/vidracaria-comercial-003-10388']
permissions: {contents: read, actions: read}
concurrency:
  group: comercial-003
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Validar isolamento e metadados
        shell: python
        run: |
          import subprocess
          base='29c33b12b7d4336274cbf29c1c3fb011ed020840'
          allowed={'GlassWorkshopForm.cs','GlassProjectForm.cs','GlassQuoteForm.cs','GlassMaterialSelection.cs','GlassCommercialDocument.cs','GlassWorkshopVisuals.cs','qa/glass-commercial/Program.cs','qa/glass-commercial/LealInfoPDV.GlassCommercialTests.csproj','LealInfoPDV.csproj','UpdateManager.cs','.github/workflows/publicar_abas_vidracaria_003.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert changed==allowed,changed
          for n in ['MainForm.cs','GlassQuote.cs','GlassProject.cs','GlassProjectPrint.cs','GlassWindowRenderer.cs','GlassBox3DView.cs','LoginForm.cs','Auth.cs','Database.cs','ClientUpdateIdentity.cs','SalesVisuals.cs','SalesDialogTheme.cs']:
              assert subprocess.check_output(['git','show',base+':'+n])==subprocess.check_output(['git','show','HEAD:'+n]),n
          for n in ['UpdateManager.cs','LealInfoPDV.csproj']:
              assert subprocess.check_output(['git','show',base+':'+n]).replace(b'10.387',b'10.388')==subprocess.check_output(['git','show','HEAD:'+n]),n
          print('PASS isolamento: calculos/renderizadores/licenca/banco intactos; tema nativo sem modificar rotina')
      - name: Exigir validação Windows concluída e fonte idêntica
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $r=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/38324691394"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $r.conclusion -ne 'success' -or $r.head_sha -ne 'f36bcab1601e58b969d700f539a3878c48789770'){throw 'Validação não aprovada'}
          $changes=@(git diff --name-only f36bcab1601e58b969d700f539a3878c48789770 HEAD)
          if($changes.Count -ne 1 -or $changes[0] -ne '.github/workflows/publicar_abas_vidracaria_003.yml'){throw 'Código diverge do pacote testado'}
      - uses: actions/download-artifact@v4
        with:
          name: vidracaria-003-10388
          run-id: 38324691394
          github-token: '${{ github.token }}'
          path: validado
      - name: Usar exatamente pacote homologado automaticamente
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='LEAL_INFO_PDV_003_V10_388_UPDATE.zip'
          Copy-Item "validado/$name" $name
          if((Get-FileHash $name).Hash.ToLowerInvariant() -ne '63c594976eed5bec65f6b92f8903d9b630f982b82ccfcc2b6b4298117a03f3dc'){throw 'Pacote validado divergiu'}
          Expand-Archive $name conferir
          $files=@(Get-ChildItem conferir -Recurse -File|ForEach-Object {$_.Name}|Sort-Object)
          $expected=@('LealInfoPDV.deps.json','LealInfoPDV.dll','LealInfoPDV.exe')
          if(Compare-Object $files $expected){throw 'Arquivos proibidos no pacote'}
      - name: Publicar somente canal 003 com guarda concorrencial
        shell: pwsh
        env: {GH_TOKEN: '${{ secrets.UPDATE_REPO_TOKEN }}', SOURCE_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'
          $head=(Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/$env:GITHUB_REF_NAME" -Headers @{Authorization="Bearer $env:SOURCE_TOKEN"}).object.sha
          if($head -ne $env:GITHUB_SHA){throw 'Candidato superado'}
          $repo='lealinfopdvnovo/leal-info-pdv-updates'
          $protected=@{}
          foreach($p in @('version.json','clients/001/version.json','clients/002/version.json')){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Feed protegido nao pode ser lido'}
            $protected[$p]=$v.sha
          }
          $fourBefore=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExists=$LASTEXITCODE -eq 0
          if($fourExists){$fourSha=($fourBefore|ConvertFrom-Json).sha}
          $entry=gh api "repos/$repo/contents/clients/003/version.json"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw '003 nao pode ser lido'}
          $old=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($entry.content))|ConvertFrom-Json
          if($old.Version -ne '10.387' -or $old.TargetClientCode -ne '003' -or $old.Sha256 -ne '562eed0c9b569f4222a65bb9409d36dbc9c5bd1c970c58f6d6242bfd4828603f'){throw 'Canal 003 mudou; abortar'}
          $tags=gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[].tag_name'
          if($LASTEXITCODE -ne 0 -or 'client-003-v10.388' -in @($tags)){throw 'Release existente ou auditoria falhou'}
          $package='LEAL_INFO_PDV_003_V10_388_UPDATE.zip'
          $notes='V10.388 exclusiva 003: componentes nativos da venda, busca informativa de materiais existentes, orçamento comercial PDF/A4 local. Fonte unica, 2D/3D e A4 preservados. Sem alteracao de calculos, licenciamento ou banco. Homologacao fisica pendente.'
          $notes|Set-Content notes.txt
          gh release create client-003-v10.388 $package --repo $repo --title 'LEAL INFO PDV 003 V10.388 - Central organizada' --notes-file notes.txt --latest=false
          if($LASTEXITCODE -ne 0){throw 'Pacote nao publicado; nao mudar feed'}
          $m=@{Version='10.388';TargetClientCode='003';PackageUrl="https://github.com/$repo/releases/download/client-003-v10.388/$package";Sha256=(Get-FileHash $package).Hash.ToLowerInvariant();SourceCommit=$env:GITHUB_SHA;Notes=$notes;Mandatory=$false}
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($m|ConvertTo-Json)))
          @{message='Central Vidracaria 10.388 somente 003';sha=$entry.sha;content=$content}|ConvertTo-Json -Compress|Set-Content request.json
          gh api --method PUT "repos/$repo/contents/clients/003/version.json" --input request.json
          if($LASTEXITCODE -ne 0){throw 'Manifest nao publicado'}
          foreach($p in $protected.Keys){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or $v.sha -ne $protected[$p]){throw 'Feed protegido mudou'}
          }
          $fourAfter=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExistsAfter=$LASTEXITCODE -eq 0
          if($fourExistsAfter -ne $fourExists){throw '004 mudou'}
          if($fourExists -and ($fourAfter|ConvertFrom-Json).sha -ne $fourSha){throw '004 mudou'}
          $url="https://raw.githubusercontent.com/$repo/main/clients/003/version.json"
          for($i=0;$i -lt 24;$i++){
            $live=Invoke-RestMethod ($url+'?t='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())
            if($live.Version -eq '10.388' -and $live.TargetClientCode -eq '003'){break}
            Start-Sleep -Seconds 5
          }
          if($live.Version -ne '10.388' -or $live.Sha256 -ne $m.Sha256){throw 'Manifest nao propagou'}
          Invoke-WebRequest $live.PackageUrl -OutFile verificado.zip
          if((Get-FileHash verificado.zip).Hash.ToLowerInvariant() -ne $live.Sha256){throw 'Hash publicado incorreto'}
          Write-Host 'PASS PUBLICADO 003 10.388; hash remoto confirmado; global 001 002 intactos'
          exit 0
      - name: Conferir deteccao REAL pelo updater
        shell: pwsh
        run: |
          $qa=Get-Content qa/glass/Program.cs -Raw
          $qa=$qa.Replace('10.383','10.388').Replace('10.379','10.385')
          [IO.File]::WriteAllText((Join-Path $PWD 'qa/glass/Program.cs'),$qa)
          dotnet run --project qa/glass/LealInfoPDV.GlassTests.csproj -c Release -- --live
          if($LASTEXITCODE -ne 0){throw 'Deteccao real falhou'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidracaria-003-10388
          path: |
            kitchen-evidencias/
            glass-evidencias/
            glass3d-evidencias/
            glass-tabs-evidencias/
            glass-commercial-evidencias/
            LEAL_INFO_PDV_003_V10_388_UPDATE.zip
          retention-days: 14
