name: Vidracaria 003 corte e cotas - publicar 10.389
on:
  push:
    branches: ['release/vidracaria-corte-cotas-003-10389']
permissions: {contents: read, actions: read}
concurrency:
  group: corte-cotas-003
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Validar isolamento e metadados
        shell: python
        run: |
          import subprocess
          base='50f8a3754f40b107f7fc46b4b13141a4eddc695a'
          allowed={'GlassWorkshopForm.cs','GlassProjectForm.cs','GlassWorkshopVisuals.cs','GlassBox3DView.cs','GlassMaterialSelection.cs','GlassCutPlan.cs','GlassCutDrawingView.cs','GlassCutPlanForm.cs','GlassCutPlanPrint.cs','Glass3DTechnicalOverlay.cs','LealInfoPDV.csproj','UpdateManager.cs','qa/glass-cut/Program.cs','qa/glass-cut/LealInfoPDV.GlassCutTests.csproj','qa/glass-cotas/Program.cs','qa/glass-cotas/LealInfoPDV.GlassCotasTests.csproj','qa/glass-cotas/BaselineGlassBox3DView.cs','.github/workflows/publicar_abas_vidracaria_003.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert changed==allowed,changed
          for n in ['MainForm.cs','GlassQuote.cs','GlassQuoteForm.cs','GlassProject.cs','GlassProjectPrint.cs','GlassWindowRenderer.cs','GlassCommercialDocument.cs','LoginForm.cs','Auth.cs','Database.cs','ClientUpdateIdentity.cs','SalesVisuals.cs','SalesDialogTheme.cs','Assets/kitchen.png','Assets/services.png']:
              assert subprocess.check_output(['git','show',base+':'+n])==subprocess.check_output(['git','show','HEAD:'+n]),n
          for n in ['UpdateManager.cs','LealInfoPDV.csproj']:
              assert subprocess.check_output(['git','show',base+':'+n]).replace(b'10.388',b'10.389')==subprocess.check_output(['git','show','HEAD:'+n]),n
          old=subprocess.check_output(['git','show',base+':GlassBox3DView.cs']).decode()
          assert old.replace('GlassBox3DView','BaselineGlassBox3DView')==open('qa/glass-cotas/BaselineGlassBox3DView.cs',encoding='utf-8').read()
          print('PASS isolamento: calculos/2D/impressao/PDF/licenca/banco/updater intactos; baseline 3D autentico')
      - name: Exigir validação Windows concluída e fonte idêntica
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $r=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/38330577476"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $r.conclusion -ne 'success' -or $r.head_sha -ne '8931302875943fa2da9f8d97ea3a2f5b67c27322'){throw 'Validação não aprovada'}
          $changes=@(git diff --name-only 8931302875943fa2da9f8d97ea3a2f5b67c27322 HEAD)
          if($changes.Count -ne 1 -or $changes[0] -ne '.github/workflows/publicar_abas_vidracaria_003.yml'){throw 'Código diverge do pacote testado'}
      - uses: actions/download-artifact@v4
        with:
          name: vidracaria-003-10389
          run-id: 38330577476
          github-token: '${{ github.token }}'
          path: validado
      - name: Usar exatamente pacote validado automaticamente
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='LEAL_INFO_PDV_003_V10_389_UPDATE.zip'
          Copy-Item "validado/$name" $name
          if((Get-FileHash $name).Hash.ToLowerInvariant() -ne 'eceb78a65927d2857c437caac390f1570e7e3fee8666a597a178ef051b97fd87'){throw 'Pacote validado divergiu'}
          Expand-Archive $name conferir
          $files=@(Get-ChildItem conferir -Recurse -File|ForEach-Object {$_.Name}|Sort-Object)
          $expected=@('LealInfoPDV.deps.json','LealInfoPDV.dll','LealInfoPDV.exe')
          if(Compare-Object $files $expected){throw 'Arquivos proibidos no pacote'}
      - name: Publicar somente canal 003 com guarda concorrencial
        shell: pwsh
        env: {GH_TOKEN: '${{ secrets.UPDATE_REPO_TOKEN }}', SOURCE_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'
          $head=(Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/$env:GITHUB_REF_NAME" -Headers @{Authorization="Bearer $env:SOURCE_TOKEN"}).object.sha
          if($head -ne $env:GITHUB_SHA){throw 'Candidato superado'}
          $repo='lealinfopdvnovo/leal-info-pdv-updates'
          $protected=@{}
          foreach($p in @('version.json','clients/001/version.json','clients/002/version.json')){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Feed protegido nao pode ser lido'}
            $protected[$p]=$v.sha
          }
          $fourBefore=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExists=$LASTEXITCODE -eq 0
          if($fourExists){$fourSha=($fourBefore|ConvertFrom-Json).sha}
          $entry=gh api "repos/$repo/contents/clients/003/version.json"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw '003 nao pode ser lido'}
          $old=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($entry.content))|ConvertFrom-Json
          if($old.Version -ne '10.388' -or $old.TargetClientCode -ne '003' -or $old.Sha256 -ne '63c594976eed5bec65f6b92f8903d9b630f982b82ccfcc2b6b4298117a03f3dc'){throw 'Canal 003 mudou; abortar'}
          $tags=gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[].tag_name'
          if($LASTEXITCODE -ne 0 -or 'client-003-v10.389' -in @($tags)){throw 'Release existente ou auditoria falhou'}
          $package='LEAL_INFO_PDV_003_V10_389_UPDATE.zip'
          $notes='V10.389 exclusiva 003: plano geométrico de corte editável, chapas 2D, rotação explícita e prévia A4; cotas opcionais de largura/altura no 3D e orientação ilustrativa. 2D, 3D limpo, cálculos, PDF comercial, impressão técnica, licença e banco preservados. Sem regras de fabricação inventadas. Plano em memória; homologação física pendente.'
          $notes|Set-Content notes.txt
          gh release create client-003-v10.389 $package --repo $repo --title 'LEAL INFO PDV 003 V10.389 - Plano de corte e cotas 3D' --notes-file notes.txt --latest=false
          if($LASTEXITCODE -ne 0){throw 'Pacote nao publicado; nao mudar feed'}
          $m=@{Version='10.389';TargetClientCode='003';PackageUrl="https://github.com/$repo/releases/download/client-003-v10.389/$package";Sha256=(Get-FileHash $package).Hash.ToLowerInvariant();SourceCommit=$env:GITHUB_SHA;Notes=$notes;Mandatory=$false}
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($m|ConvertTo-Json)))
          @{message='Plano de corte e cotas 10.389 somente 003';sha=$entry.sha;content=$content}|ConvertTo-Json -Compress|Set-Content request.json
          gh api --method PUT "repos/$repo/contents/clients/003/version.json" --input request.json
          if($LASTEXITCODE -ne 0){throw 'Manifest nao publicado'}
          foreach($p in $protected.Keys){
            $v=gh api "repos/$repo/contents/$p"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or $v.sha -ne $protected[$p]){throw 'Feed protegido mudou'}
          }
          $fourAfter=gh api "repos/$repo/contents/clients/004/version.json" 2>$null
          $fourExistsAfter=$LASTEXITCODE -eq 0
          if($fourExistsAfter -ne $fourExists){throw '004 mudou'}
          if($fourExists -and ($fourAfter|ConvertFrom-Json).sha -ne $fourSha){throw '004 mudou'}
          $url="https://raw.githubusercontent.com/$repo/main/clients/003/version.json"
          for($i=0;$i -lt 24;$i++){
            $live=Invoke-RestMethod ($url+'?t='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())
            if($live.Version -eq '10.389' -and $live.TargetClientCode -eq '003'){break}
            Start-Sleep -Seconds 5
          }
          if($live.Version -ne '10.389' -or $live.Sha256 -ne $m.Sha256){throw 'Manifest nao propagou'}
          Invoke-WebRequest $live.PackageUrl -OutFile verificado.zip
          if((Get-FileHash verificado.zip).Hash.ToLowerInvariant() -ne $live.Sha256){throw 'Hash publicado incorreto'}
          Write-Host 'PASS PUBLICADO 003 10.389; hash remoto confirmado; global 001 002 intactos'
          exit 0
      - name: Conferir deteccao REAL pelo updater
        shell: pwsh
        run: |
          $qa=Get-Content qa/glass/Program.cs -Raw
          $qa=$qa.Replace('10.383','10.389').Replace('10.379','10.385')
          [IO.File]::WriteAllText((Join-Path $PWD 'qa/glass/Program.cs'),$qa)
          dotnet run --project qa/glass/LealInfoPDV.GlassTests.csproj -c Release -- --live
          if($LASTEXITCODE -ne 0){throw 'Deteccao real falhou'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidracaria-003-10389
          path: |
            kitchen-evidencias/
            glass-evidencias/
            glass3d-evidencias/
            glass-tabs-evidencias/
            glass-commercial-evidencias/
            LEAL_INFO_PDV_003_V10_389_UPDATE.zip
          retention-days: 14
