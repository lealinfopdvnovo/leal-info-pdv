name: PET LOJA V1.2 - teste visual isolado
'on':
  push:
    branches: [qa/loja-pet-v12-botao-teste]
permissions:
  contents: read
concurrency:
  group: qa-loja-pet-v12
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.401
    - name: Preparar compilacao com os pre-requisitos existentes
      shell: pwsh
      run: |
        '{"sdk":{"version":"10.0.401","rollForward":"disable"}}'|Set-Content global.json -Encoding UTF8
        ./scripts/aplicar_tema_azul_texturizado_v10_306.ps1
        ./scripts/aplicar_lic_ai_botao_v10_186.ps1
        ./scripts/aplicar_lic_ai_estado_v10_210.ps1
        ./scripts/corrigir_lic_ai_encerrar_com_pdv_v10_223.ps1
        ./scripts/aplicar_cadastro_produtos_avancado_v10_312.ps1
        ./scripts/aplicar_central_equipamentos_v10_314.ps1
    - name: Compilar e testar somente PET LOJA V1.2
      shell: pwsh
      run: |
        dotnet run --project qa/pet-loja-v12/Tests.csproj -c Release -p:UseSharedCompilation=false -p:BuildInParallel=false
        if($LASTEXITCODE -ne 0){throw 'PET visual test failed'}
        $dll='qa/pet-loja-v12/bin/Release/net8.0-windows10.0.19041.0/LealInfoPDV.Pet.001.dll'
        Copy-Item $dll evidence/
        (Get-FileHash $dll -Algorithm SHA256).Hash | Set-Content evidence/PET-SHA256.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: LOJA-PET-V1-2-visual-nao-publicado
        path: evidence/
