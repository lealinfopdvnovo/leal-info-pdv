name: Atualizacao automatica canal GLOBAL
on:
  push:
    branches: ['channel/global']
    paths-ignore: ['README.md']
permissions:
  contents: read
  actions: read
jobs:
  distribuir:
    uses: lealinfopdvnovo/leal-info-pdv/.github/workflows/distribuir_atualizacoes.yml@main
    with:
      channel: 'GLOBAL'
      source: ${{ github.sha }}
    secrets: inherit
